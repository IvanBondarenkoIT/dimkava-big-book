# Dim Kava — local dev (PostgreSQL + Redis)
# Optional: use SQLite for quick start; run this when you need Postgres/Redis.
# Usage: docker-compose up -d
# Then set DATABASE_URL in .env (see .env.example) and docker-compose up -d

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dimkava}
      POSTGRES_USER: ${POSTGRES_USER:-dimkava}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dimkava}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
