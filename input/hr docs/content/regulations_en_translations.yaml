  reg-31298:
    title_en: Regulations on Delivery Notes/Invoices for Customers**
    content_en: '**Regulations on Delivery Notes/Invoices for Customers**


      A tax invoice is a document issued for taxable supply of goods and services.
      The tax invoice contains information such as the quantity of goods purchased
      and the cost of the goods/service. This document is necessary so that the tax
      system reflects the purchased products and/or the customer''s debt.


      Therefore, after selling goods, a Dim Kava employee must request the following
      information from the customer:


      Company name

      Company identification code

      Phone number

      Product name and cost


      This information must be sent to the Dim Kava sales chat so that accounting
      can issue the delivery note and upload it to the RSG system.


      These regulations are mandatory for companies and customers who request a tax
      invoice and pay for goods by bank transfer.


      If you have any questions, please contact your manager. We hope this simple
      and important requirement will be strictly followed and will not lead to violation
      of the above rules.


      Violation of these regulations will be considered a disciplinary offense:


      First violation — warning

      Second violation — fine of 20 lari'
