course:
  title_en: Regulations
  description_en: Company regulations and standards.
lessons:
  title_en: Regulations Quiz
articles:
  reg-31193:
    title_en: Rules for Store Employees Receiving Goods
    content_en: "Rules for Store Employees Receiving Goods\nProduct ordering:\nProduct\
      \ orders for the retail location are placed twice a week (exception: coffee\
      \ machine or coffee for a specific customer). The order must be sent via Telegram\
      \ to the manager — Regina.\nFill out the order form and enter the required items.\
      \ If the product or coffee machine is for a specific customer, indicate this\
      \ in the notes.\nReceiving goods by the employee:\nWhen receiving goods from\
      \ the logistics driver or courier, you must check the integrity of the boxes\
      \ and verify the actual quantity of goods against the quantity stated on the\
      \ delivery note. This removes your liability for penalties related to defective/lost/missing\
      \ goods.\nThe courier or logistics driver waits 15 minutes while you check and\
      \ accept the goods.\nCourier delivery: check the boxes; if they are dented/open/damaged\
      \ — take photos to send to the office and verify the actual quantity against\
      \ the delivery note; report any discrepancy to the office immediately!\nDim\
      \ Kava courier delivery:\nCheck the product expiration date and verify the actual\
      \ quantity against the delivery note; if there are discrepancies — return the\
      \ goods to the logistics driver and notify the office immediately!\nVerify all\
      \ items and mark checkmarks on the goods receipt note. If the goods receipt\
      \ note was not included by the logistics driver, request this document from\
      \ the office manager Regina. Or write the list and quantity of goods that arrived\
      \ yourself and send photos to the office and to Regina.\n \n If an item was\
      \ not received but is listed in the document — cross it out and mark !!!!!!!\n\
      The goods receipt note must be photographed and sent to the office Telegram;\
      \ you must also write a comment in the text of the delivery note:\n\"Everything\
      \ matched!\" — only if all product items match exactly\n\"Crossed out\" — if\
      \ you are refusing an item due to damage or expiration date.\n\"Did not match\"\
      \ — if an item is missing but is listed in the document.\nThese rules are needed\
      \ for further reconciliation of your goods. Failure to comply with this rule\
      \ leads to untimely posting of goods and discrepancies in end-of-month inventory!"
  reg-31194:
    title_en: Rules for On-Site Trainee Training
    content_en: 'Rules for On-Site Trainee Training

      Coffee is used for testing (coffee for testing coffee machines and training
      must be ordered in advance!). We learn frothing on Fairy!! And once skills are
      acquired — we froth with milk — this is written off to the promotional card
      (every location has such a card! In the notes, you must always write which trainee
      was being trained!). The loyalty card is set up for the trainee after approval
      by the head of the sales department, through the office! The trainee tastes
      espresso to gain knowledge of Blasercafe coffee flavor (cappuccino only during
      training)'
  reg-31195:
    title_en: Goods Delivery Regulations!!!
    content_en: '📍Goods Delivery Regulations!!!

      The logistics driver, based on the delivery note from the office (Regina) from
      Granit, collects goods at the warehouse and only after entering the transport
      delivery note in RSG (issued by Lida or Tamuna) may depart for the delivery
      address (either for office clients or to our retail locations). Goods must be
      checked for quantity, box integrity (not broken or damaged), dishes — intact
      (not broken), product expiration dates — good.

      Delivery of goods to any location — strictly according to the delivery note
      (for private clients with an entry in RSG); to Dom Kava retail locations — with
      2 internal delivery notes: 1 remains with employees for reconciliation, 2 is
      taken by the driver with the signature of the employee who accepted the goods
      (confirming that they took responsibility for the received goods)

      If the logistics driver delivers goods without a delivery note — the employee
      has the right not to accept the goods.


      📍Fine of 20 lari for delivering goods without an internal delivery note)


      📍The fine from the government is paid by the employee who departed with goods
      without a transport delivery note!!!(500 lari)

      /////

      📍Goods sent by delivery service must also be entered in RSG!!!'
  reg-31196:
    title_en: REGULATIONS FOR DAILY CASH REGISTER ENTRY IN SHOP-SELLER
    content_en: "REGULATIONS FOR DAILY CASH REGISTER ENTRY IN SHOP-SELLER\nFor quality\
      \ work \n\n\nEvery day we fill in the table in the \nShop-Seller program for\
      \ smooth operation of the retail location and timely response to discrepancies!!\n\
      In the first column \n\U0001F4CD- date\nIn INCOME \n\U0001F4CD- first column\
      \ — record cash income for the day (must be reconciled with the Z-report and\
      \ Shop-Seller program)\n\U0001F4CD- in the second column record cash income\
      \ from the service center (must be reconciled with the service center report\
      \ and Z-report)\n\U0001F4CD- in the third column enter non-cash income for the\
      \ service center (must be reconciled with the service center report and Z-report)\n\
      \U0001F4CD- in the fourth column enter cash receipts on the TBS terminal (must\
      \ be reconciled with non-cash payment totals in Shop-Seller and the Z-report!)\n\
      \U0001F4CD- in the fifth column enter cash receipts on the BOG terminal (must\
      \ be reconciled with non-cash payment totals in Shop-Seller and the Z-report!)\n\
      \U0001F4CDin the column — CASH AT END OF DAY — enter cash — lari — that is currently,\
      \ at this moment, at the end of the day, when closing the workday — at the retail\
      \ location (actual amount! if more or less — write as is)\n\U0001F4CD- in the\
      \ EMPLOYEE column — enter the name of the person who worked and was responsible\
      \ for that workday!\n\nIn the EXPENSE column enter\n\U0001F4CD- date\n\U0001F4CD\
      - in the second column enter — cash expense amount\n\U0001F4CD- in the third\
      \ column enter expense description — mandatory expenses — water — how many liters,\
      \ napkins — what quantity, household supplies do not mix with production expenses!!!\n\
      If the expense is unforeseen — you must describe it clearly for the accountant!\
      \ (taxi — without explanation of purpose is not accepted as an expense!!!)\n\
      \nIn the COLLECTION column enter \n\U0001F4CD- in the first column enter — date\n\
      \U0001F4CD- in the second column enter — cash collection amount \n\U0001F4CD\
      - in the third column enter — where or to whom the amount was collected (bank\
      \ or office, responsible person)\n\n\U0001F4CC in the lower left corner (CASH\
      \ AT START OF MONTH, in the gray square) — enter the cash amount at the end\
      \ of the previous month — which is displayed in the UPPER right corner in the\
      \ red square (CASH) \n\nIF amounts do not match throughout the entire work period\
      \ (cash or terminal), do not match the program or Z-reports — you must report\
      \ this in the shopseller Telegram channel for timely response to the discrepancy!!!\
      \ And resolve the discrepancy in time! Also note the fact of the discrepancy\
      \ in the notes!\n IF an employee did not report a cash discrepancy in time —\
      \ first deduction from salary — 10 lari, in subsequent months the deduction\
      \ amount will double!!! \nFor quality work — when accepting the morning shift\
      \ — you must recount cash and reconcile with the cash table; if there are discrepancies\
      \ — report in time to the HR manager and in the shopseller Telegram!!! \nAlso\
      \ if you have questions about product availability at your retail location —\
      \ you can also ask questions in the \nshop-seller Telegram! \nThe Dim Kava team\
      \ is committed to quality, uninterrupted work and increasing sales, and thereby\
      \ increasing the wages of all employees!"
  reg-31197:
    title_en: Regulations for Shutting Down Granit Program!
    content_en: 'Regulations for Shutting Down Granit Program!

      If Shop Seller is not working, record all sales (write them down) on paper,
      or on processed receipts, and at the end of the day — send all Z-reports and
      receipts or the paper report to the Telegram channel — inventory and accounting
      system with a note — that the program was not working!! This is very important
      for further work and quality inventory! And all data must be in English!'
  reg-31198:
    title_en: Regulations on Product Expiration Dates.
    content_en: "Regulations on Product Expiration Dates.\nEmployees check product\
      \ expiration dates during every inventory! And ‼️3 months before the sell-by\
      \ date expires, report to the office in the system Telegram channel for further\
      \ actions to sell the product! The office develops promotions and puts greater\
      \ emphasis on selling this product to sell it faster! Employees themselves should\
      \ also sell more products approaching their sell-by date (offer customers packages\
      \ and prepare in cups) Coffee does not spoil after the sell-by date on the packaging,\
      \ so do not immediately send it to the office — prepare it in cups!!! \nQuality\
      \ compliance with regulations is the key to the company's success!"
  reg-31199:
    title_en: Regulations on Discounts for Dim Kava Employees
    content_en: "Regulations on Discounts for Dim Kava Employees\n\n1. 25% discount\
      \ on Blasercafe coffee — no more than 0.5 kg per month, on Caotina — no more\
      \ than 2 units per month, on Blasercafe tea — no more than 5 units per month\
      \ (discount is processed on the employee card)\n2. DeLonghi accessories discount\
      \ is not fixed, may change depending on purchase price! No more than 15% discount\
      \ on accessories, no more than 2 units per month.\n3. Chinese cups — discount\
      \ by agreement.\n4. Cafittaly capsules discount may change depending on purchase\
      \ and supplier discounts, 15% discount.\n5. Water discount is processed on the\
      \ employee card, may change depending on purchase. \n6. Cookies and bars are\
      \ processed on the employee card already with discount. \n\n\nDiscounts may\
      \ change depending on purchase price.\n\nRestart the program so that discounts\
      \ are updated"
  reg-31200:
    title_en: 'Rules for Recording Coffee Cups in Shop Seller for Dim Kava Company
      Employees:'
    content_en: "‼️‼️‼️‼️‼️‼️\nRules for Recording Coffee Cups in Shop Seller for\
      \ Dim Kava Company Employees:\n1. Select the coffee variety — mark it in the\
      \ program\n2. Milk is entered only in grams! 150 g (i.e. cappuccino or latte\
      \ or 200g for Lussuria — this is incorrect!)\n3. Process the employee card and\
      \ write / We / WE /\n4. If you processed it incorrectly — this cup will count\
      \ as a shortage for one cup!‼️‼️‼️‼️\n5. **Cups marked in the program without\
      \ payment and without a card — count as a shortage!**!‼️‼️‼️\n6. Company employees\
      \ are allocated 48 coffee cups and 10 portions of 150 g milk per month for tasting\
      \ in the program; if the program stops processing for you — it means you are\
      \ exceeding your limit!\nTasting cups are provided for tasting coffee so you\
      \ know what coffee you are preparing for the customer, for quick adjustment\
      \ of quality coffee preparation for the customer! Quality espresso is the key\
      \ to high sales — cups, coffee packages and coffee machines!!\nTea is not included\
      \ in tasting cups! \nCaotina — 2 cups per month!\n‼️\nWhen purchasing during\
      \ the month, 25% discount on 2 coffee packages and 1 Caotina; all other purchases\
      \ at full price!\nPurchase of accessories, coffee machines, kettles, etc. is\
      \ done through discussion with the office!\nIf there are promotions or advertising\
      \ campaigns — each retail location has promotional cards — process transactions\
      \ on it with a note indicating which promotion!"
  reg-31201:
    title_en: Regulations on Installment Sales of Coffee Machines!!!
    content_en: '‼️Regulations on Installment Sales of Coffee Machines!!!

      When selling coffee equipment on installment — the bank deducts 5% from the
      coffee machine sale amount, therefore gifts are excluded in this case!'
  reg-31202:
    title_en: Regulations on Disposable Cup Usage
    content_en: "**Regulations on Disposable Cup Usage\n\nCompany: Dim Kava\nEffective\
      \ date: August 1, 2025\nApplies to all company retail locations\n**\n⸻\n**\n\
      1. General Provisions\n\nAs of 08/01/2025, new regulations for controlling disposable\
      \ cup usage are introduced to optimize expenses and prevent unjustified losses.\n\
      **\n⸻\n**\n2. Cup Usage Calculation Standard\n\nMonthly cup usage is determined\
      \ by the following formula:\n\nJustified usage =\nNumber of drinks sold + bonus\
      \ cups + promotional + \"We\"\n+ allowable margin of 10% of the total of the\
      \ above items.\n\nCalculation example:\n • Sold: 500 cups\n • Bonus: 100 cups\n\
      \ • Promotional: 30 cups\n • \"We\": 100 cups\n • Total: 730 cups\n • Allowable\
      \ margin (10%): 73 cups\n • Maximum allowable usage: 803 cups per month\n\n\
      Usage above 803 cups will be considered unjustified and classified as a shortage.\n\
      **\n⸻\n**\n3. Responsibility\n\nIf the actual number of disposable cups used\
      \ exceeds the standard (including the allowable margin), the difference will\
      \ be considered a shortage and the cost of excessively used cups will be deducted\
      \ from the responsible employee's or shift's wages.\n**\n⸻\n**\n4. Special Provisions\
      \ (Paliashvili example)\n\nFor the period from 01/01/2025 at the Paliashvili\
      \ location:\n • Sold with bonus: 2287 cups\n • Written off as \"We\": 2000 cups\n\
      \ • Total per regulations: 4287 cups\n • Actually used: 4900 cups\n • Overuse:\
      \ 613 cups\n • Cost of overuse: 500 lari\n\nIn connection with this, for this\
      \ location as of 08/01/2025, strict control is also introduced:\nUsage must\
      \ not exceed sold + bonus cups by more than 10%.\nExceeding will be treated\
      \ as a shortage with cost deduction.\n**\n⸻\n**\n5. Purpose of the Regulations\n\
      \ • Reduce unjustified expenses\n • Increase staff accountability\n • Maintain\
      \ transparency and efficient use of resources\n**\n⸻\n**\nWe kindly ask all\
      \ employees to comply with these standards and avoid overuse.\n\nSincerely,\n\
      Dim Kava Company Administration**"
  reg-31203:
    title_en: Regulations and Duties of the Manager at a Dim Kava Georgia Retail Location**
    content_en: "**Regulations and Duties of the Manager at a Dim Kava Georgia Retail\
      \ Location**\n\n**  Price tags: **Every product on display must have a price\
      \ tag.\n**  Price tag information: **The price tag must indicate the product\
      \ name and unit price.\n**  Uniformity and clarity: **Price tags must be clear,\
      \ legible and in a uniform style for all products in the same group. \n**  Price\
      \ accuracy: **The price on the price tag must exactly match the price processed\
      \ at the register. \n**  Accessibility: **The price tag must be easily readable\
      \ and placed directly next to the product. \n**  Promotions/markdowns: **When\
      \ prices change (promotions, sales, markdowns), cross out the old price and\
      \ indicate the new one. \n**Consequences of violations:**\n\n**  Public offer:\
      \ **A price tag is a public offer of goods at the stated price, therefore the\
      \ seller is obliged to sell the product at that price (exceptions are discounts\
      \ offered during the sale, by agreement with the office)\n**  Fines: **Incorrect\
      \ price tag formatting or price mismatch between the price tag and the Shop\
      \ Seller program leads to wage deduction."
  reg-31205:
    title_en: Regulations on Selling Coffee Equipment with Bank Installment Plans.
    content_en: "Regulations on Selling Coffee Equipment with Bank Installment Plans.\
      \ \nWhen selling coffee equipment on installment, gifts are not given. Because\n\
      The bank, for coffee equipment installment plans, charges us 5% of the installment\
      \ amount."
  reg-31206:
    title_en: Regulations for Maintaining the Daily Sales Report
    content_en: "**Regulations for Maintaining the Daily Sales Report\n\nFor retail\
      \ location managers (City Mall, East Point, BatumiMall)\n\n1. General Provisions\n\
      \ • The daily sales table is designed for accurate tracking of plan fulfillment\
      \ for half a workday (6 hours out of 12).\n • Entering total data for 12 hours\
      \ (daily turnover, total cups for the day, total kg of coffee for the day) is\
      \ considered a violation of the rules.\n • All employees must fill in the table\
      \ strictly according to the established periods.\n**\n⸻\n**\n2. Table Completion\
      \ Procedure\n** 1. **Time slots for completion:\n • 10:00 to 16:00 — first half\
      \ of the day (X-report at 16:00).\n • 16:00 to 22:00 — second half of the day\
      \ (X-report at 22:00).\n** 2. **If an employee works a full day:\n • They fill\
      \ in two tables:\n • for the period 10:00–16:00 (enter in their own table);\n\
      \ • for the period 16:00–22:00 (enter data in a colleague's table).\n** 3. **Employee\
      \ identification:\n • You must select your name in all completed tables.\n**\n\
      ⸻\n**\n3. Supporting Materials\n\nThe following are attached to each table daily:\n\
      \ • photos of data from Shop-Seller:\n • money amount;\n • total sold (cups\
      \ and coffee);\n • photos of Z-reports:\n • by banks;\n • by terminal.\n**\n\
      ⸻\n**\n4. Plan Fulfillment\n • Plan fulfillment is calculated over 6 hours,\
      \ not 12 h\n • Accurate analysis is achieved only with precise data entry in\
      \ the specified time slots.\n**\n⸻\n**\n5. Responsibility\n • Unfilled days\
      \ or incorrectly entered data lead to distorted totals, which is automatically\
      \ considered a violation.\n • Employees ensure accuracy and timely completion\
      \ of reporting tables.**"
  reg-31207:
    title_en: Regulations on Providing Discounts on Coffee Equipment
    content_en: "**Regulations on Providing Discounts on Coffee Equipment\n\nDim Kava\
      \ Georgia\n\n1. General Provisions\n\nThese regulations establish the procedure\
      \ for Dim Kava Georgia network employees when providing discounts on coffee\
      \ equipment (CE) to customers.\n\n2. Main Rules\n** 1. **Replacing a discount\
      \ with a gift.\nWhen a customer requests a discount, the employee first offers\
      \ an alternative — a gift (coffee, Caotina, accessories) within 5% of the coffee\
      \ machine cost.\n** 2. **Discount without approval.\nThe retail location manager\
      \ may independently provide a discount on coffee equipment of up to 5%.\n**\
      \ 3. **Discount above 5%.\nIn non-standard situations, providing a discount\
      \ of more than 5% is possible only with approval from the senior manager or\
      \ head of the sales department.\n** 4. **Mandatory sale of related products.\n\
      When selling coffee equipment with a discount, the manager must offer and sell\
      \ related products (coffee, Caotina, accessories).\n** 5. **Maximum gift.\n\
      When providing a discount, the maximum allowable gift is 0.250 kg of coffee\
      \ (blend).\n** 6. **Website price.\n • If the customer came from the Dim Kava\
      \ website — the sale is made at the price stated on the website.\n • If the\
      \ customer references a third-party website — the sale is possible only with\
      \ approval from the senior manager or head of the sales department.\n** 7. **Impact\
      \ on bonuses.\nThe discount provided may affect the bonus portion of the employee's\
      \ compensation for coffee equipment sales.\n** 8. **Discounts on grinders and\
      \ milk frothers.\nMaximum discount amount — 5%.**"
  reg-31208:
    title_en: Rules for Issuing Goods to a Customer or Another Person
    content_en: "**\U0001F4E6 Rules for Issuing Goods to a Customer or Another Person\n\
      \n1. Identifying Customer Needs\n • Politely clarify what the customer needs.\n\
      \ • If necessary, help select the product.\n\n2. Order Processing\n • The order\
      \ is recorded in Shop-Seller.\n • The employee must know the product range and\
      \ prices.\n • All products must have current and correct price tags.\n\n3. Payment\
      \ Processing\n • Payment is accepted in cash or via bank terminal.\n • When\
      \ paying via terminal, always verify in the terminal window that funds have\
      \ been credited to the account.\n • After payment, close the transaction in\
      \ Shop-Seller.\n\n4. Issuing Goods\n • Goods are issued to the customer only\
      \ together with a receipt.\n\n5. Prohibited!\n • ❌ Goods from a retail location\
      \ without payment, without a terminal receipt or without an RSG entry — are\
      \ not issued!\n • ❌ Issuing goods without payment or without a transfer delivery\
      \ note is strictly prohibited.\n\n6. Employee Responsibility\n • Each employee\
      \ on shift bears full responsibility for the cash register and goods at the\
      \ retail location.\n • Goods may be issued to another person (logistics driver,\
      \ director, manager, etc.) only with a delivery note issued by accounting.\n\
      \ • When transferring goods to another retail location, a delivery note is mandatory.\n\
      \ • If an employee issued goods without payment or without a delivery note —\
      \ it is considered a shortage, and the employee must reimburse the cost.\n**\n\
      ⸻\n**\n⚠️ These rules are mandatory for all Dim Kava Georgia employees.**"
  reg-31210:
    title_en: Regulations on Selling Coffee Equipment at "Dim Kava Georgia"**
    content_en: "**Regulations on Selling Coffee Equipment at \"Dim Kava Georgia\"\
      **\n\n**1. General Provisions**\n\n1.1. These regulations define the rules and\
      \ procedures for selling coffee equipment (coffee machines, accessories) at\
      \ Dim Kava retail locations.\n\n1.2. The purpose of the regulations is to ensure\
      \ correct sales, eliminate errors in equipment assembly and issuance, and maintain\
      \ a high level of service for customers.\n\n1.3. All employees must strictly\
      \ follow these regulations.\n\n\n**2. Equipment Sales**\n\n2.1. Before selling,\
      \ the employee must:\n • clarify with the customer the model and specifications\
      \ of the equipment they are interested in;\n • check availability of this model\
      \ in the inventory database (warehouse, sales floor, reserve).\n\n2.2 . If the\
      \ required model is **not in stock** in the store:\n • The employee must offer\
      \ the customer alternative models with similar specifications and price.\n •\
      \ If the customer is interested specifically in the selected model, the employee\
      \ places an order through the **centralized system/warehouse**.\n\n2.3. Equipment\
      \ is issued strictly in **factory packaging** corresponding to the specific\
      \ model.\n • The box must be **new, undamaged, clean**;\n • The box must indicate:\
      \ model, serial number;\n • The box must fully match the coffee machine being\
      \ sold (packaging replacement is not permitted).\n    \n 2.4. Absence of a box\
      \ at this location (for example City Mall, there are no boxes there)\n   •We\
      \ issue the coffee machine from the warehouse (the manager notifies the office\
      \ of the sale)\n   •The manager agrees with the customer on home delivery of\
      \ the equipment with our values (regarding time and delivery, the trainer arranges\
      \ with the customer after receiving the customer's details)\n• The manager records\
      \ the customer's details, phone number, address and passes this information\
      \ to the trainer.\n• After the customer leaves, the manager writes to Regina\
      \ about the coffee machine sale and gift coffee, requests a transfer delivery\
      \ note for equipment from the warehouse to City Mall and for the gift, and processes\
      \ the sale in Shop Seller.\n\n**3. Actions When \na Model Is Not Available at\
      \ the Retail Location**\n\n3.1. Possible options:\n • **Reserving** goods at\
      \ the warehouse and delivery to the store (with timeframe communicated to the\
      \ customer);\n • **Placing a pre-order** and agreeing on the pickup date;\n\
      carried out by checking availability with the supplier and delivery timeframes\
      \ from the supplier to us through managers — NINI or SALOME\n • **Redirecting\
      \ the customer** to the nearest retail location where this model is in stock\
      \ with prior phone confirmation (use this method carefully, only when the customer\
      \ needs it urgently and agrees to go and pick it up at another location themselves)\n\
      \n3.2. When the product is unavailable across the entire network and from the\
      \ supplier:\n • The employee records the request in the system;\n    •    The\
      \ employee records the customer's phone number and informs them if possible\n\
      \ • Informs the customer of possible arrival timeframes (based on procurement\
      \ department data).\n\n**4. Verification Before Issuing Goods**\n\n4.1. Before\
      \ selling, the employee must:\n\n • VERIFY THE MODEL AND SERIAL NUMBER ON THE\
      \ EQUIPMENT AND ON THE BOX (PACKAGING) !!!\n\n • Check packaging integrity;\n\
      \ • If necessary (at the customer's request) carefully open the box and demonstrate\
      \ completeness (coffee machine, cable, filters, other accessories, manual, warranty\
      \ card).\n\n4.2. After verification, the equipment is **repackaged in the factory\
      \ box**.\n\n**5. Documents and Warranty**\n\n5.1. Each coffee machine includes:\n\
      \ • receipt;\n • warranty card with store stamp/seal;\n • manual.\n\n5.2. When\
      \ selling, model and serial number data must be entered on the warranty card.\n\
      \n**6. Responsibility**\n\nFailure to comply with requirements (issuing equipment\
      \ without original box, incorrect assembly without approval) entails disciplinary\
      \ action.\n\n**7. Additional Provisions**\n • Sale of equipment \"without a\
      \ box\" or in mismatched packaging is **strictly prohibited**.\n • In exceptional\
      \ cases (demonstration models), sale is possible only with written permission\
      \ from the network manager and with a mandatory discount recorded in the system.\n\
      \n8. Send contact details, name, what was purchased and on what terms to the\
      \ DimKava online store manager!!!"
  reg-31211:
    title_en: Regulations on Employee Obligations at Dim Kava Georgia for Stable and
      Quality Operation of Dim Kava Georgia **
    content_en: "**Regulations on Employee Obligations at Dim Kava Georgia for Stable\
      \ and Quality Operation of Dim Kava Georgia **\n(assisting colleagues and working\
      \ in non-standard situations)\n\n**Purpose:** To ensure stable operation of\
      \ the company as a whole, coordinated teamwork and company support in emergency\
      \ or non-standard situations, while guaranteeing transparent payment terms.\n\
      \n⸻\n\n**1. General Provisions**\n\n1.1. All company employees are obliged to\
      \ assist colleagues in **emergency or critical situations** when this is necessary\
      \ to maintain company operations or to help other employees.\n\n1.2. An emergency\
      \ or critical situation may include, but is not limited to:\n • absence of a\
      \ colleague due to illness or emergency event;\n • need for urgent task completion\
      \ to maintain branch operations;\n • unforeseen production or organizational\
      \ situations.\n\n⸻\n\n**2. Employee Duties**\n\n2.1. An employee must be prepared\
      \ to:\n • temporarily replace a colleague in their position;\n • assist in performing\
      \ their work duties;\n • if necessary, temporarily work at another company branch.\n\
      \n2.2. Overtime related to providing assistance is **paid**, in accordance with\
      \ applicable labor legislation and internal company rules.\n\n2.3. In case of\
      \ assisting other employees or working at another branch:\n • working time is\
      \ recorded in the schedule and the HR manager is notified;\n • overtime pay\
      \ is calculated in accordance with internal company rates or applicable legislation.\n\
      \n⸻\n\n**3. Notification and Approval Procedure**\n\n3.1. When assistance is\
      \ needed, the employee is notified by the manager in advance, if the situation\
      \ allows.\n\n3.2. In urgent situations when it is impossible to notify the employee\
      \ in advance, assistance is considered an **obligation under internal regulations**,\
      \ with subsequent recording of time.\n\n3.3. All cases of temporary transfer\
      \ to another branch are coordinated with HR and the direct manager.\n\n⸻\n\n\
      **4. Exceptions**\n\n4.1. An employee may be exempt from providing assistance\
      \ only for valid reasons (illness with documentation provided, maternity leave,\
      \ etc.).\n\n4.2. Any exceptions are recorded in writing and approved by management.\n\
      \n⸻\n\n**5. Responsibility**\n\n5.1. Failure to comply with these regulations\
      \ is considered a violation of internal company rules and may result in disciplinary\
      \ measures, including a warning or penalties, within limits established by law."
  reg-31212:
    title_en: Rules for Issuing Goods to a Customer in the Store
    content_en: "**‼️ Rules for Issuing Goods to a Customer in the Store\n** 1. **Identifying\
      \ customer needs.\nClarify what the customer needs and offer a suitable product.\n\
      ** 2. **Order processing with entry in Shop Seller.\n      •   Must know the\
      \ product range and prices.\n      •   Correct price tags (matching the Shop\
      \ Seller program) on all products!\n** 3. **Payment processing.\n      •   Payment\
      \ is accepted in cash or via terminal.\n      •   After payment, you must close\
      \ the transaction in Shop Seller.\n** 4. **Issuing goods and receipt.\nGoods\
      \ are issued only after full payment and document processing.\n** 5. **‼️ Important:\n\
      Goods from a retail location without payment, without terminal payment and without\
      \ an RSG entry — ARE NOT ISSUED!\nThese regulations apply to all sales locations!\n\
      Exceptions to the regulations — only through the **Director of Dim Kava Georgia\
      \ Company.\n‼️An employee who issued goods from a Dim Kava Georgia retail location\
      \ without payment bears full responsibility and reimburses the company's losses\
      \ in full."
  reg-31213:
    title_en: REGULATIONS
    content_en: "****REGULATIONS\n\nFOR DAILY CASH REGISTER ENTRY\nIN SHOP-SELLER**\n\
      \nTo ensure quality and uninterrupted operation of the retail location, as well\
      \ as timely response to any discrepancies, every employee must daily correctly\
      \ and fully complete the cash register table in the Shop-Seller program.\n**\n\
      ⸻\n**\n1. COMPLETING THE \"INCOME\" COLUMN\n\n1.1. Date\n   •   The date of\
      \ the workday is entered in the first column.\n\n1.2. Income\n\nThe following\
      \ data is entered in the \"Income\" column:\n\n1️⃣ Cash income for the day\n\
      — Enter the amount of actual cash received for the day.\n— Must be reconciled\
      \ with the Z-report and Shop-Seller data.\n\n2️⃣ Cash income from the service\
      \ center\n— Enter the amount received from the service center.\n— Reconcile\
      \ with the service center report and Z-report.\n\n3️⃣ Non-cash income for the\
      \ service center\n— Enter the amount of non-cash receipts for the service center.\n\
      — Reconcile with the report and Z-report.\n\n4️⃣ Income on TBS terminal\n— Enter\
      \ the amount of receipts via the TBS terminal.\n— Reconcile with non-cash payment\
      \ totals in Shop-Seller and the Z-report.\n\n5️⃣ Income on BOG terminal\n— Enter\
      \ the amount of receipts via the BOG terminal.\n— Reconcile with non-cash totals\
      \ and Z-report.\n\n1.3. CASH AT END OF DAY\n\n— Enter the actual cash amount\
      \ (in lari) at the retail location at shift closing.\n— If the amount is higher\
      \ or lower — record the actual value, without corrections or additions.**(Note\
      \ the error in the notes)**\n\n1.4. Employee\n\n— Enter the name of the employee\
      \ who worked that day and is responsible for the cash register.\n**\n⸻\n**\n\
      2. COMPLETING THE \"EXPENSE\" COLUMN\n\n1️⃣ Date\n2️⃣ Cash expense amount\n\
      3️⃣ Expense description\n\nRequirements:\n   •   Expense type must be specified:\n\
      — water (number of liters),\n— napkins (quantity),\n— household supplies (do\
      \ not mix with production expenses).\n   •   Unforeseen expenses must be clearly\
      \ explained.\nFor example: \"taxi\" without explanation of purpose — not accepted\
      \ as an expense!\n\nYou **must send the cash expense receipt to the Telegram\
      \ channel of this retail location!! (if there is no receipt or comment explaining\
      \ why there is no receipt — it is considered a shortage)**\n**\n⸻\n**\n3. COMPLETING\
      \ THE \"COLLECTION\" COLUMN\n\n1️⃣ Date\n2️⃣ Collection amount (cash expense)\n\
      3️⃣ To whom or where the money was transferred:\n— bank,\n— office,\n— responsible\
      \ person.\n**\n⸻\n**\n4. CASH AT START OF MONTH\n\nIn the lower left corner,\
      \ in the gray square, enter the cash amount at the start of the month.\nThis\
      \ amount must match the figure in the red \"CASH\" square in the upper right\
      \ corner, displayed at the end of the previous month.\n**\n⸻\n**\n5. MANDATORY\
      \ REPORTING OF DISCREPANCIES\n\nIf discrepancies are identified during the work\
      \ period:\n   •   in cash,\n   •   at the terminal,\n   •   between Shop-Seller\
      \ and Z-report,\n\nthe employee must immediately report this in the shopseller\
      \ Telegram channel, and also note the discrepancy in the table notes.\n\nResponsibility:\n\
      \   •   First untimely unreported discrepancy — deduction of 10 lari from salary.\n\
      \   •   Each subsequent one — deduction amount doubles.\n**\n⸻\n**\n6. SHIFT\
      \ ACCEPTANCE RULES (MANDATORY)\n\nEvery employee at the start of a shift must:\n\
      ** 1. **Recount cash in the register.\n** 2. **Reconcile with the cash table.\n\
      ** 3. If there are discrepancies — **immediately notify the HR manager and shopseller\
      \ Telegram.\n\nIf an employee accepts a shift with a shortage and does not report\
      \ it — they automatically take responsibility upon themselves.\n**\n⸻\n**\n\
      7. PRODUCT QUESTIONS\n\nAny questions about product availability at the location\
      \ can be asked in the system Telegram channel.\n**\n⸻\n**\n8. COMPANY MISSION\n\
      \nThe Dim Kava team is committed to:\n   •   quality and uninterrupted operation\
      \ of retail locations,\n   •   timely correction of errors,\n   •   increasing\
      \ sales,\n   •   growth in employee wages.**"
  reg-31215:
    title_en: Rules for Completing Monthly Sales Plan Tables!
    content_en: "Rules for Completing Monthly Sales Plan Tables!\nThe Monthly Sales\
      \ Plan table is control and statistics of each employee's and team's sales for\
      \ the month — for analyzing plan fulfillment and calculating employee wages!\
      \ If tables are filled in incorrectly, with errors, this should be regarded\
      \ as indifferent and negligent attitude toward the employee's activities in\
      \ the company as a whole! Starting from 2026, effective January — deductions\
      \ from salary for incorrect completion of the sales plan table — first warning\
      \ 20 lari, subsequent 50 lari. \nNini, please conduct briefings with all employees\
      \ (Paliashvili is no exception!!) on how to correctly fill in the sales plan\
      \ table, and test each employee by January 15. Thank you for understanding"
  reg-31217:
    title_en: Regulations on Product Expiration Dates for Quality Operation of DimKava
      Georgia! On the 10th of each month report on products with 3 months of shelf
      life remaining! Failure to report — first time warning, second time wage deduction
      (20 lari)
    content_en: Regulations on Product Expiration Dates for Quality Operation of DimKava
