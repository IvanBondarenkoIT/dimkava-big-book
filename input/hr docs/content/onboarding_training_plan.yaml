# Onboarding Training Plan — Manager / Sales Consultant
# Source: план_обучение_стажера.docx
# Django model: OnboardingModule + OnboardingStep
# Usage: python manage.py load_onboarding
#
# ---------------------------------------------------------------------------
# STRUCTURE:
#   OnboardingProgram "New Employee Onboarding — Manager Consultant"
#     └── OnboardingModule (by day/week)
#           └── OnboardingStep (individual topic)
# ---------------------------------------------------------------------------

program:
  slug: new-employee-onboarding-manager
  title: New Employee Onboarding — Manager Consultant
  title_en: New Employee Onboarding — Manager Consultant
  title_ru: Онбординг нового сотрудника — менеджер‑консультант
  role: manager_consultant
  estimated_days: 90
  description: 'The complete onboarding path for a new Manager-Consultant at Dim Kava. Covers company culture, coffee knowledge,
    sales skills, equipment, and operational procedures. Structured across 3 months with weekly checkpoints and quizzes.

    '
  description_en: 'The complete onboarding path for a new Manager-Consultant at Dim Kava. Covers company culture, coffee knowledge,
    sales skills, equipment, and operational procedures. Structured across 3 months with weekly checkpoints and quizzes.

    '
  description_ru: 'Полный онбординг‑маршрут для нового менеджера‑консультанта в Dim Kava. Включает культуру компании, знания
    о кофе, навыки продаж, оборудование и операционные процедуры. Структурирован на 3 месяца с еженедельными контрольными
    точками и квизами.

    '
  title_ka: ახალი თანამშრომელი - მენეჯერის კონსულტანტი
  description_ka: Dim Kava-ში ახალი მენეჯერ-კონსულტანტის სრული საბორტო გზა. მოიცავს კომპანიის კულტურას, ყავის ცოდნას, გაყიდვების
    უნარებს, აღჭურვილობას და საოპერაციო პროცედურებს. სტრუქტურირებულია 3 თვის განმავლობაში ყოველკვირეული გამშვები პუნქტებითა
    და ვიქტორინებით.
modules:
- slug: day-1
  title: Day 1 — Getting Started
  title_en: Day 1 — Getting Started
  title_ru: День 1 — Начало работы
  order: 1
  estimated_minutes: 480
  description: 'First day at work. Introduction to the team, store tour, first tasting, and understanding what Dim Kava is.

    '
  description_en: 'First day at work. Introduction to the team, store tour, first tasting, and understanding what Dim Kava
    is.

    '
  description_ru: 'Первый рабочий день. Знакомство с командой, экскурсия по магазину, первая дегустация и понимание того,
    что такое Dim Kava.

    '
  steps:
  - order: 1
    title: Team introduction and store tour
    title_en: Team introduction and store tour
    title_ru: Знакомство с командой и экскурсия по магазину
    content: 'Meet every team member. Get a full walk-through of the store: sales floor, bar area, stock room, take-away zone.
      Understand the layout before the day begins.

      '
    content_en: 'Meet every team member. Get a full walk-through of the store: sales floor, bar area, stock room, take-away
      zone. Understand the layout before the day begins.

      '
    content_ru: 'Познакомьтесь со всеми членами команды. Пройдите по всем зонам магазина: торговый зал, бар, склад, зона take‑away.
      Разберитесь в планировке до начала рабочего дня.

      '
    title_ka: გუნდის გაცნობა და მაღაზიის ტური
    content_ka: 'შეხვდით გუნდის თითოეულ წევრს. მიიღეთ მაღაზიის სრული გასეირნება: გაყიდვების სართული, ბარის ფართობი, საწყობი,
      გასატანი ზონა. გაიგე განლაგება დღის დაწყებამდე.'
  - order: 2
    title: Opening the store — morning prep
    title_en: Opening the store — morning prep
    title_ru: Открытие магазина — утренняя подготовка
    content: 'Watch and participate in the morning setup: switching on lights, cameras, TV, coffee machines, Shop Seller,
      Telegram. Learn what needs to be done before opening.

      '
    content_en: 'Watch and participate in the morning setup: switching on lights, cameras, TV, coffee machines, Shop Seller,
      Telegram. Learn what needs to be done before opening.

      '
    content_ru: 'Наблюдайте и участвуйте в утренней подготовке: включение света, камер, TV, кофемашин, Shop Seller, Telegram.
      Изучите, что нужно сделать до открытия.

      '
    title_ka: მაღაზიის გახსნა - დილის მომზადება
    content_ka: 'უყურეთ და მიიღეთ მონაწილეობა დილის დაყენებაში: ჩართეთ განათება, კამერები, ტელევიზორი, ყავის აპარატები, მაღაზია
      გამყიდველი, Telegram. გაიგეთ რა უნდა გააკეთოთ გახსნამდე.'
  - order: 3
    title: Daily task distribution
    title_en: Daily task distribution
    title_ru: Распределение задач на день
    content: 'Each team member receives tasks for the day. The new employee''s task: observe everything, ask questions, and
      be useful to the team.

      '
    content_en: 'Each team member receives tasks for the day. The new employee''s task: observe everything, ask questions,
      and be useful to the team.

      '
    content_ru: 'Каждый сотрудник получает задачи на день. Задача новичка — наблюдать за процессами, задавать вопросы и быть
      полезным команде.

      '
    title_ka: ყოველდღიური დავალების განაწილება
    content_ka: 'გუნდის თითოეული წევრი იღებს დავალებებს დღის განმავლობაში. ახალი თანამშრომლის ამოცანა: დააკვირდით ყველაფერს,
      დასვით კითხვები და იყავით სასარგებლო გუნდისთვის.'
  - order: 4
    title: Morning tasting (degustation)
    title_en: Morning tasting (degustation)
    title_ru: Утренняя дегустация
    content: 'Participate in the morning espresso tasting ritual. We taste 3 espresso cups during the day. Understand why:
      to control quality, calibrate the grinder, and stay connected to the product.

      '
    content_en: 'Participate in the morning espresso tasting ritual. We taste 3 espresso cups during the day. Understand why:
      to control quality, calibrate the grinder, and stay connected to the product.

      '
    content_ru: 'Участвуйте в утреннем ритуале дегустации эспрессо. В течение дня мы пробуем 3 чашки эспрессо. Поймите зачем:
      контролировать качество, калибровать помол и “держать контакт” с продуктом.

      '
    title_ka: დილის დეგუსტაცია (დეგუსტაცია)
    content_ka: 'მიიღეთ მონაწილეობა დილის ესპრესოს დეგუსტაციის რიტუალში. დღის განმავლობაში ვაგემოვნებთ 3 ფინჯანს ესპრესო.
      გაიგეთ რატომ: ხარისხის გასაკონტროლებლად, დაკალიბრეთ საფქვავი და დარჩით პროდუქტთან დაკავშირებული.'
  - order: 5
    title: What is Dim Kava?
    title_en: What is Dim Kava?
    title_ru: Что такое Dim Kava?
    content: 'Company overview: - History and origin of Dim Kava - Trademark and brand positioning - General importer of Blaser
      coffee (Switzerland) - Network of retail stores with tasting rooms, service centre, dealer network - Team structure:
      employees, dealers, suppliers - Product range: coffee, equipment, accessories, cleaning products - Customer support
      at all stages (before and after sale) - Where to buy Blaser coffee - Our mission: cultivating espresso culture - Career
      opportunities for employees - Unified standards for the dealer network

      '
    content_en: 'Company overview: - History and origin of Dim Kava - Trademark and brand positioning - General importer of
      Blaser coffee (Switzerland) - Network of retail stores with tasting rooms, service centre, dealer network - Team structure:
      employees, dealers, suppliers - Product range: coffee, equipment, accessories, cleaning products - Customer support
      at all stages (before and after sale) - Where to buy Blaser coffee - Our mission: cultivating espresso culture - Career
      opportunities for employees - Unified standards for the dealer network

      '
    content_ru: 'Обзор компании: - История и происхождение Dim Kava - Торговая марка и позиционирование бренда - Генеральный
      импортёр кофе Blaser (Швейцария) - Сеть розничных магазинов с дегустационными залами, сервисным центром и дилерской
      сетью - Структура команды: сотрудники, дилеры, поставщики - Ассортимент: кофе, оборудование, аксессуары, средства для
      чистки - Поддержка клиентов на всех этапах (до и после покупки) - Где купить кофе Blaser - Наша миссия: развитие культуры
      эспрессо - Карьерные возможности для сотрудников - Единые стандарты для дилерской сети

      '
    title_ka: რა არის დიმ კავა?
    content_ka: 'კომპანიის მიმოხილვა: - Dim Kava-ს ისტორია და წარმოშობა - სავაჭრო ნიშანი და ბრენდის პოზიციონირება - Blaser
      ყავის გენერალური იმპორტიორი (შვეიცარია) - საცალო მაღაზიების ქსელი სადეგუსტაციო ოთახებით, სერვის ცენტრით, დილერების ქსელით
      - გუნდის სტრუქტურა: თანამშრომლები, დილერები, მომწოდებლები - პროდუქტების ასორტიმენტი: ყავა, აღჭურვილობა, აქსესუარები,
      საწმენდი საშუალებები - კლიენტების მხარდაჭერა ყველა ეტაპზე: ბლაზერის ყიდვა - სად იყიდება ესპრესო კულტურა - კარიერული
      შესაძლებლობები თანამშრომლებისთვის - დილერების ქსელის ერთიანი სტანდარტები'
  - order: 6
    title: Manager conduct rules and ethics
    title_en: Manager conduct rules and ethics
    title_ru: Правила поведения менеджера и этика
    content: 'Core rules for behaviour on the floor: - Professional appearance and dress code at all times - Ethics in communication
      with clients and colleagues - Cleanliness on the floor and behind the bar - Disciplinary consequences for non-compliance
      Note: these are non-negotiable standards, not suggestions.

      '
    content_en: 'Core rules for behaviour on the floor: - Professional appearance and dress code at all times - Ethics in
      communication with clients and colleagues - Cleanliness on the floor and behind the bar - Disciplinary consequences
      for non-compliance Note: these are non-negotiable standards, not suggestions.

      '
    content_ru: 'Базовые правила поведения в зале: - Профессиональный внешний вид и дресс‑код всегда - Этичное общение с клиентами
      и коллегами - Чистота в зале и за баром - Дисциплинарные последствия за несоблюдение Примечание: это обязательные стандарты,
      а не рекомендации.

      '
    title_ka: მენეჯერის ქცევის წესები და ეთიკა
    content_ka: 'იატაკზე ქცევის ძირითადი წესები: - პროფესიონალური გარეგნობა და ჩაცმის კოდი ნებისმიერ დროს - ეთიკა კლიენტებთან
      და კოლეგებთან კომუნიკაციისას - სისუფთავე იატაკზე და გისოსის მიღმა - დისციპლინური შედეგები შეუსაბამობისთვის შენიშვნა:
      ეს არის შეუსაბამო სტანდარტები და არა წინადადებები.'
  - order: 7
    title: What is espresso?
    title_en: What is espresso?
    title_ru: Что такое эспрессо?
    content: '- Brief history of espresso - How it is prepared (extraction, pressure, temperature) - Health benefits and unique
      properties - Why espresso is the foundation of everything we sell

      '
    content_en: '- Brief history of espresso - How it is prepared (extraction, pressure, temperature) - Health benefits and
      unique properties - Why espresso is the foundation of everything we sell

      '
    content_ru: '- Краткая история эспрессо - Как он готовится (экстракция, давление, температура) - Польза и уникальные свойства
      - Почему эспрессо — основа всего, что мы продаём

      '
    title_ka: რა არის ესპრესო?
    content_ka: '- ესპრესოს მოკლე ისტორია - როგორ მზადდება (მოპოვება, წნევა, ტემპერატურა) - ჯანმრთელობის სარგებელი და უნიკალური
      თვისებები - რატომ არის ესპრესო ყველაფრის საფუძველი, რასაც ჩვენ ვყიდით'
  - order: 8
    title: Coffee menu and quality criteria
    title_en: Coffee menu and quality criteria
    title_ru: Кофейное меню и критерии качества
    content: 'Study the full coffee menu. Learn the quality criteria for every drink: correct crema, temperature, texture,
      volume, and timing.

      '
    content_en: 'Study the full coffee menu. Learn the quality criteria for every drink: correct crema, temperature, texture,
      volume, and timing.

      '
    content_ru: 'Изучите полное кофейное меню. Разберите критерии качества для каждого напитка: правильная крема, температура,
      текстура, объём и тайминг.

      '
    title_ka: ყავის მენიუ და ხარისხის კრიტერიუმები
    content_ka: 'შეისწავლეთ ყავის სრული მენიუ. შეიტყვეთ ყველა სასმელის ხარისხის კრიტერიუმები: სწორი კრემი, ტემპერატურა, ტექსტურა,
      მოცულობა და დრო.'
  - order: 9
    title: Coffee product range — intro
    title_en: Coffee product range — intro
    title_ru: Ассортимент кофе — введение
    content: '- Monosorts vs. blends (Букеты): how to tell them apart by packaging colour - Brief intro to Arabica vs. Robusta
      - Who is a barista and what is their role

      '
    content_en: '- Monosorts vs. blends (Букеты): how to tell them apart by packaging colour - Brief intro to Arabica vs.
      Robusta - Who is a barista and what is their role

      '
    content_ru: '- Моносорта и бленды («букеты»): как отличать по цвету упаковки - Кратко: арабика vs робуста - Кто такой
      бариста и в чём его роль

      '
    title_ka: ყავის პროდუქტების ასორტიმენტი - შესავალი
    content_ka: '- Monosorts vs. blends (Букеты): როგორ განვასხვავოთ ისინი შეფუთვის ფერის მიხედვით - მოკლე შესავალი Arabica
      vs. Robusta - ვინ არის ბარისტა და რა არის მისი როლი'
  - order: 10
    title: Sales techniques and Dim Kava scripts
    title_en: Sales techniques and Dim Kava scripts
    title_ru: Техники продаж и скрипты Dim Kava
    content: '- Smile and enthusiasm as a foundation - DK loyalty card benefits and how to present them to clients - Up-sale
      technique (higher price / larger size) - Cross-sale technique (complementary products)

      '
    content_en: '- Smile and enthusiasm as a foundation - DK loyalty card benefits and how to present them to clients - Up-sale
      technique (higher price / larger size) - Cross-sale technique (complementary products)

      '
    content_ru: '- Улыбка и энтузиазм как основа - Преимущества карты лояльности DK и как о них рассказать клиенту - Up‑sale
      (более высокая цена / больший размер) - Cross‑sale (дополняющие товары)

      '
    title_ka: გაყიდვების ტექნიკა და Dim Kava სკრიპტები
    content_ka: '- ღიმილი და ენთუზიაზმი, როგორც საფუძველი - DK ლოიალობის ბარათის უპირატესობები და როგორ წარვუდგინოთ ისინი
      კლიენტებს.'
  - order: 11
    title: End-of-day cleaning
    title_en: End-of-day cleaning
    title_ru: Уборка в конце дня
    content: 'Actively participate in closing: washing coffee machines, holders, grinder flasks, cleaning shelves and floor.
      Learn the closing checklist.

      '
    content_en: 'Actively participate in closing: washing coffee machines, holders, grinder flasks, cleaning shelves and floor.
      Learn the closing checklist.

      '
    content_ru: 'Активно участвуйте в закрытии: мойка кофемашин, холдеров, бункеров/воронок кофемолок, уборка полок и пола.
      Изучите чек‑лист закрытия.

      '
    title_ka: დღის ბოლოს გაწმენდა
    content_ka: 'აქტიური მონაწილეობა დახურვაში: სარეცხი ყავის მანქანები, დამჭერები, საფქვავი კოლბები, თაროების და იატაკის
      საწმენდი. ისწავლეთ დახურვის ჩამონათვალი.'
  title_ka: დღე 1 - დაწყება
  description_ka: პირველი დღე სამსახურში. გუნდის გაცნობა, მაღაზიის ტური, პირველი დეგუსტაცია და იმის გაგება, თუ რა არის Dim
    Kava.
- slug: days-2-3
  title: Days 2–3 — Coffee Knowledge
  title_en: Days 2–3 — Coffee Knowledge
  title_ru: Дни 2–3 — Знания о кофе
  order: 2
  estimated_minutes: 960
  description: 'Deep dive into coffee: growing, processing, roasting, grinding, and preparation methods.

    '
  description_en: 'Deep dive into coffee: growing, processing, roasting, grinding, and preparation methods.

    '
  description_ru: 'Углублённое изучение кофе: выращивание, обработка, обжарка, помол и способы приготовления.

    '
  steps:
  - order: 1
    title: Where and how green coffee grows
    title_ru: Где и как растёт зелёный кофе
    content: '- Coffee belt geography (equatorial regions) - Climate, altitude, and soil conditions - Coffee cherry cycle
      from flower to harvest

      '
    content_ru: '- География кофейного пояса (экваториальные регионы) - Климат, высота над уровнем моря и почвенные условия
      - Цикл кофейной ягоды от цветения до сбора урожая

      '
    title_ka: სად და როგორ იზრდება მწვანე ყავა
    content_ka: '- ყავის სარტყლის გეოგრაფია (ეკვატორული რეგიონები) - კლიმატი, სიმაღლე და ნიადაგის პირობები - ყავის ალუბლის
      ციკლი ყვავილიდან მოსავალამდე'
  - order: 2
    title: Coffee tree species
    title_ru: Виды кофейных деревьев
    content: '- Arabica: flavour profile, growing conditions, market share - Robusta: strength, caffeine, foam quality - Key
      differences in taste, growing, and use

      '
    content_ru: '- Арабика: вкусовой профиль, условия выращивания, доля рынка - Робуста: крепость, кофеин, качество пенки
      - Ключевые различия во вкусе, выращивании и применении

      '
    title_ka: ყავის ხის სახეობები
    content_ka: '- არაბიკა: გემოს პროფილი, ზრდის პირობები, ბაზრის წილი - რობუსტა: სიძლიერე, კოფეინი, ქაფის ხარისხი - ძირითადი
      განსხვავებები გემოში, ზრდასა და გამოყენებაში'
  - order: 3
    title: Blaser coffee brands and range at Dim Kava
    title_ru: Кофейные бренды Blaser и ассортимент в Dim Kava
    content: '- Blaser Café (Switzerland) — our main brand - Green coffee origins and blends represented - How to navigate
      the product catalogue

      '
    content_ru: '- Blaser Café (Швейцария) — наш основной бренд - Представленные зерновые происхождения и смеси - Как ориентироваться
      в каталоге продукции

      '
    title_ka: Blaser ყავის ბრენდები და ასორტიმენტი Dim Kava-ში
    content_ka: '- Blaser Café (შვეიცარია) - ჩვენი მთავარი ბრენდი - წარმოდგენილია მწვანე ყავის წარმოშობა და ნაზავი - როგორ
      ნავიგაცია პროდუქციის კატალოგში'
  - order: 4
    title: Roasting types and their effect on flavour
    title_ru: Типы обжарки и их влияние на вкус
    content: '- Light / medium / dark roast - How roasting changes chemical composition - Which roast works best for which
      preparation method - How Blaser approaches roasting

      '
    content_ru: '- Светлая / средняя / тёмная обжарка - Как обжарка меняет химический состав - Какая обжарка лучше подходит
      к какому способу приготовления - Подход Blaser к обжарке

      '
    title_ka: გამოწვის სახეები და მათი გავლენა გემოზე
    content_ka: '- ღია / საშუალო / მუქი შემწვარი - როგორ ცვლის შეწვა ქიმიურ შემადგენლობას - რომელი შემწვარი მუშაობს საუკეთესოდ
      რომელ მომზადების მეთოდზე - როგორ უახლოვდება Blaser შეწვას'
  - order: 5
    title: Coffee serving standards
    title_ru: Стандарты подачи кофе
    content: '- How to present a cup to the client (holding from below, announcing the drink) - Temperature, crema appearance,
      and garnish - Phrase to use: "Your [drink name]! Enjoy!"

      '
    content_ru: '- Как подать чашку клиенту (держать снизу, назвать напиток) - Температура, вид кремы, гарнир - Фраза: «Ваш
      [название напитка]! Приятного аппетита!»

      '
    title_ka: ყავის მირთმევის სტანდარტები
    content_ka: '- როგორ მივაწოდოთ ფინჯანი კლიენტს (ქვემოდან უჭირავს, სასმელს აცხადებს) - ტემპერატურა, კრემის გარეგნობა და
      გარნირი - გამოსაყენებელი ფრაზა: "თქვენი [სასმელის სახელი]! გემრიელად მიირთვით!"'
  - order: 6
    title: Harvesting and processing methods
    title_ru: Сбор и способы обработки
    content: '- Picking methods: selective pick, strip pick, machine - Processing: washed, natural, honey - How processing
      affects the final flavour profile

      '
    content_ru: '- Способы сбора: селективный, полный срез, машинный - Обработка: мытая, натуральная, honey (мёд) - Как обработка
      влияет на итоговый вкусовой профиль

      '
    title_ka: მოსავლის აღების და გადამუშავების მეთოდები
    content_ka: '- კრეფის მეთოდები: შერჩევითი კრეფა, ზოლები, მანქანა - დამუშავება: გარეცხილი, ნატურალური, თაფლი - როგორ მოქმედებს
      დამუშავება საბოლოო გემოს პროფილზე'
  - order: 7
    title: Grinding — basics
    title_ru: Помол — основы
    content: '- Grind sizes and which preparation method each suits - Espresso / filter / French press / Turkish - How to
      adjust grind on the machine

      '
    content_ru: '- Размеры помола и для какого способа приготовления какой подходит - Эспрессо / фильтр / френч-пресс / турка
      - Как регулировать помол на аппарате

      '
    title_ka: სახეხი - საფუძვლები
    content_ka: '- დაფქვის ზომები და თითოეული მომზადების მეთოდი შესაფერისია - ესპრესო / ფილტრი / ფრანგული პრესა / თურქული
      - როგორ მოვარგოთ დაფქვა მანქანაზე'
  - order: 8
    title: Decaf coffee
    title_ru: Кофе без кофеина
    content: '- How caffeine is removed from coffee beans - Taste differences vs regular coffee - Who it''s for and how to
      recommend it

      '
    content_ru: '- Как кофеин удаляют из зёрен - Отличия вкуса от обычного кофе - Для кого подходит и как рекомендовать

      '
    title_ka: უკოფეიდო ყავა
    content_ka: '- როგორ გამოიყოფა კოფეინი ყავის მარცვლებიდან - გემოვნების განსხვავება ჩვეულებრივ ყავასთან - ვისთვის არის
      ის და როგორ გირჩევთ'
  - order: 9
    title: Storing roasted coffee
    title_ru: Хранение обжаренного кофе
    content: '- Why packaging matters (valve, airtight) - Ideal conditions: temperature, light, humidity - Shelf life and
      what happens when coffee goes stale - Store display rules: always neat, always within expiry date

      '
    content_ru: '- Почему важна упаковка (клапан, герметичность) - Оптимальные условия: температура, свет, влажность - Срок
      годности и что происходит при устаревании зерна - Правила витрины: всегда аккуратно, всегда в пределах срока годности

      '
    title_ka: მოხალული ყავის შენახვა
    content_ka: '- რატომ არის მნიშვნელოვანი შეფუთვა (სარქველი, ჰერმეტულად) - იდეალური პირობები: ტემპერატურა, სინათლე, ტენიანობა
      - შენახვის ვადა და რა ხდება, როდესაც ყავა იწურება - შენახვის წესები: ყოველთვის სუფთა, ყოველთვის ვადის გასვლის თარიღი'
  title_ka: დღე 2-3 - ყავის ცოდნა
  description_ka: 'ღრმად ჩაყვინთვის ყავაში: მოყვანის, დამუშავების, შეწვის, დაფქვისა და მომზადების მეთოდები.'
- slug: week-1
  title: Week 1 — Core Skills
  title_en: Week 1 — Core Skills
  title_ru: Неделя 1 — Базовые навыки
  order: 3
  estimated_minutes: 2400
  description: 'Building core barista and sales skills. Drink preparation, equipment operation, coffee knowledge consolidation.

    '
  description_en: 'Building core barista and sales skills. Drink preparation, equipment operation, coffee knowledge consolidation.

    '
  description_ru: 'Формирование базовых навыков бариста и продаж. Приготовление напитков, работа с оборудованием, закрепление
    знаний о кофе.

    '
  steps:
  - order: 1
    title: Preparing drinks without milk
    title_ru: Приготовление напитков без молока
    content: '- Espresso, lungo, americano, ristretto — differences and preparation - Correct dose, extraction time (approx.
      25–30 sec for espresso), volume - How to check quality: 3 signs of a correct shot - Difference between americano and
      lungo

      '
    content_ru: '- Эспрессо, лунго, американо, ристретто — отличия и приготовление - Правильная доза, время экстракции (около
      25–30 сек для эспрессо), объём - Как проверить качество: 3 признака правильного шота - Разница между американо и лунго

      '
    title_ka: სასმელების მომზადება რძის გარეშე
    content_ka: '- ესპრესო, ლუნგო, ამერიკანო, რისტრეტო - განსხვავებები და მომზადება - სწორი დოზა, ექსტრაქციის დრო (დაახლოებით
      25–30 წმ ესპრესოსთვის), მოცულობა - როგორ შევამოწმოთ ხარისხი: სწორი გასროლის 3 ნიშანი - განსხვავება ამერიკანოსა და ლუნგოს
      შორის'
  - order: 2
    title: Espresso and cappuccino quality criteria
    title_ru: Критерии качества эспрессо и капучино
    content: '- Espresso parameters: time, volume, grammes - What correct crema looks like (colour, density, persistence)
      - Milk texture for cappuccino: microfoam, temperature (60–65°C) - What happens if milk is overheated - How a barista
      checks their own drink quality

      '
    content_ru: '- Параметры эспрессо: время, объём, граммы - Как выглядит правильная крема (цвет, плотность, устойчивость)
      - Текстура молока для капучино: микропена, температура (60–65°C) - Что происходит при перегреве молока - Как бариста
      проверяет качество своего напитка

      '
    title_ka: ესპრესო და კაპუჩინოს ხარისხის კრიტერიუმები
    content_ka: '- ესპრესოს პარამეტრები: დრო, მოცულობა, გრამი - როგორ გამოიყურება სწორი კრემი (ფერი, სიმკვრივე, გამძლეობა)
      - რძის ტექსტურა კაპუჩინოსთვის: მიკროქაფი, ტემპერატურა (60–65°C) - რა მოხდება, თუ რძე გადახურდება - როგორ ამოწმებს ბარისტა
      საკუთარი სასმელის ხარისხს'
  - order: 3
    title: Coffee knowledge — history
    title_ru: Знания о кофе — история
    content: '- Country where coffee was first consumed (Ethiopia) - First coffee house (Istanbul / Venice, debate) - Espresso''s
      Italian origin

      '
    content_ru: '- Страна, где кофе впервые начали пить (Эфиопия) - Первые кофейни (Стамбул / Венеция — в дискуссии) - Итальянское
      происхождение эспрессо

      '
    title_ka: ყავის ცოდნა - ისტორია
    content_ka: '- ქვეყანა, სადაც პირველად მოიხმარეს ყავა (ეთიოპია) - პირველი ყავის სახლი (სტამბოლი / ვენეცია, დებატები) -
      ესპრესოს იტალიური წარმოშობა'
  - order: 4
    title: Coffee growing regions
    title_ru: Регионы выращивания кофе
    content: '- Three main growing regions: Africa, Latin America, Asia-Pacific - Conditions required: altitude, rainfall,
      temperature - How region affects flavour (terroir concept)

      '
    content_ru: '- Три основных региона: Африка, Латинская Америка, Азиатско-Тихоокеанский - Необходимые условия: высота,
      осадки, температура - Как регион влияет на вкус (концепция терруара)

      '
    title_ka: ყავის მზარდი რეგიონები
    content_ka: '- სამი ძირითადი მზარდი რეგიონი: აფრიკა, ლათინური ამერიკა, აზია-წყნარი ოკეანე - საჭირო პირობები: სიმაღლე,
      ნალექი, ტემპერატურა - რა გავლენას ახდენს რეგიონი გემოზე (ტეროირის კონცეფცია)'
  - order: 5
    title: Green coffee classification
    title_ru: Классификация зелёного кофе
    content: '- Classification parameters: screen size, defect count, cup score - Specialty grade (SCA score 80+) - What specialty
      means in practice

      '
    content_ru: '- Параметры классификации: размер сита, количество дефектов, cup score - Грейд specialty (оценка SCA 80+)
      - Что specialty означает на практике

      '
    title_ka: მწვანე ყავის კლასიფიკაცია
    content_ka: '- კლასიფიკაციის პარამეტრები: ეკრანის ზომა, დეფექტების რაოდენობა, თასის ქულა - სპეციალობის ხარისხი (SCA ქულა
      80+) - რას ნიშნავს სპეციალობა პრაქტიკაში'
  - order: 6
    title: Coffee machine — startup sequence
    title_ru: Кофемашина — порядок включения
    content: 'Learn and memorise the exact startup sequence for the coffee machine. This is mandatory knowledge — tested in
      every quiz. See also: daily checklist step 2.

      '
    content_ru: 'Выучите и запомните точную последовательность включения кофемашины. Это обязательные знания — проверяются
      в каждом тесте. См. также: шаг 2 ежедневного чек-листа.

      '
    title_ka: ყავის მანქანა - გაშვების თანმიმდევრობა
    content_ka: 'ისწავლეთ და დაიმახსოვრეთ ყავის აპარატის გაშვების ზუსტი თანმიმდევრობა. ეს არის სავალდებულო ცოდნა - ტესტირება
      ყველა ვიქტორინაში. აგრეთვე იხილეთ: ყოველდღიური საკონტროლო სიის ნაბიჯი 2.'
  - order: 7
    title: Daily equipment testing
    title_ru: Ежедневное тестирование оборудования
    content: '- Why we test at least one machine daily - What to check: pressure, temperature, extraction time, cleanliness
      - How to record the test result and report in Telegram chat

      '
    content_ru: '- Зачем тестируем минимум одну машину ежедневно - Что проверять: давление, температура, время экстракции,
      чистота - Как зафиксировать результат и отчитаться в чате Telegram

      '
    title_ka: აღჭურვილობის ყოველდღიური ტესტირება
    content_ka: '- რატომ ვამოწმებთ მინიმუმ ერთ მანქანას ყოველდღიურად - რა უნდა შევამოწმოთ: წნევა, ტემპერატურა, ამოღების დრო,
      სისუფთავე - როგორ ჩავწეროთ ტესტის შედეგი და შეგვატყობინოთ ტელეგრამის ჩატში'
  - order: 8
    title: Loyalty card — client interaction
    title_ru: Карта лояльности — работа с клиентом
    content: '- Ask every client about their card, every time, enthusiastically - Explain benefits clearly: free cups, free
      packs, bonuses - How to register a new card in Shop Seller - When the card is free - What a tasting cup means and how
      to track it

      '
    content_ru: '- Спрашивайте у каждого клиента про карту, каждый раз, с энтузиазмом - Чётко объясняйте выгоды: бесплатные
      чашки, пачки, бонусы - Как зарегистрировать новую карту в Shop Seller - Когда карта бесплатная - Что такое дегустационная
      чашка и как её отслеживать

      '
    title_ka: ლოიალობის ბარათი - კლიენტთან ურთიერთქმედება
    content_ka: '- ჰკითხეთ თითოეულ კლიენტს მათი ბარათის შესახებ, ყოველ ჯერზე, ენთუზიაზმით - ნათლად აუხსენით სარგებელი: უფასო
      თასები, უფასო პაკეტები, ბონუსები - როგორ დაარეგისტრიროთ ახალი ბარათი მაღაზიაში გამყიდველში - როცა ბარათი უფასოა - რას
      ნიშნავს დეგუსტაციის თასი და როგორ აკონტროლოთ იგი'
  - order: 9
    title: Sales script — daily practice
    title_ru: Скрипт продаж — ежедневная практика
    content: 'Practice the full sales script: 1. Greet client (loud and clear, eye contact, smile) 2. Identify needs (ask
      questions about preferences) 3. Present 3 coffee packages (let them smell) 4. Mention: Swiss roasting, specialty, hand-picked,
      SCA quality 5. Ask about loyalty card 6. Offer cross-sale or up-sale 7. Process order in Shop Seller 8. Farewell: "See
      you again! Next time try..."

      '
    content_ru: 'Отработайте полный скрипт продаж: 1. Поприветствуйте клиента (громко и чётко, зрительный контакт, улыбка)
      2. Выясните потребности (вопросы о предпочтениях) 3. Покажите 3 упаковки кофе (дайте понюхать) 4. Упомяните: швейцарская
      обжарка, specialty, ручной сбор, качество SCA 5. Спросите про карту лояльности 6. Предложите кросс-продажу или апсейл
      7. Оформите заказ в Shop Seller 8. Прощание: «Ждём снова! В следующий раз попробуйте…»

      '
    title_ka: გაყიდვების სკრიპტი - ყოველდღიური პრაქტიკა
    content_ka: 'ივარჯიშეთ გაყიდვების სრული სკრიპტი: 1. მიესალმეთ კლიენტს (ხმამაღლა და გარკვევით, თვალით კონტაქტი, ღიმილი)
      2. მოთხოვნილებების იდენტიფიცირება (დასვით კითხვები პრეფერენციებზე) 3. წარმოადგინეთ ყავის 3 პაკეტი (დაუშვით სუნი) 4.
      აღნიშნეთ: შვეიცარიული შემწვარი, სპეციალობა, ხელით შერჩეული, SCA ხარისხი 5. ჰკითხეთ ლოიალობის ბარათებს6.7. მაღაზიის გამყიდველი
      8. დამშვიდობება: "კიდევ შევხვდებით! შემდეგ ჯერზე სცადეთ..."'
  title_ka: კვირა 1 - ძირითადი უნარები
  description_ka: ძირითადი ბარისტებისა და გაყიდვების უნარების ჩამოყალიბება. სასმელის მომზადება, აღჭურვილობის ექსპლუატაცია,
    ყავის ცოდნის კონსოლიდაცია.
