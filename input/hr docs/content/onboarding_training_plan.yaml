    title_ka: რძის დაფუძნებული ესპრესო სასმელები
    content_ka: '- ლატე, კაპუჩინო, ბრტყელი თეთრი, კორტადო - მომზადების განსხვავებები - რძის ორთქლზე მომზადების ტექნიკა: პოზიცია,
      კუთხე, ტემპერატურა - როგორ ამოვიცნოთ სწორად მოხარშული რძე - გავრცელებული შეცდომები და როგორ ავიცილოთ თავიდან - სწორი
      ტემპერატურა: ესპრესო 88–92°C, რძის ქაფი 60–65°C'
  - order: 2
    title: Caotina — product knowledge
    title_ru: Caotina — знание продукта
    content: '- What Caotina is: premium Swiss drinking chocolate - How it differs from regular cocoa powder (quality, taste,
      texture) - Available flavours - Manufacturer''s recommended serving (dosage per drink) - Best milk pairing - How to
      prepare for maximum flavour - Other uses (baking, toppings) - How to recommend it to clients who buy coffee

      '
    content_ru: '- Что такое Caotina: премиальный швейцарский питьевой шоколад - Чем отличается от обычего какао-порошка (качество,
      вкус, текстура) - Доступные вкусы - Рекомендуемая дозировка производителя на напиток - С каким молоком лучше всего сочетается
      - Как приготовить для максимального вкуса - Другие применения (выпечка, топпинги) - Как рекомендовать клиентам, которые
      покупают кофе

      '
    title_ka: კაოტინა - პროდუქტის ცოდნა
    content_ka: '- რა არის კაოტინა: პრემიუმ შვეიცარიული სასმელი შოკოლადი - რით განსხვავდება ის ჩვეულებრივი კაკაოს ფხვნილისგან
      (ხარისხი, გემო, ტექსტურა) - ხელმისაწვდომი გემოები - მწარმოებლის მიერ რეკომენდებული პორცია (დოზირება თითო სასმელზე) -
      საუკეთესო რძის შეხამება - როგორ მოვამზადოთ მაქსიმალური გემოსთვის - სხვა გამოყენება (საცხობი, ტოპინგები) - როგორ ურჩიოს
      ყავა კლიენტს'
  - order: 3
    title: Delonghi coffee machines — manual vs automatic
    title_ru: Кофемашины Delonghi — ручные и автоматические
    content: '- Manual (pump) machines: user controls brewing, barista skill required - Automatic (bean-to-cup) machines:
      one-touch operation, client convenience - Key differences in use, maintenance, and client profile - How to explain the
      difference to a client - Main Delonghi models in our range

      '
    content_ru: '- Ручные (рожковые): пользователь управляет завариванием, нужны навыки бариста - Автоматические (зерно в
      чашку): одно касание, удобство для клиента - Ключевые отличия в использовании, обслуживании и профиле клиента - Как
      объяснить разницу клиенту - Основные модели Delonghi в нашем ассортименте

      '
    title_ka: Delonghi ყავის აპარატები — მექანიკური vs ავტომატური
    content_ka: '- მექანიკური (ტუმბოს) აპარატები: მომხმარებლის კონტროლის მოხარშვა, საჭირო ბარისტას უნარი - ავტომატური (ლობიოს
      ჭიქის) აპარატები: ერთი შეხებით მუშაობა, კლიენტის მოხერხებულობა - ძირითადი განსხვავებები გამოყენებაში, შენარჩუნებაში
      და კლიენტის პროფილი - როგორ ავუხსნათ განსხვავება კლიენტს - Delonghi-ის ძირითადი მოდელები ჩვენს ასორტიმენტში'
  - order: 4
    title: Up-sale and cross-sale — practice
    title_ru: Апсейл и кросс-продажа — практика
    content: 'Practice real scenarios: - Client buys coffee → offer Caotina, drip packs, or accessories - Client buys a drink
      → offer a snack (Lomba bar, Choco Choco, cookies) - Client buys equipment → offer coffee, accessories, cleaning products
      - Client wants the cheapest option → present the next tier up and explain value

      '
    content_ru: 'Отработайте реальные сценарии: - Клиент покупает кофе → предложите Caotina, дрип-пакеты или аксессуары -
      Клиент покупает напиток → предложите снек (батончик Lomba, Choco Choco, печенье) - Клиент покупает оборудование → предложите
      кофе, аксессуары, средства для чистки - Клиент хочет самый дешёвый вариант → покажите следующий уровень и объясните
      ценность

      '
    title_ka: Up-sale და cross-sale — პრაქტიკა
    content_ka: 'ივარჯიშეთ რეალურ სცენარებში: - კლიენტი ყიდულობს ყავას → სთავაზობს Caotina-ს, წვეთოვან პაკეტებს ან აქსესუარებს
      - კლიენტი ყიდულობს სასმელს → შესთავაზეს საჭმელს (Lomba bar, Choco Choco, ფუნთუშები) - კლიენტი ყიდულობს აღჭურვილობას
      → სთავაზობს ყავას, აქსესუარებს, დასუფთავების საშუალებებს - კლიენტს სურს ყველაზე იაფი ვარიანტი → წარმოადგინოს შემდეგი
      დონე და აუხსნას ღირებულება'
  - order: 5
    title: Latte art — introduction
    title_ru: Латте-арт — введение
    content: '- Basic latte art shapes: heart, rosette, tulip - Technique: milk pouring angle and speed - Practice daily and
      send photos to the team Telegram chat

      '
    content_ru: '- Базовые фигуры латте-арта: сердце, розетка, тюльпан - Техника: угол и скорость вливания молока - Практикуйтесь
      ежедневно и присылайте фото в командный чат Telegram

      '
    title_ka: ლატე ხელოვნება - შესავალი
    content_ka: '- ლატე არტის ძირითადი ფორმები: გული, როზეტა, ტიტები - ტექნიკა: რძის ჩამოსხმის კუთხე და სიჩქარე - ივარჯიშეთ
      ყოველდღიურად და გაგზავნეთ ფოტოები გუნდში Telegram chat-ში'
  title_ka: კვირა 2 - სასმელები და აღჭურვილობა
  description_ka: რძეზე დაფუძნებული სასმელები, Caotina-ს პროდუქტის ცოდნა, Delonghi აღჭურვილობის საფუძვლები.
- slug: week-3
  title: Week 3 — Specialty & Blaser Range
  title_en: Week 3 — Specialty & Blaser Range
  title_ru: Неделя 3 — Спешелти и ассортимент Blaser
  order: 5
  estimated_minutes: 2400
  description: 'Specialty coffee concept, Blaser product catalogue, client consultation skills.

    '
  description_en: 'Specialty coffee concept, Blaser product catalogue, client consultation skills.

    '
  description_ru: 'Концепция specialty, каталог продукции Blaser, навыки консультирования клиентов.

    '
  steps:
  - order: 1
    title: What is specialty coffee?
    title_ru: Что такое specialty coffee?
    content: '- SCA (Specialty Coffee Association) scoring system: 80+ points = specialty - Parameters evaluated: aroma, flavour,
      aftertaste, acidity, body, uniformity - Hand-picked harvest vs. machine picking - Why specialty costs more and how to
      explain this to a client

      '
    content_ru: '- Система оценки SCA (Specialty Coffee Association): 80+ баллов = specialty - Оцениваемые параметры: аромат,
      вкус, послевкусие, кислотность, тело, однородность - Ручной сбор vs машинный - Почему specialty дороже и как объяснить
      это клиенту

      '
    title_ka: რა არის სპეციალიზებული ყავა?
    content_ka: '- SCA (სპეციალისტური ყავის ასოციაცია) შეფასების სისტემა: 80+ ქულა = სპეციალობა - შეფასებული პარამეტრები:
      არომატი, გემო, გემო, მჟავიანობა, სხეული, ერთგვაროვნება - ხელით დაკრეფილი მოსავალი მანქანით კრეფის წინააღმდეგ - რატომ
      ღირს სპეციალობა მეტი და როგორ ავუხსნათ ეს კლიენტს'
  - order: 2
    title: Monosorts vs. blends (Bukety)
    title_ru: Моносорта и смеси (букеты)
    content: '- Monosort: 100% single origin, single variety — terroir expression - Blend (Buket): combination of origins/varieties
      — balance and consistency - How to read the Blaser packaging colour system - When to recommend monosort vs. blend

      '
    content_ru: '- Моносорт: 100% одно происхождение, один сорт — выражение терруара - Смесь (букет): сочетание происхождений/сортов
      — баланс и стабильность - Как читать цветовую систему упаковки Blaser - Когда рекомендовать моносорт, когда смесь

      '
    title_ka: Monosorts vs. blends (Bukety)
    content_ka: '- მონოსორტი: 100% ერთჯერადი წარმოშობის, ერთი ჯიში - ტერუარის გამოხატულება - ნაზავი (Buket): წარმოშობის/ჯიშების
      კომბინაცია - ბალანსი და თანმიმდევრულობა - როგორ წავიკითხოთ Blaser შეფუთვის ფერის სისტემა - როდის უნდა გირჩიოთ მონოსორტი
      ბლენდის წინააღმდეგ'
  - order: 3
    title: Blaser product catalogue — practical study
    title_ru: Каталог Blaser — практическое изучение
    content: "- Study at least 5 Blaser blends: name, origin, flavour notes - Study at least 3 Blaser monosorts: name, origin,\
      \ flavour notes - Practice describing flavour notes to a client in simple language - Example: \"This one has notes of\
      \ dark chocolate and almonds,\n  with low acidity — perfect if you prefer a rich, round cup\"\n"
    content_ru: "- Изучите минимум 5 смесей Blaser: название, происхождение, вкусовые ноты - Изучите минимум 3 моносорта Blaser:\
      \ название, происхождение, ноты - Практикуйтесь описывать ноты клиенту простым языком - Пример: «У этого тёмный шоколад\
      \ и миндаль, низкая кислотность —\n  отлично, если любите насыщенную, округлую чашку»\n"
    title_ka: Blaser-ის პროდუქტების კატალოგი — პრაქტიკული შესწავლა
    content_ka: "- შეისწავლეთ მინიმუმ 5 ბლეზერის ნაზავი: სახელი, წარმოშობა, გემოს ნოტები - შეისწავლეთ მინიმუმ 3 Blaser მონოსორტი:\
      \ სახელი, წარმოშობა, არომატის ნოტები - ივარჯიშეთ კლიენტისთვის მარტივი ენით აღწეროთ არომატის ნოტები - მაგალითი: \"ამას\
      \ აქვს მუქი შოკოლადისა და ნუშის ნოტები.\n  დაბალი მჟავიანობით - იდეალურია, თუ უპირატესობას ანიჭებთ მდიდარ, მრგვალ ჭიქას\""
  - order: 4
    title: Coffee consultation — matching to client taste
    title_ru: Консультация по кофе — подбор под вкус клиента
    content: "- How to ask the right questions: \"Do you prefer strong or mild?\"\n  \"Milk or black?\" \"Fruity/bright or\
      \ rich/deep?\"\n- How to explain mild vs. bright roast - How to recommend the right grind for their equipment at home\n"
    content_ru: "- Как задавать правильные вопросы: «Крепкий или мягкий?»\n  «С молоком или без?» «Фруктовая яркость или глубокое\
      \ тело?»\n- Как объяснить мягкую vs яркую обжарку - Как рекомендовать помол под домашнее оборудование клиента\n"
    title_ka: ყავის კონსულტაცია - კლიენტის გემოვნების შესაბამისი
    content_ka: "- როგორ დავსვათ სწორი კითხვები: \"ძლიერი გირჩევნიათ თუ რბილი?\"\n  \"რძე თუ შავი?\" \"ხილისფერი/ნათელი თუ\
      \ მდიდარი/ღრმა?\"\n- როგორ ავხსნათ რბილი და ნათელი შემწვარი - როგორ ვურჩიოთ სწორი სახეხი მათი აღჭურვილობისთვის სახლში"
  - order: 5
    title: Client service practice — full script
    title_ru: Обслуживание клиента — полный скрипт
    content: 'Run through the complete DK service standard from greeting to farewell. Practise with a colleague playing the
      client role. Checklist: greeting, needs identification, product presentation, smell offer, loyalty card, up/cross-sale,
      payment, farewell phrase.

      '
    content_ru: 'Пройдите полный стандарт обслуживания DK от приветствия до прощания. Отработайте с коллегой в роли клиента.
      Чек-лист: приветствие, выявление потребностей, презентация товара, предложение понюхать, карта лояльности, ап/кросс-продажа,
      оплата, прощальная фраза.

      '
    title_ka: კლიენტის მომსახურების პრაქტიკა — სრული სკრიპტი
    content_ka: 'გაიარეთ სრული DK სერვისის სტანდარტი მისალმებიდან გამოსამშვიდობებლად. ივარჯიშეთ კოლეგასთან, რომელიც ასრულებს
      კლიენტის როლს. საკონტროლო სია: მისალმება, საჭიროების იდენტიფიკაცია, პროდუქტის პრეზენტაცია, სუნის შეთავაზება, ლოიალობის
      ბარათი, გაყიდვა/ჯვარედინი გაყიდვა, გადახდა, გამოსამშვიდობებელი ფრაზა.'
  title_ka: კვირა 3 - სპეციალობა და ბლაზერის დიაპაზონი
  description_ka: სპეციალიზებული ყავის კონცეფცია, Blaser-ის პროდუქტების კატალოგი, კლიენტებთან კონსულტაციის უნარები.
- slug: month-1
  title: Month 1 — Independent Work
  title_en: Month 1 — Independent Work
  title_ru: Месяц 1 — Самостоятельная работа
  order: 6
  estimated_minutes: 3600
  description: 'Consolidation of all previous knowledge. Independent counter work, Shop Seller operations, inventory, discounts,
    company structure.

    '
  description_en: 'Consolidation of all previous knowledge. Independent counter work, Shop Seller operations, inventory, discounts,
    company structure.

    '
  description_ru: 'Закрепление всего пройденного. Самостоятельная работа за стойкой, операции в Shop Seller, инвентаризация,
    скидки, структура компании.

    '
  steps:
  - order: 1
    title: Independent counter work — order flow
    title_ru: Самостоятельная работа за стойкой — цикл заказа
    content: 'Full order flow without assistance: 1. Greet client 2. Identify needs 3. Enter order in Shop Seller 4. Scan
      DK loyalty card 5. Process payment (cash / card / transfer) 6. Issue receipt 7. Prepare order 8. Serve and farewell

      '
    content_ru: 'Полный цикл заказа без помощи: 1. Поприветствовать клиента 2. Выяснить потребности 3. Внести заказ в Shop
      Seller 4. Сканировать карту лояльности DK 5. Провести оплату (наличные / карта / перевод) 6. Выдать чек 7. Приготовить
      заказ 8. Подать и попрощаться

      '
    title_ka: დამოუკიდებელი მრიცხველის მუშაობა - შეკვეთის ნაკადი
    content_ka: 'შეკვეთის სრული ნაკადი დახმარების გარეშე: 1. მიესალმეთ კლიენტს 2. იდენტიფიცირეთ საჭიროებები 3. შეიყვანეთ შეკვეთა
      მაღაზიაში გამყიდველში 4. DK ლოიალობის ბარათის სკანირება 5. გადახდის პროცესი (ნაღდი ფული / ბარათი / გადარიცხვა) 6. ქვითარის
      გაცემა 7. შეკვეთის მომზადება 8. მომსახურება და დამშვიდობება'
  - order: 2
    title: Closing the cash register
    title_ru: Закрытие кассы
    content: '- Actions after end-of-day cash close - Filling in accounting sheets with Z-reports from all terminals - Balancing
      the register (cash in till must match Shop Seller total) - Recording cash expenses with mandatory description - Closing
      the day in Shop Seller

      '
    content_ru: '- Действия после закрытия кассы в конце дня - Заполнение учётных листов с Z-отчётами со всех терминалов -
      Сверка кассы (наличные в ящике = итогу Shop Seller) - Учёт расходов наличными с обязательным описанием - Закрытие дня
      в Shop Seller

      '
    title_ka: სალარო აპარატის დახურვა
    content_ka: '- ქმედებები დღის ბოლოს ნაღდი ფულის დახურვის შემდეგ - სააღრიცხვო ფურცლების შევსება Z- ანგარიშებით ყველა ტერმინალიდან
      - რეესტრის დაბალანსება (ნაღდი ფული უნდა შეესაბამებოდეს მაღაზიის გამყიდველს) - ნაღდი ფულის დანახარჯების აღრიცხვა სავალდებულო
      აღწერილობით - დღის დახურვა მაღაზია გამყიდველში'
  - order: 3
    title: Bar cleaning — during the day
    title_ru: Уборка бара — в течение дня
    content: '- What is included in daytime bar maintenance - Surfaces, coffee machine, grinder, take-away zone - Product
      packaging alignment (always neat, always in place)

      '
    content_ru: '- Что входит в дневное обслуживание бара - Поверхности, кофемашина, кофемолка, зона навынос - Выравнивание
      упаковки товара (всегда аккуратно, всегда на месте)

      '
    title_ka: ბარის დასუფთავება - დღის განმავლობაში
    content_ka: '- რა შედის დღისით ბარის მოვლაში - ზედაპირები, ყავის აპარატი, საფქვავი, გასატანი ზონა - პროდუქტის შეფუთვის
      გასწორება (ყოველთვის მოწესრიგებული, ყოველთვის ადგილზე)'
  - order: 4
    title: Loyalty card — full knowledge
    title_ru: Карта лояльности — полное знание
    content: '- All DK loyalty card bonuses - How to check client''s current bonus balance - When free cups are credited -
      Gift card registration - Lost card recovery procedure - Tasting cup: what it is, how to redeem, how to write off in
      programme

      '
    content_ru: '- Все бонусы карты лояльности DK - Как проверить текущий баланс бонусов клиента - Когда начисляются бесплатные
      чашки - Регистрация подарочной карты - Процедура восстановления утерянной карты - Дегустационная чашка: что это, как
      списать, как провести в программе

      '
    title_ka: ერთგული ბარათი - სრული ცოდნა
    content_ka: '- DK ლოიალობის ბარათის ყველა ბონუსი - როგორ შევამოწმოთ კლიენტის ამჟამინდელი ბონუს ბალანსი - უფასო თასების
      ჩარიცხვის დროს - სასაჩუქრე ბარათის რეგისტრაცია - დაკარგული ბარათის აღდგენის პროცედურა - დეგუსტაციის ჭიქა: რა არის ეს,
      როგორ გამოისყიდოთ, როგორ ჩამოვწეროთ პროგრამაში'
  - order: 5
    title: Shop Seller — sales operations
    title_ru: Shop Seller — операции продаж
    content: 'Full knowledge of Shop Seller: - Conducting a sale (full process) - Entering beverage packaging for drink preparation
      - Payment types: cash, card, bank transfer — each flow - Issuing a receipt copy to client - Handling overage receipts
      (mistakes) - End-of-day close procedure - What to do if programme total ≠ cash register total

      '
    content_ru: 'Полное знание Shop Seller: - Проведение продажи (полный процесс) - Ввод упаковки напитка для приготовления
      - Типы оплаты: наличные, карта, перевод — сценарий для каждого - Выдача копии чека клиенту - Лишние чеки (ошибки) -
      Процедура закрытия дня - Что делать, если итог программы ≠ итогу кассы

      '
    title_ka: მაღაზია გამყიდველი - გაყიდვების ოპერაციები
    content_ka: 'მაღაზიის გამყიდველის სრული ცოდნა: - გაყიდვის ჩატარება (სრული პროცესი) - სასმელის მომზადებისთვის სასმელის
      შეფუთვაში შეყვანა - გადახდის სახეები: ნაღდი ანგარიშსწორება, ბარათი, საბანკო გადარიცხვა - ყოველი ნაკადი - ქვითრის ასლის
      გაცემა კლიენტზე - გადაჭარბებული ქვითრების დამუშავება (შეცდომები) - დღის ბოლოს დახურვის პროცედურა - რა უნდა გააკეთოს,
      თუ პროგრამის მთლიანი რეგისტრაცია ≠ ნაღდი ფულის რეგისტრაცია'
  - order: 6
    title: Inventory — daily and monthly
    title_ru: Инвентаризация — ежедневная и ежемесячная
    content: '- Daily inventory: what to count, how to record, what to note in comments - Monthly inventory: full product
      count, quality check, expiry tracking - Difference between daily and monthly procedures - How to record correctly in
      Shop Seller

      '
    content_ru: '- Ежедневная: что пересчитывать, как фиксировать, что писать в комментариях - Ежемесячная: полный пересчёт,
      проверка качества, сроки годности - Разница между ежедневной и ежемесячной процедурой - Как корректно внести в Shop
      Seller

      '
    title_ka: ინვენტარი - ყოველდღიური და ყოველთვიური
    content_ka: '- ყოველდღიური ინვენტარი: რა უნდა დაითვალოს, როგორ ჩაიწეროს, რა უნდა აღინიშნოს კომენტარებში - ყოველთვიური
      ინვენტარი: პროდუქტის სრული რაოდენობა, ხარისხის შემოწმება, ვადის გასვლის თვალყურის დევნება - განსხვავება ყოველდღიურ და
      ყოველთვიურ პროცედურებს შორის - როგორ ჩავწეროთ სწორად მაღაზიაში გამყიდველი'
  - order: 7
    title: Discounts — representative and dealer
    title_ru: Скидки — представитель и дилер
    content: '- How to calculate representative discount - How to calculate dealer discount - Who qualifies for discounted
      access/price in our store network - Diplomat discount: amount and how to process it

      '
    content_ru: '- Как считать представительскую скидку - Как считать дилерскую скидку - Кто имеет право на льготный доступ/цену
      в сети магазинов - Дипломатическая скидка: размер и как оформить

      '
    title_ka: ფასდაკლებები — წარმომადგენელი და დილერი
    content_ka: '- როგორ გამოვთვალოთ წარმომადგენლობითი ფასდაკლება - როგორ გამოვთვალოთ დილერის ფასდაკლება - ვინ კვალიფიცირდება
      ფასდაკლებულ წვდომაზე/ფასზე ჩვენს მაღაზიათა ქსელში - დიპლომატის ფასდაკლება: თანხა და როგორ დავამუშავოთ იგი'
  - order: 8
    title: Company structure
    title_ru: Структура компании
    content: '- Management structure: leadership, departments, stores - How information flows: manager → team → store - Where
      to find current promotions - How to communicate promotions to clients

      '
    content_ru: '- Структура управления: руководство, отделы, магазины - Как идёт информация: менеджер → команда → магазин
      - Где смотреть актуальные акции - Как доносить акции до клиентов

      '
    title_ka: კომპანიის სტრუქტურა
    content_ka: '- მართვის სტრუქტურა: ხელმძღვანელობა, განყოფილებები, მაღაზიები - როგორ მიედინება ინფორმაცია: მენეჯერი → გუნდი
      → მაღაზია - სად ვიპოვოთ მიმდინარე აქციები - როგორ მივაწოდოთ აქციები კლიენტებს'
  - order: 9
    title: Blaser coffee — flavour range
    title_ru: Кофе Blaser — вкусовой диапазон
    content: '- How to explain the difference between mild and bright roast - Name and describe at least one Blaser blend
      from the catalogue - Flavour notes vocabulary: chocolate, fruit, nuts, floral, caramel

      '
    content_ru: '- Как объяснить разницу между мягкой и яркой обжаркой - Назвать и описать минимум одну смесь Blaser из каталога
      - Словарь нот: шоколад, фрукт, орех, цветы, карамель

      '
    title_ka: Blaser ყავა - გემოს დიაპაზონი
    content_ka: '- როგორ ავხსნათ განსხვავება რბილ და ნათელ შემწვარს შორის - დაასახელეთ და აღწერეთ მინიმუმ ერთი Blaser ნაზავი
      კატალოგიდან - არომატის ნოტების ლექსიკა: შოკოლადი, ხილი, თხილი, ყვავილოვანი, კარამელი'
  - order: 10
    title: Goods receiving and display
    title_ru: Приёмка товара и выкладка
    content: '- What to check when receiving a delivery (quantity, expiry, condition) - FIFO shelf display: new stock behind
      older stock - Price tag rules: every product must have a price tag, verified against Shop Seller - What to do if a price
      tag is missing

      '
    content_ru: '- Что проверять при приёмке (количество, срок, состояние) - Выкладка FIFO: новая партия за старой - Ценники:
      у каждого товара есть ценник, сверка с Shop Seller - Что делать, если ценника нет

      '
    title_ka: საქონლის მიღება და ჩვენება
    content_ka: '- რა უნდა შეამოწმოთ მიწოდების მიღებისას (რაოდენობა, ვადა, მდგომარეობა) - FIFO თაროზე ჩვენება: ახალი მარაგი
      ძველი მარაგის მიღმა - ფასის წესები: ყველა პროდუქტს უნდა ჰქონდეს ფასი, დამოწმებული მაღაზიის გამყიდველთან - რა უნდა გააკეთოს,
      თუ ფასის ნიშანი აკლია'
  title_ka: თვე 1 — დამოუკიდებელი მუშაობა
  description_ka: ყველა წინა ცოდნის კონსოლიდაცია. დამოუკიდებელი საკონტრაქტო სამუშაოები, მაღაზიის გამყიდველის ოპერაციები, ინვენტარი,
    ფასდაკლებები, კომპანიის სტრუქტურა.
- slug: month-2
  title: Month 2 — Equipment Expertise
  title_en: Month 2 — Equipment Expertise
  title_ru: Месяц 2 — Экспертиза по оборудованию
  order: 7
  estimated_minutes: 3600
  description: 'Deep knowledge of coffee equipment: machines, grinders, brands, professional vs. home machines. Team work
    and reporting.

    '
  description_en: 'Deep knowledge of coffee equipment: machines, grinders, brands, professional vs. home machines. Team work
    and reporting.

    '
  description_ru: 'Глубокие знания кофейного оборудования: машины, кофемолки, бренды, профессиональное и домашнее оборудование.
    Работа в команде и отчётность.

    '
  steps:
  - order: 1
    title: Coffee equipment classification
    title_ru: Классификация кофейного оборудования
    content: '- Home (consumer) vs. professional (commercial) machines - Manual (pump) vs. automatic (bean-to-cup) vs. capsule
      - Key components: boiler, group head, pump, grinder (built-in or separate)

      '
    content_ru: '- Домашние (бытовые) vs профессиональные (коммерческие) машины - Ручные (рожковые) vs автоматические (зерно
      в чашку) vs капсульные - Ключевые узлы: бойлер, группа, помпа, кофемолка (встроенная или отдельная)

      '
    title_ka: ყავის მოწყობილობების კლასიფიკაცია
    content_ka: '- სახლის (სამომხმარებლო) პროფესიონალური (კომერციული) მანქანების წინააღმდეგ - მექანიკური (ტუმბო) ავტომატური
      (ლობიო-ჭიქა) წინააღმდეგ კაფსულა - ძირითადი კომპონენტები: ქვაბი, ჯგუფის თავი, ტუმბო, საფქვავი (ჩაშენებული ან ცალკე)'
  - order: 2
    title: Main components of a coffee machine
    title_ru: Основные узлы кофемашины
    content: '- Boiler types: single / dual / thermoblock - Group head (рабочая группа): what it does - Pump: role in pressure
      (9 bar standard) - Pressure gauge (барометр): how to read it - Optimal brewing temperature: 88–92°C - Siphon system:
      what it is and when it''s used

      '
    content_ru: '- Типы бойлеров: одинарный / двойной / термоблок - Группа (рабочая группа): для чего нужна - Помпа: роль
      в давлении (стандарт 9 бар) - Манометр (барометр): как читать показания - Оптимальная температура заваривания: 88–92°C
      - Система сифона: что это и когда применяется

      '
    title_ka: ყავის აპარატის ძირითადი კომპონენტები
