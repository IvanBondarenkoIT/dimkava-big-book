  title_ru: Регламент по ведению ежедневного отчёта по продажам
  content_ru: "**Регламент по ведению ежедневного отчёта по продажам\n\nМенеджерами\
    \ торговых точек (City Mall, East Point, BatumiMall)\n\n1. Общие положения\n •\
    \ Таблица ежедневных продаж рассчитана на корректный учёт выполнения плана по\
    \ половине рабочего дня (6 часов из 12).\n • Внесение итоговых данных за 12 часов\
    \ (вал за день, всего чашек за день, всего кг кофе за день) считается нарушением\
    \ правил.\n • Все сотрудники обязаны заполнять таблицу строго по установленным\
    \ периодам.\n**\n⸻\n**\n2. Порядок заполнения таблицы\n** 1. **Промежутки для\
    \ заполнения:\n • с 10:00 до 16:00 – первая половина дня (Х-отчёт в 16:00).\n\
    \ • с 16:00 до 22:00 – вторая половина дня (Х-отчёт в 22:00).\n** 2. **Если сотрудник\
    \ работает полный день:\n • Он заполняет две таблицы:\n • за период 10:00–16:00\
    \ (вносит в свою таблицу);\n • за период 16:00–22:00 (вносит данные в таблицу\
    \ коллеги).\n** 3. **Идентификация сотрудника:\n • Обязательно выбирать своё имя\
    \ во всех заполняемых таблицах.\n**\n⸻\n**\n3. Подтверждающие материалы\n\nК каждой\
    \ таблице ежедневно прикрепляются:\n • фото данных из Shop-Seller:\n • сумма денег;\n\
    \ • итого продано (чашки и кофе);\n • фото Z-отчётов:\n • по банкам;\n • по терминалу.\n\
    **\n⸻\n**\n4. Выполнение планов\n • План выполнения считается по 6 часов, а не\
    \ по 12 ч\n • Корректность анализа достигается только при точном внесении данных\
    \ в указанные промежутки.\n**\n⸻\n**\n5. Ответственность\n • Незаполненные дни\
    \ или некорректно внесённые данные приводят к искажению итогов, что автоматически\
    \ считается нарушением.\n • Сотрудники обеспечивают правильность и своевременность\
    \ заполнения отчётных таблиц.**"
  title_ka: ყოველდღიური გაყიდვების ანგარიშის წარმოების რეგლამენტი**
  content_ka: '**📍 ყოველდღიური გაყიდვების ანგარიშის წარმოების რეგლამენტი**


    **სავაჭრო ობიექტების მენეჯერებისთვის (City Mall, East Point, Batumi Mall)**


    ⸻


    **1. ზოგადი დებულებები**


    ყოველდღიური გაყიდვების ცხრილი განკუთვნილია გეგმის შესრულების სწორი აღრიცხვისთვის
    სამუშაო დღის ნახევარზე (12 საათიდან 6 საათი).

    დღის სრული 12-საათიანი შედეგების შეყვანა (დღიური ბრუნვა, ჭიქების საერთო რაოდენობა,
    ყავის საერთო კილოგრამები) ითვლება წესის დარღვევად.

    ყველა თანამშრომელი ვალდებულია შეავსოს ცხრილი მკაცრად განსაზღვრული პერიოდების მიხედვით.


    ⸻


    **2. ცხრილის შევსების წესი**


    **1. დროის მონაკვეთები:**


    10:00 – 16:00 → დღის პირველი ნახევარი (X-ანგარიში 16:00-ზე)

    16:00 – 22:00 → დღის მეორე ნახევარი (X-ანგარიში 22:00-ზე)


    **2. თუ თანამშრომელი მუშაობს სრულ დღეს:**


    ავსებს ორ ცხრილს:

    10:00–16:00 პერიოდი (შეაქვს საკუთარ ცხრილში)

    16:00–22:00 პერიოდი (შეაქვს კოლეგის ცხრილში)


    **3. თანამშრომლის იდენტიფიკაცია:**


    ყველა შევსებულ ცხრილში აუცილებლად უნდა იყოს მითითებული თანამშრომლის სახელი.


    ⸻


    **3. დამადასტურებელი მასალები**


    ყოველდღიურად თითოეულ ცხრილს უნდა დაემატოს:


    **Shop-Seller-ის მონაცემების ფოტო:**

    თანხის ჯამი

    გაყიდვების საერთო რაოდენობა (ჭიქები და ყავა)

    **Z-ანგარიშების ფოტო:**

    ბანკების მიხედვით

    ტერმინალის მიხედვით


    ⸻


    **4. გეგმის შესრულება**


    გეგმა ითვლება 6 საათის მიხედვით და არა 12 საათის მიხედვით.

    ანალიზის სიზუსტე მიიღწევა მხოლოდ მონაცემების სწორად და დროის მიხედვით შეყვანის
    შემთხვევაში.


    ⸻


    **5. პასუხისმგებლობა**


    დაუვსებელი დღეები ან არასწორად შეყვანილი მონაცემები იწვევს შედეგების დამახინჯებას
    და ავტომატურად ითვლება დარღვევად.

    თანამშრომლები ვალდებულნი არიან უზრუნველყონ ანგარიშების სწორად და დროულად შევსება.'
  title_en: Regulations for Maintaining the Daily Sales Report
  content_en: "**Regulations for Maintaining the Daily Sales Report\n\nFor retail\
    \ location managers (City Mall, East Point, BatumiMall)\n\n1. General Provisions\n\
    \ • The daily sales table is designed for accurate tracking of plan fulfillment\
    \ for half a workday (6 hours out of 12).\n • Entering total data for 12 hours\
    \ (daily turnover, total cups for the day, total kg of coffee for the day) is\
    \ considered a violation of the rules.\n • All employees must fill in the table\
    \ strictly according to the established periods.\n**\n⸻\n**\n2. Table Completion\
    \ Procedure\n** 1. **Time slots for completion:\n • 10:00 to 16:00 — first half\
    \ of the day (X-report at 16:00).\n • 16:00 to 22:00 — second half of the day\
    \ (X-report at 22:00).\n** 2. **If an employee works a full day:\n • They fill\
    \ in two tables:\n • for the period 10:00–16:00 (enter in their own table);\n\
    \ • for the period 16:00–22:00 (enter data in a colleague's table).\n** 3. **Employee\
    \ identification:\n • You must select your name in all completed tables.\n**\n\
    ⸻\n**\n3. Supporting Materials\n\nThe following are attached to each table daily:\n\
    \ • photos of data from Shop-Seller:\n • money amount;\n • total sold (cups and\
    \ coffee);\n • photos of Z-reports:\n • by banks;\n • by terminal.\n**\n⸻\n**\n\
    4. Plan Fulfillment\n • Plan fulfillment is calculated over 6 hours, not 12 h\n\
    \ • Accurate analysis is achieved only with precise data entry in the specified\
    \ time slots.\n**\n⸻\n**\n5. Responsibility\n • Unfilled days or incorrectly entered\
    \ data lead to distorted totals, which is automatically considered a violation.\n\
    \ • Employees ensure accuracy and timely completion of reporting tables.**"
