- slug: reg-31195
  section: regulations
  status: published
  title_ru: Регламент по доставке товара!!!
  content_ru: "\U0001F4CDРегламент по доставке товара!!!\nЛогист , по накладной с\
    \ офиса ( Регина) из гранита, собирает товар на складе и только после внесения\
    \ транспортной накладной в RSG , (выписанной Лидой или Тамуной) может выезжать\
    \ по адресу доставки( или для клиентов офиса или на наши торговые точки) Товар\
    \ должен быт проверен по количеству , по целостности коробок ( не битых и не испорченных)\
    \ посуда - целая( не битая), сроки годности товара -хорошие .\nДоставка товара\
    \ на любые объекты - только строго по накладной( частным клиентам с выпиской в\
    \ RSG) на торговые точки Dom Kava - с 2 внутренними накладными, 1 остается у сотрудников\
    \ для сверки, 2 забирает с собой с подписью сотрудника, который принимал товар(\
    \ что он взял на себя ответственность за полученный товар)\nЕсли товар логист\
    \ привез без накладной - сотрудник вправе не принимать товар.\n\n\U0001F4CDштраф\
    \ 20 лари за доставку товара без внутренней накладной)\n\n\U0001F4CDШтраф от государства\
    \ оплачивает сотрудник , который выехал с товаром без транспортной накладной!!!(500\
    \ лари)\n/////\n\U0001F4CDТовар - отправляемый службой доставки , тоже в \nобязательном\
    \ порядке вносим в RSG!!!"
  title_ka: საქონლის მიწოდების რეგლამენტი**
  content_ka: '**📍 საქონლის მიწოდების რეგლამენტი**


    ლოგისტი, ოფისიდან (რეგინასგან) მიღებული ზედნადების საფუძველზე, საწყობში აგროვებს
    საქონელს და მხოლოდ ამის შემდეგ, როდესაც სატრანსპორტო ზედნადები იქნება შეტანილი
    RSG-ში (გამოწერილი ლიდას ან თამუნას მიერ), აქვს უფლება გავიდეს მიწოდების მისამართზე
    (როგორც ოფისის კლიენტებთან, ასევე ჩვენს სავაჭრო ობიექტებზე).


    საქონელი უნდა შემოწმდეს:


    რაოდენობის მიხედვით

    ყუთების მთლიანობის მიხედვით (არ უნდა იყოს დაზიანებული ან გაფუჭებული)

    ჭურჭელი უნდა იყოს მთლიანი (არ დამტვრეული)

    ვადის გასვლის თარიღები უნდა იყოს ვალიდური


    საქონლის მიწოდება ნებისმიერ ობიექტზე ხორციელდება მხოლოდ ზედნადების მიხედვით:


    კერძო კლიენტებისთვის — RSG-ში გატარებული ზედნადებით

    სავაჭრო ობიექტებზე (Dom Kava) — 2 შიდა ზედნადებით:

    ერთი რჩება თანამშრომელთან გადამოწმებისთვის

    მეორე მიაქვს ლოგისტს, თანამშრომლის ხელმოწერით (რომელმაც მიიღო საქონელი და აიღო
    პასუხისმგებლობა)


    თუ ლოგისტმა მოიტანა საქონელი ზედნადების გარეშე — თანამშრომელს აქვს უფლება არ მიიღოს
    საქონელი.


    📍 ჯარიმა — 20 ლარი, თუ საქონელი მოწოდებულია შიდა ზედნადების გარეშე


    📍 სახელმწიფო ჯარიმას (500 ლარი) იხდის ის თანამშრომელი, ვინც გავიდა საქონლით სატრანსპორტო
    ზედნადების გარეშე


    📍 საქონელი, რომელიც იგზავნება საკურიერო სერვისით, ასევე სავალდებულოა შეტანილი
    იყოს RSG- ში.'
  title_en: Goods Delivery Regulations!!!
  content_en: '📍Goods Delivery Regulations!!!

    The logistics driver, based on the delivery note from the office (Regina) from
    Granit, collects goods at the warehouse and only after entering the transport
    delivery note in RSG (issued by Lida or Tamuna) may depart for the delivery address
    (either for office clients or to our retail locations). Goods must be checked
    for quantity, box integrity (not broken or damaged), dishes — intact (not broken),
    product expiration dates — good.

    Delivery of goods to any location — strictly according to the delivery note (for
    private clients with an entry in RSG); to Dom Kava retail locations — with 2 internal
    delivery notes: 1 remains with employees for reconciliation, 2 is taken by the
    driver with the signature of the employee who accepted the goods (confirming that
    they took responsibility for the received goods)

    If the logistics driver delivers goods without a delivery note — the employee
    has the right not to accept the goods.


    📍Fine of 20 lari for delivering goods without an internal delivery note)


    📍The fine from the government is paid by the employee who departed with goods
    without a transport delivery note!!!(500 lari)

    /////

    📍Goods sent by delivery service must also be entered in RSG!!!'
  source_ru_id: 31195
  source_ka_id: 31309
  match_method: reply
  match_confidence: 1.0
