  title_en: Regulations for Shutting Down Granit Program!
  content_en: 'Regulations for Shutting Down Granit Program!

    If Shop Seller is not working, record all sales (write them down) on paper, or
    on processed receipts, and at the end of the day — send all Z-reports and receipts
    or the paper report to the Telegram channel — inventory and accounting system
    with a note — that the program was not working!! This is very important for further
    work and quality inventory! And all data must be in English!'
