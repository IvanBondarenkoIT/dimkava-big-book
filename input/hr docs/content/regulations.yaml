  title_ru: Правила выдачи товара клиенту или другому лицу
  content_ru: "**\U0001F4E6 Правила выдачи товара клиенту или другому лицу\n\n1. Выявление\
    \ потребности клиента\n • Вежливо уточняем, что именно нужно покупателю.\n • При\
    \ необходимости помогаем подобрать товар.\n\n2. Прием заказа\n • Заказ фиксируется\
    \ в Shop-Seller.\n • Сотрудник обязан знать ассортимент и цены.\n • На всём товаре\
    \ должны быть актуальные и правильные ценники.\n\n3. Прием оплаты\n • Деньги принимаются\
    \ наличными или через банковский терминал.\n • При оплате через терминал обязательно\
    \ проверяем в окне терминала, что средства зачислены на счёт.\n • После оплаты\
    \ закрываем проводку в Shop-Seller.\n\n4. Выдача товара\n • Товар выдаётся клиенту\
    \ только вместе с кассовым чеком.\n\n5. Запрещено!\n • ❌ Товар с торговой точки\
    \ без оплаты, без чека терминала или без выписки RSG – не выдаётся!\n • ❌ Отдавать\
    \ товар без оплаты или без накладной на перемещение категорически запрещается.\n\
    \n6. Ответственность сотрудника\n • Каждый сотрудник в смене несёт полную ответственность\
    \ за кассу и товар на торговой точке.\n • Товар может быть выдан другому лицу\
    \ (логисту, директору, менеджеру и др.) только по накладной, оформленной бухгалтерией.\n\
    \ • При перемещении товара на другую торговую точку наличие накладной обязательно.\n\
    \ • Если сотрудник выдал товар без оплаты или без накладной – он считается недостачей,\
    \ и сотрудник обязан возместить стоимость.\n**\n⸻\n**\n⚠️ Данные правила обязательны\
    \ для всех сотрудников компании Dim Kava Georgia.**"
  title_ka: საქონლის გაცემის წესები მომხმარებლებისთვის მაღაზიაში
  content_ka: "‼️ საქონლის გაცემის წესები მომხმარებლებისთვის მაღაზიაში\n\n1. მომხმარებლების\
    \ საჭიროების განსაზღვრა\nდააზუსტეთ, რა სჭირდება მომხმარებელს, და შესთავაზეთ შესაბამისი\
    \ პროდუქტი.\n2. შეკვეთის შეყვანა ShopSeller ის პროგრამაში\n • აუცილებელია საქონლის\
    \ ასორტიმენტის და ფასების ცოდნა.\n • ყველა საქონელს უნდა ჰქონდეს სწორად მითითებული\
    \ ფასი, რომელიც შეესაბამება ShopSeller ის პროგრამაში არსებულ ფასს!\n3. გადახდის\
    \ განხორციელება\n • გადახდა ხდება ნაღდი ფულით ან ბარათით ,ტერმინალის საშუალებით.\n\
    \ • გადახდის შემდეგ აუცილებლად უნდა შევიყვანოთ გაყიდვა ShopSeller ის პროგრამაში\
    \ და შემდეგ დავიწყოთ შეკვეთის დამზადება.\n4. საქონლის და ქვითრის გაცემა\nსაქონელი\
    \ გაიცემა მხოლოდ გადახდისა და დადასტურებული ქვითრის საფუძველზე.\n5. ‼️ მნიშვნელოვანია:\n\
    საქონელი არ გაიცემა სავაჭრო ობიექტიდან ნაღდი ფულის გარეშე, ტერმინალის დადასტურებული\
    \ ქვითრის გარეშე ან RSG-ის ქვითრის გარეშე!\nეს რეგლამენტი ვრცელდება ყველა გაყიდვის\
    \ განხორციელების შემთხვევაში! გამონაკლისები შესაძლებელია მხოლოდ Dim Kava Georgia-ს\
    \ დირექტორის ნებართვით.\n\n‼️ თანამშრომელი, რომელიც გასცემს საქონელს Dim Kava\
    \ Georgia-ს სავაჭრო ობიექტიდან ანგარიშსწორების  გარეშე, სრულად აგებს პასუხისმგებლობას\
    \ და კომპანიის ზარალს ანაზღაურებს სრულად."
  title_en: Rules for Issuing Goods to a Customer or Another Person
  content_en: "**\U0001F4E6 Rules for Issuing Goods to a Customer or Another Person\n\
    \n1. Identifying Customer Needs\n • Politely clarify what the customer needs.\n\
    \ • If necessary, help select the product.\n\n2. Order Processing\n • The order\
    \ is recorded in Shop-Seller.\n • The employee must know the product range and\
    \ prices.\n • All products must have current and correct price tags.\n\n3. Payment\
    \ Processing\n • Payment is accepted in cash or via bank terminal.\n • When paying\
    \ via terminal, always verify in the terminal window that funds have been credited\
    \ to the account.\n • After payment, close the transaction in Shop-Seller.\n\n\
    4. Issuing Goods\n • Goods are issued to the customer only together with a receipt.\n\
    \n5. Prohibited!\n • ❌ Goods from a retail location without payment, without a\
    \ terminal receipt or without an RSG entry — are not issued!\n • ❌ Issuing goods\
    \ without payment or without a transfer delivery note is strictly prohibited.\n\
    \n6. Employee Responsibility\n • Each employee on shift bears full responsibility\
    \ for the cash register and goods at the retail location.\n • Goods may be issued\
    \ to another person (logistics driver, director, manager, etc.) only with a delivery\
    \ note issued by accounting.\n • When transferring goods to another retail location,\
    \ a delivery note is mandatory.\n • If an employee issued goods without payment\
    \ or without a delivery note — it is considered a shortage, and the employee must\
    \ reimburse the cost.\n**\n⸻\n**\n⚠️ These rules are mandatory for all Dim Kava\
    \ Georgia employees.**"
