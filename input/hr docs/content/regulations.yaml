  title_ru: Регламент по накладным/инвойсам для клиентов**
  content_ru: '**Регламент по накладным/инвойсам для клиентов**


    Налоговая накладная (инвойс) — это документ, который выдается при налогооблагаемой
    поставке товаров и услуг. Налоговый инвойс содержит такую информацию, как количество
    приобретённого товара и стоимость товара/услуги. Наличие этого документа необходимо
    для того, чтобы в налоговой системе отражались приобретённая продукция и/или задолженность
    клиента.


    Поэтому сотрудник Dim Kava после продажи товара должен запросить у клиента следующие
    данные:


    Название компании

    Идентификационный код компании

    Номер телефона

    Наименование продукции и её стоимость


    Эти данные необходимо отправить в чат продаж Dim Kava, чтобы бухгалтер мог оформить
    накладную и загрузить её в систему RSG.


    Данный регламент обязателен для тех компаний и клиентов, которые запрашивают налоговый
    инвойс и оплачивают товар банковским переводом.


    Если у вас возникнут вопросы, пожалуйста, обратитесь к вашему менеджеру. Мы надеемся,
    что это простое и важное требование будет строго соблюдаться и не приведёт к нарушению
    вышеуказанных правил.


    Нарушение данного регламента будет считаться дисциплинарным проступком:


    Первое нарушение — предупреждение

    Второе нарушение — штраф 20 лари'
  title_ka: ზედნადების/ინვოისის რეგლამენტი მომხმარებლებისთვის!
  content_ka: "ზედნადების/ინვოისის რეგლამენტი მომხმარებლებისთვის!\nსაგადასახადო ზედნადები\
    \ არის ანგარიშ ფაქტურა, რომელიც გაიცემა საქონლისა და მომსახურების დასაბეგრი მიწოდებისთვის.\
    \ საგადასახადო ინვოისი მთლიანობაში შეიცავს ისეთ ინფორმაციას, როგორიცაა შეძენელი\
    \ საქონლის  რაოდენობა, საქონლის/მომსახურების ღირებულება. აუცილებელია გვქონდეს\
    \ ეს დოკუმენტი რათა საშემოსავლოში ჩანდეს მომხმარებლის მიერ შეძენილი პროდუქცია/დავალიანება.\
    \ ამიტომ, Dim Kava- ს თანამშრომელმა უნდა გამაოართვას  მომხმარებელს შეძენილი პროდუქციის\
    \ მერე შემდეგი მონაცემები: \n1. კომპანიის სახელი.\n2. კომპანიის კოდი. \n3. ტელეფონის\
    \ ნომერი.\n4. პროდუქცია და  პროდუქციის ფასი, რომელიც შეიძინა. \n და გააგზავნეთ\
    \ ეს მონაცემები Dim Kava - ს გაყიდვების ჩათში რათა გამოწეროს ბუღალტერმა ზედნადები\
    \  RSG- ში ასატვირთათ. \nეს რეგულაცია საჭიროა იმ კომპანიებისა და მომხმარებლებისთვის,\
    \ რომლებიც ითხოვენ საგადასახადო ინვოისს და რომლებიც იხდიან საქონელს გადმორიცხვის\
    \ საშუალებით.\nთუ თქვენ გაქვთ რაიმე შეკითხვები, გთხოვთ დაუკავშირდეთ თქვენს მენეჯერს.\
    \ ვიმედოვნებთ, რომ ეს მარტივი და მნიშვნელოვანი ქმედება მკაცრად განხორციელდება\
    \ და არ გამოიწვევს ზემოაღნიშნული წესის დარღვევას. \n\nამ რეგლამენტის შეუსრულებლობა\
    \ ჩაითვლება დარღვევად - \nპირველი შემთხვევა - გაფრთხილება! \nმეორე შემთხვევა -\
    \  20 ლარი."
  title_en: Regulations on Delivery Notes/Invoices for Customers**
  content_en: '**Regulations on Delivery Notes/Invoices for Customers**


    A tax invoice is a document issued for taxable supply of goods and services. The
    tax invoice contains information such as the quantity of goods purchased and the
    cost of the goods/service. This document is necessary so that the tax system reflects
    the purchased products and/or the customer''s debt.


    Therefore, after selling goods, a Dim Kava employee must request the following
    information from the customer:


    Company name

    Company identification code

    Phone number

    Product name and cost


    This information must be sent to the Dim Kava sales chat so that accounting can
    issue the delivery note and upload it to the RSG system.


    These regulations are mandatory for companies and customers who request a tax
    invoice and pay for goods by bank transfer.


    If you have any questions, please contact your manager. We hope this simple and
    important requirement will be strictly followed and will not lead to violation
    of the above rules.


    Violation of these regulations will be considered a disciplinary offense:


    First violation — warning

    Second violation — fine of 20 lari'
