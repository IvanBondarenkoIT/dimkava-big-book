  title_en: Регламент при неисправности терминала в компании Dim Kava Georgia**
  content_en: "**Регламент при неисправности терминала в компании Dim Kava Georgia**\n\
    \n**1. Общие положения**\n\n1.1. Настоящий регламент устанавливает порядок действий\
    \ менеджера и сотрудников торговой точки при выявлении неисправности банковского\
    \ терминала.\n1.2. Цель — обеспечение бесперебойной работы торговой точки, минимизация\
    \ сбоев в обслуживании клиентов и сохранение лояльности покупателей.\n\n**2. Первичные\
    \ действия менеджера**\n\nПри выявлении проблемы (терминал не включается, не проводит\
    \ оплату, зависает, выдает ошибку):\n • Проверить **подключение к электропитанию**\
    \ и целостность кабеля;\n • Проверить наличие **интернет-соединения**;\n • Перезагрузить\
    \ терминал (выключение и повторное включение);\n • Попробовать провести тестовую\
    \ операцию на минимальную сумму.\n\n**3. Если проблема сохраняется**\n\n3.1. Менеджер\
    \ обязан:\n • Уведомить сотрудника торговой точки о временной невозможности оплаты\
    \ по карте;\n • Немедленно сообщить о неисправности в:\n • **Службу поддержки\
    \ банка** (телефон горячей линии указан \U0001F447 );\n • **Старшему менеджеру\
    \ /менеджеру** по персоналу.\n\n3.2. При звонке в банк необходимо сообщить:\n\
    \ • номер терминала (указан на любом чеке этого терминала );\n • торговую точку\
    \ и адрес;\n • описание проблемы и предпринятые действия (перезагрузка, проверка\
    \ сети).\n\n**4. Действия в период неисправности**\n\n4.1. Прием оплаты:\n • Предложить\
    \ клиенту **наличный расчет (если данный терминал работает)**; \n • Предложить\
    \ перевод по расчетному номеру компании (расчетный номер компании указан ниже\
    \ \U0001F447);\n    • Если клиент отказывается переводить деньги и хочет оплатить\
    \ наличными (без чека мы не можем выдать продукт) то просим выбить чек у другой\
    \ торговой точки ,сфоткать чек и выслать клиенту.\n • Уточнить возможность проведения\
    \ оплаты через другой терминал (если на точке их несколько).\n\n4.2. В случае\
    \ невозможности проведения операции:\n • Извиниться перед клиентом и объяснить\
    \ ситуацию;\n • При необходимости оформить **резервирование заказа** до восстановления\
    \ работы терминала.\n\n**5. Восстановление работы**\n • После устранения неисправности\
    \ менеджер обязан проверить корректность работы терминала (тестовый платеж/отмена\
    \ тестовой операции);\n • Сообщить сотруднику точки, что терминал работает в штатном\
    \ режиме;\n • Зафиксировать инцидент в **журнале неисправностей** (дата, время,\
    \ суть поломки, предпринятые действия, контакт с банком).\n\n**6. Ответственность**\n\
    \ • Менеджер торговой точки отвечает за своевременное уведомление банка и руководства.\n\
    \ • Несвоевременное информирование или игнорирование неисправности считается нарушением\
    \ регламента.\n\nГорячая линия банка : \nBOG - 0322 44 44 44\nTBC -  0322 27 27\
    \ 27\n\nНомер счета компании: \n\nGE35TB7223436020100002\nGE48BG0000000010697300\n\
    მიმღები შ.პ.ს. \"ყავის სახლი\""
