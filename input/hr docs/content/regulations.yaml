  title_en: ზედნადების/ინვოისის რეგლამენტი მომხმარებლებისთვის!
  content_en: "ზედნადების/ინვოისის რეგლამენტი მომხმარებლებისთვის!\nსაგადასახადო ზედნადები\
    \ არის ანგარიშ ფაქტურა, რომელიც გაიცემა საქონლისა და მომსახურების დასაბეგრი მიწოდებისთვის.\
    \ საგადასახადო ინვოისი მთლიანობაში შეიცავს ისეთ ინფორმაციას, როგორიცაა შეძენელი\
    \ საქონლის  რაოდენობა, საქონლის/მომსახურების ღირებულება. აუცილებელია გვქონდეს\
    \ ეს დოკუმენტი რათა საშემოსავლოში ჩანდეს მომხმარებლის მიერ შეძენილი პროდუქცია/დავალიანება.\
    \ ამიტომ, Dim Kava- ს თანამშრომელმა უნდა გამაოართვას  მომხმარებელს შეძენილი პროდუქციის\
    \ მერე შემდეგი მონაცემები: \n1. კომპანიის სახელი.\n2. კომპანიის კოდი. \n3. ტელეფონის\
    \ ნომერი.\n4. პროდუქცია და  პროდუქციის ფასი, რომელიც შეიძინა. \n და გააგზავნეთ\
    \ ეს მონაცემები Dim Kava - ს გაყიდვების ჩათში რათა გამოწეროს ბუღალტერმა ზედნადები\
    \  RSG- ში ასატვირთათ. \nეს რეგულაცია საჭიროა იმ კომპანიებისა და მომხმარებლებისთვის,\
    \ რომლებიც ითხოვენ საგადასახადო ინვოისს და რომლებიც იხდიან საქონელს გადმორიცხვის\
    \ საშუალებით.\nთუ თქვენ გაქვთ რაიმე შეკითხვები, გთხოვთ დაუკავშირდეთ თქვენს მენეჯერს.\
    \ ვიმედოვნებთ, რომ ეს მარტივი და მნიშვნელოვანი ქმედება მკაცრად განხორციელდება\
    \ და არ გამოიწვევს ზემოაღნიშნული წესის დარღვევას. \n\nამ რეგლამენტის შეუსრულებლობა\
    \ ჩაითვლება დარღვევად - \nპირველი შემთხვევა - გაფრთხილება! \nმეორე შემთხვევა -\
    \  20 ლარი."
