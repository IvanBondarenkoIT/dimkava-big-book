  title_ru: Регламент и Обязанности менеджера на торговой точке Dim Kava Georgia**
  content_ru: '**Регламент и Обязанности менеджера на торговой точке Dim Kava Georgia**


    **  Наличие ценников: **Каждый товар на витрине должен иметь ценник.

    **  Информация на ценнике: **На ценнике должны быть указаны наименование товара,
    цена за единицу.

    **  Единообразие и четкость: **Ценники должны быть оформлены четко, разборчиво
    и в едином стиле для всех товаров одной группы. 

    **  Соответствие цены: **Цена на ценнике должна точно совпадать с ценой, пробиваемой
    на кассе. 

    **  Доступность: **Ценник должен быть легко читаем и расположен непосредственно
    у товара. 

    **  Указание на акции/уценку: **При изменениях цены (акции, распродажи, уценки)
    необходимо зачеркнуть старую цену и указать новую. 

    **Последствия нарушений:**


    **  Публичная оферта: **Ценник — это публичное предложение товара по указанной
    цене, поэтому продавец обязан продать товар по этой цене( исключения являются
    скидки , предложенные в ходе продажи, по договоренности с офисом )

    **  Штрафы: **Неправильное оформление ценников или несоответствие цен на ценнике
    с программой «шопселер» ведет к удержанию из заработной платы.'
  title_ka: Dim Kava Georgia-ის სავაჭრო წერტილის მენეჯერის რეგლამენტი და მოვალეობები**
  content_ka: '**Dim Kava Georgia-ის სავაჭრო წერტილის მენეჯერის რეგლამენტი და მოვალეობები**


    **ფასების ეტიკეტების არსებობა:**

    ვიტრინაზე განთავსებულ თითოეულ პროდუქტს უნდა ჰქონდეს ფასმაჩვენებელი.


    **ინფორმაცია ფასმაჩვენებელზე უნდა იყოს გასაგები და გარკვევით აღქმადი მომხმარებლისთვის.**


    **ფასის შესაბამისობა:**

    ეტიკეტზე მითითებული ფასი ზუსტად უნდა ემთხვეოდეს სალაროში დაფიქსირებულ ფასს.


    **აქციებისა და ფასდაკლებების მითითება:**

    ფასის ცვლილების შემთხვევაში (აქცია, ფასდაკლება, ლიკვიდაცია) საჭიროა ძველი ფასის
    გადახაზვა და ახალი ფასის მითითება.


    **დარღვევების შედეგები:**


    ფასმაჩვენებელი წარმოადგენს პროდუქტის საჯარო შეთავაზებას მითითებულ ფასად, ამიტომ
    გამყიდველი ვალდებულია გაყიდოს პროდუქტი ამ ფასად

    (გამონაკლისს წარმოადგენს მხოლოდ გაყიდვის პროცესში შეთანხმებული ფასდაკლებები, რომლებიც
    შეთანხმებულია ოფისთან).


    **ჯარიმები:**

    ფასმაჩვენებლების არასწორი გაფორმება ან მათი შეუსაბამობა პროგრამა „shop seller“-თან
    მითითებულ ფასებთან იწვევს ხელფასიდან თანხის დაკავებას.'
  title_en: Regulations and Duties of the Manager at a Dim Kava Georgia Retail Location**
  content_en: "**Regulations and Duties of the Manager at a Dim Kava Georgia Retail\
    \ Location**\n\n**  Price tags: **Every product on display must have a price tag.\n\
    **  Price tag information: **The price tag must indicate the product name and\
    \ unit price.\n**  Uniformity and clarity: **Price tags must be clear, legible\
    \ and in a uniform style for all products in the same group. \n**  Price accuracy:\
    \ **The price on the price tag must exactly match the price processed at the register.\
    \ \n**  Accessibility: **The price tag must be easily readable and placed directly\
    \ next to the product. \n**  Promotions/markdowns: **When prices change (promotions,\
    \ sales, markdowns), cross out the old price and indicate the new one. \n**Consequences\
    \ of violations:**\n\n**  Public offer: **A price tag is a public offer of goods\
    \ at the stated price, therefore the seller is obliged to sell the product at\
    \ that price (exceptions are discounts offered during the sale, by agreement with\
    \ the office)\n**  Fines: **Incorrect price tag formatting or price mismatch between\
    \ the price tag and the Shop Seller program leads to wage deduction."
