    • მომხმარებელს აწვდის ინფორმაციას სავარაუდო მიღების თარიღს (შესყიდვების განყოფილების
    მონაცემების საფუძველზე).


    4. შემოწმება გაყიდვამდე


    4.1. გაყიდვამდე თანამშრომელმა უნდა:

    • შეამოწმოს მოდელი და სერიული ნომერი აპარატზე და ყუთზე — ისინი უნდა ემთხვეოდნენ
    ერთმანეთს !!!

    • გადაამოწმოს შეფუთვის მთლიანობა;

    • საჭიროების შემთხვევაში (მომხმარებლის თხოვნით) ფრთხილად გახსნას შეფუთვა და აჩვენოს
    კომპლექტაცია (ყავის აპარატი, სადენი, ფილტრები, სხვა აქსესუარები, ინსტრუქცია, საგარანტიო).


    4.2. შემოწმების შემდეგ აპარატი ხელახლა იფუთება ქარხნულ შეფუთვაში.


    5. დოკუმენტები და გარანტია


    5.1. თითოეულ ყავის აპარატზე უნდა გავცეთ:

    • ქვითარი;

    • საგარანტიო ბეჭედით/მაღაზიის შტამპით;

    • ინსტრუქცია.


    5.2. გაყიდვისას საგარანტიო ტალონში აუცილებლად უნდა ჩაიწეროს მოდელისა და სერიული
    ნომრის მონაცემები.


    6. პასუხისმგებლობა


    რეგლამენტის დარღვევა (აპარატების გაცემა არაორიგინალი ყუთით/სხვა აპარატის ყუთით
    ან არასწორი კომპლექტაციით, ყოველგვარი შეთანხმების გარეშე) იწვევს დისციპლინურ პასუხისმგებლობას.


    7. დამატებითი დებულებები'
