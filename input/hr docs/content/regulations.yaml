  title_en: Регламент по скидкам для сотрудников Dim Kava ( переведи пожалуйста)
  content_en: "Регламент по скидкам для сотрудников Dim Kava ( переведи пожалуйста)\n\
    \n1. 25% скидка на кофе Blasercafe не более 0,5 кг в месяц, на Caotina не более\
    \ 2 штук в месяц,  на чай Blasercafe не более 5 шт в месяц ( скидка пробивается\
    \ на карту сотрудника)\n2. На аксессуары DeLonghi скидка не постоянная, может\
    \ меняться в зависимости от закупочной цены ! Не более 15% скидка на аксессуары\
    \ не более 2 х единиц в месяц.\n3. На китайские стаканы скидка по договоренности.\n\
    4. На капсулы Cafittaly скидка может менятся в зависимости от закупки и скидок,\
    \ скидка 15% .\n5. Скидка на воду пробивается на карту сотрудника, может меняться\
    \ от закупки. \n6. Печенье и батончики пробиваются на карту сотрудника уже со\
    \ скидкой. \n\n\nСкидки могут меняться в зависимости от закупочной цены.\n\nПусть\
    \ перезапустят программу чтобы скидки обновились"
