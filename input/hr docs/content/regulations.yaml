  title_ru: РЕГЛАМЕНТ ПО ЗАПОЛНЕНИЮ КАССЫ ЗА ДЕНЬ В ПРоГРАММЕ SHOP-SELLER
  content_ru: "РЕГЛАМЕНТ ПО ЗАПОЛНЕНИЮ КАССЫ ЗА ДЕНЬ В ПРоГРАММЕ SHOP-SELLER\nДля\
    \ качественной работы \n\n\nКаждый день заполняем таблицу в программе \nShop-seller\
    \ для налаженной работы торговой точки и своевременного реагирования на не соответствия!!\n\
    В первом столбец \n\U0001F4CD- дата\nВ ПРИХОДЕ \n\U0001F4CD- первый столбец -\
    \ записываем наличные приходы денег за день( обязательно сверяем с z-отчетом и\
    \ программой Shop-seller)\n\U0001F4CD- во втором столбец записываем приход наличных\
    \ с сервисного центра( обязательно сверяем с приходом сервис рапорта и z-отчетом)\n\
    \U0001F4CD- в третьем столбец вносим безналичный приход на сервисный центр( обязательно\
    \ сверяем с приходом сервис рапорта и z-отчетом)\n\U0001F4CD- в четвертый столбец\
    \ вносим приход денежных средств на терминал TBS( обязательно сверяем с итогами\
    \ прихода безналичного расчета в программе Shop-seller и с z- отчетом!)\n\U0001F4CD\
    - в пятый столбец вносим приход денежных средств на терминал BOG ( обязательно\
    \ сверяем с итогами прихода безналичного расчета в программе Shop-seller и с z-\
    \ отчетом!)\n\U0001F4CDв столбец -КАССА на ВЕЧЕР - вносим наличные деньги - лари-\
    \ которые , сейчас , в данный момент ,на конец дня ,при закрытии рабочего дня\
    \ - есть на торговой точке( по факту! если больше или меньше - пишем как есть)\n\
    \U0001F4CD- в столбце СОТРУДНИК - вписываем имя - кто работал и был ответственный\
    \ за данный рабочий  день!\n\nВ колонке РАСХОД вносим\n\U0001F4CD- дата\n\U0001F4CD\
    -  во второй столбец вносим - сумму расхода наличных\n\U0001F4CD- в третий столбец\
    \ вносим наименование расхода- обязательные расходы -вода - сколько литров, салфетки\
    \ - какое количество, хозтовары не смешивать с производственными расходами!!!\n\
    Если расход не предвиденный - обязательно прописываем понятно для статиста !(\
    \ taxi - без пояснения для какой цели в расход не принимается!!!)\n\nВ колонку\
    \ ИНКАСАЦИЯ вносим \n\U0001F4CD- в первый столбец вносим - дату\n\U0001F4CD- во\
    \ второй столбец вносим -   Сумму расхода наличных средств \n\U0001F4CD- в третий\
    \ столбец вносим - куда или кому инкассировали сумму ( банк или офис, ответственному\
    \ лицу)\n\n\U0001F4CC в левом  нижнем углу ( КАССА НА НАЧАЛО МЕСЯЦА , в сером\
    \ квадрате) - вносится сумма наличных на конец предыдущего месяца - которая отображается\
    \ в ПРАВОМ верхнем углу в красном квадрате (КАССА) \n\nЕСЛИ суммы не совпадают\
    \ в во всем рабочем периоде ( наличные или терминал), не совпадают с программой\
    \ или z - отчетами- необходимо сообщать в обязательном порядке в телеграмм канал\
    \ shopseller , для своевременного реагирования на несоответствие !!! И вовремя\
    \ решить это не соответствие ! А также в примечании отметить факт не соответствия!\n\
    \ ЕСЛИ сотрудник не сообщил вовремя о несоответствии касс - первое удержание из\
    \ зарплаты - 10 лари, последующие месяца будет сумма удержания удваиваться!!!\
    \ \nДля качественной работы - обязательно при приеме смены с утра - пересчитывать\
    \ наличные средства и сверять с таблицей кассы, если есть несоответствия - вовремя\
    \ сообщать менеджеру по персоналу и в телеграмм shopseller !!! \nА так же если\
    \ у вас будут возникать вопросы по наличию товара на вашей торговой точке - вы\
    \ так же можете в телеграмм\nshop-seller задавать вопросы ! \nКоманда Dim Kava\
    \ заинтересована в качественной и бесперебойной работе и увеличении продаж и тем\
    \ самым увеличения заработной платы всех сотрудников!"
  title_ka: სალაროს შევსების რეგლამენტი დღის განმავლობაში პროგრამაში Shop-Seller**
  content_ka: '**📍 სალაროს შევსების რეგლამენტი დღის განმავლობაში პროგრამაში Shop-Seller**


    ხარისხიანი მუშაობისთვის



    ყოველდღიურად ავსებთ ცხრილს პროგრამაში **Shop-Seller**, რათა უზრუნველყოფილი იყოს
    სავაჭრო ობიექტის გამართული მუშაობა და შეუსაბამობებზე დროული რეაგირება.



    **პირველ სვეტში:**


    📍 თარიღი



    **შემოსავლის (მიღების) ნაწილში:**


    📍 პირველი სვეტი — ვწერთ ნაღდი ფულის დღიურ შემოსავალს

    (აუცილებლად ვადარებთ Z-ანგარიშს და პროგრამა Shop-Seller-ს)


    📍 მეორე სვეტი — ვწერთ ნაღდი ფულის შემოსავალს სერვის ცენტრიდან

    (აუცილებლად ვადარებთ სერვის რეპორტსა და Z-ანგარიშს)


    📍 მესამე სვეტი — ვწერთ უნაღდო შემოსავალს სერვის ცენტრზე

    (აუცილებლად ვადარებთ სერვის რეპორტსა და Z-ანგარიშს)


    📍 მეოთხე სვეტი — ვწერთ თანხას TBS ტერმინალზე

    (აუცილებლად ვადარებთ Shop-Seller-ში უნაღდო გადახდების ჯამს და Z-ანგარიშს)


    📍 მეხუთე სვეტი — ვწერთ თანხას BOG ტერმინალზე

    (აუცილებლად ვადარებთ Shop-Seller-ში უნაღდო გადახდების ჯამს და Z-ანგარიშს)


    📍 სვეტი „სალარო საღამოსთვის“ — ვწერთ ნაღდ ფულს (ლარში),

    რაც ფაქტობრივად არის დღის ბოლოს, სამუშაო დღის დახურვისას

    (თუ მეტი ან ნაკლებია — ვწერთ რეალურ რაოდენობას)


    📍 სვეტი „თანამშრომელი“ — ვწერთ იმ თანამშრომლის სახელს,

    ვინც იმუშავა და იყო პასუხისმგებელი ამ სამუშაო დღეზე



    **ხარჯების სვეტში:**


    📍 თარიღი

    📍 მეორე სვეტი — ნაღდი ხარჯის თანხა

    📍 მესამე სვეტი — ხარჯის დასახელება


    აუცილებელი ხარჯები:


    წყალი — ლიტრაჟის მითითებით

    ხელსახოცები — რაოდენობის მითითებით


    ⚠️ სამეურნეო ხარჯები არ უნდა იყოს შერეული წარმოების ხარჯებთან!


    თუ ხარჯი არ არის წინასწარ დაგეგმილი — აუცილებლად უნდა იყოს დეტალურად აღწერილი
    (სტატისტისთვის გასაგებად).

    მაგალითად: „ტაქსი“ — დანიშნულების გარეშე არ მიიღება!



    **ინკასაციის სვეტში:**


    📍 პირველი სვეტი — თარიღი

    📍 მეორე სვეტი — ნაღდი თანხის რაოდენობა

    📍 მესამე სვეტი — სად/ვის გადაეცა თანხა (ბანკი, ოფისი, პასუხისმგებელი პირი)



    📌 მარცხენა ქვედა კუთხეში („სალარო თვის დასაწყისში“, ნაცრისფერ ბლოკში) — შეიყვანება
    წინა თვის ბოლოს არსებული ნაღდი თანხა,

    რომელიც აისახება მარჯვენა ზედა კუთხეში („სალარო“, წითელ ბლოკში)


    თუ თანხები არ ემთხვევა სამუშაო პერიოდში (ნაღდი ან ტერმინალი),

    არ ემთხვევა პროგრამას ან Z-ანგარიშებს — აუცილებელია ამის შესახებ შეტყობინება Telegram
    არხში **shopseller**,

    რათა დროულად მოხდეს რეაგირება და პრობლემის გადაწყვეტა.

    ასევე შენიშვნებში უნდა აღინიშნოს შეუსაბამობის ფაქტი.



    თუ თანამშრომელმა დროულად არ შეატყობინა სალაროს შეუსაბამობის შესახებ:

    📍 პირველი ჯარიმა — 10 ლარი

    📍 ყოველი მომდევნო თვე — ჯარიმა ორმაგდება


    ხარისხიანი მუშაობისთვის:


    აუცილებელია დილის сменის მიღებისას ნაღდი თანხის გადათვლა და სალაროს ცხრილთან შედარება.

    თუ აღმოჩნდება შეუსაბამობა — დაუყოვნებლივ უნდა ეცნობოს პერსონალის მენეჯერს და Telegram
    არხს **shopseller**.'
  title_en: REGULATIONS FOR DAILY CASH REGISTER ENTRY IN SHOP-SELLER
  content_en: "REGULATIONS FOR DAILY CASH REGISTER ENTRY IN SHOP-SELLER\nFor quality\
    \ work \n\n\nEvery day we fill in the table in the \nShop-Seller program for smooth\
    \ operation of the retail location and timely response to discrepancies!!\nIn\
    \ the first column \n\U0001F4CD- date\nIn INCOME \n\U0001F4CD- first column —\
    \ record cash income for the day (must be reconciled with the Z-report and Shop-Seller\
    \ program)\n\U0001F4CD- in the second column record cash income from the service\
    \ center (must be reconciled with the service center report and Z-report)\n\U0001F4CD\
    - in the third column enter non-cash income for the service center (must be reconciled\
    \ with the service center report and Z-report)\n\U0001F4CD- in the fourth column\
    \ enter cash receipts on the TBS terminal (must be reconciled with non-cash payment\
    \ totals in Shop-Seller and the Z-report!)\n\U0001F4CD- in the fifth column enter\
    \ cash receipts on the BOG terminal (must be reconciled with non-cash payment\
    \ totals in Shop-Seller and the Z-report!)\n\U0001F4CDin the column — CASH AT\
    \ END OF DAY — enter cash — lari — that is currently, at this moment, at the end\
    \ of the day, when closing the workday — at the retail location (actual amount!\
    \ if more or less — write as is)\n\U0001F4CD- in the EMPLOYEE column — enter the\
    \ name of the person who worked and was responsible for that workday!\n\nIn the\
    \ EXPENSE column enter\n\U0001F4CD- date\n\U0001F4CD- in the second column enter\
    \ — cash expense amount\n\U0001F4CD- in the third column enter expense description\
    \ — mandatory expenses — water — how many liters, napkins — what quantity, household\
    \ supplies do not mix with production expenses!!!\nIf the expense is unforeseen\
    \ — you must describe it clearly for the accountant! (taxi — without explanation\
    \ of purpose is not accepted as an expense!!!)\n\nIn the COLLECTION column enter\
    \ \n\U0001F4CD- in the first column enter — date\n\U0001F4CD- in the second column\
    \ enter — cash collection amount \n\U0001F4CD- in the third column enter — where\
    \ or to whom the amount was collected (bank or office, responsible person)\n\n\
    \U0001F4CC in the lower left corner (CASH AT START OF MONTH, in the gray square)\
    \ — enter the cash amount at the end of the previous month — which is displayed\
    \ in the UPPER right corner in the red square (CASH) \n\nIF amounts do not match\
    \ throughout the entire work period (cash or terminal), do not match the program\
    \ or Z-reports — you must report this in the shopseller Telegram channel for timely\
    \ response to the discrepancy!!! And resolve the discrepancy in time! Also note\
    \ the fact of the discrepancy in the notes!\n IF an employee did not report a\
    \ cash discrepancy in time — first deduction from salary — 10 lari, in subsequent\
    \ months the deduction amount will double!!! \nFor quality work — when accepting\
    \ the morning shift — you must recount cash and reconcile with the cash table;\
    \ if there are discrepancies — report in time to the HR manager and in the shopseller\
    \ Telegram!!! \nAlso if you have questions about product availability at your\
    \ retail location — you can also ask questions in the \nshop-seller Telegram!\
    \ \nThe Dim Kava team is committed to quality, uninterrupted work and increasing\
    \ sales, and thereby increasing the wages of all employees!"
