  title_ru: Регламент по отключению программы Гранит!
  content_ru: 'Регламент по отключению программы Гранит!

    Если не работает программа шоп селер, все продажи фиксируем ( записываем) на бумаге,
    или на проведенных чеках, и в конце дня - все Z - отчеты и чеки или бумажный отчет
    отправляем в телеграмм канал - система инвентаризации и учета с примечанием -
    что не работала программа!! Это очень важно для дальнейшей работы и качественной
    инвентаризации! И все данные обязательно на Английском языке!'
  title_ka: 'გრანიტის“ პროგრამის გათიშვის რეგლამენტი:'
