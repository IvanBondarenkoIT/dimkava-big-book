  title_en: Dim Kava Georgia“-ში ყავის აპარატების გაყიდვის რეგლამენტი
  content_en: '„Dim Kava Georgia“-ში ყავის აპარატების გაყიდვის რეგლამენტი


    1. ზოგადი დებულებები


    1.1. აღნიშნული რეგლამენტი განსაზღვრავს წესებსა და პროცედურებს, რომლებიც დაკავშირებულია
    ყავის აპარატების (ყავის აპარატები, აქსესუარებისა და სხვა მოწყობილობების) რეალიზაციასთან
    „Dim Kava“-ს სავაჭრო ობიექტებში.


    1.2. რეგლამენტის მიზანია გაყიდვების სიზუსტის უზრუნველყოფა, შეცდომების თავიდან
    აცილება ყავის აპარატების კომპლექტაციასა და გაყიდვის პროცესში, ასევე მაღალი დონის
