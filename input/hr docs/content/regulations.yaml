  title_en: Правила выдачи товара клиенту в магазине
  content_en: '**‼️ Правила выдачи товара клиенту в магазине

    ** 1. **Выявление потребности клиента.

    Уточните, что именно нужно покупателю, и предложите подходящий товар.

    ** 2. **Прием заказа с внесением в ShopSeller.

          •   Обязательно знание ассортимента и стоимости товара.

          •   Наличие правильных ( соответствующих с программой ShopSeller) ценников
    на всём товаре!

    ** 3. **Прием оплаты.

          •   Деньги принимаются наличными или через терминал.

          •   После оплаты обязательно закрыть проводку в ShopSeller.

    ** 4. **Выдача товара и чека.

    Товар выдается только после полной оплаты и оформления документов.

    ** 5. **‼️ Важно:

    Товар с торговой точки без денег, без оплаты через терминал и без выписки с RSG
    — НЕ ВЫДАЁТСЯ!

    Данный регламент относится ко всем складам продаж!

    Исключения из регламента - только через **Директора Компании Dim Kava Georgia.

    ‼️Cотрудник, выдавший товар с торговой точки Dim Kava Georgia без денег , несет
    полную ответственность, и возмещает убытки компании в полном обьеме.'
