  title_ru: Регламент по продаже кофейного оборудования в компании “Dim Kava Georgia”**
  content_ru: "**Регламент по продаже кофейного оборудования в компании “Dim Kava\
    \ Georgia”**\n\n**1. Общие положения**\n\n1.1. Настоящий регламент определяет\
    \ правила и порядок реализации кофейного оборудования (кофемашин, аксессуаров)\
    \ в торговых точках «Dim Kava».\n\n1.2. Цель регламента — обеспечение корректности\
    \ продаж, исключение ошибок при комплектации и выдаче оборудования, а также поддержание\
    \ высокого уровня сервиса для клиентов.\n\n1.3. Все сотрудники обязаны строго\
    \ следовать настоящему регламенту.\n\n\n**2. Продажа оборудования**\n\n2.1. Перед\
    \ продажей сотрудник обязан:\n • уточнить у клиента модель и характеристики оборудования,\
    \ которые его интересуют;\n • проверить наличие данной модели в базе остатков\
    \ (склад, торговый зал, резерв).\n\n2.2 . Если необходимой модели **нет в наличии**\
    \ в магазине:\n • Сотрудник обязан предложить клиенту альтернативные модели с\
    \ аналогичными характеристиками и ценой.\n • Если клиент заинтересован именно\
    \ в выбранной модели, сотрудник оформляет заказ через **централизованную систему/склад**.\n\
    \n2.3. Выдача оборудования осуществляется строго в **заводской упаковке**, соответствующей\
    \ конкретной модели.\n • Коробка должна быть **новой, неповрежденной, чистой**;\n\
    \ • На коробке должны быть указаны: модель, серийный номер;\n • Коробка должна\
    \ полностью соответствовать продаваемой кофеварке (недопустима замена упаковки).\n\
    \    \n 2.4. Отсутствие коробки на данной точке (например Сити мол, там нет коробок)\n\
    \   •Кофеварку выдаем со склада (менеджер сообщает о продаже офису)\n   •Менеджер\
    \ согласовывает с клиентом о доставке оборудование на дом с нашими ценностями\
    \ ( о времени и доставке тренер договаривается с клиентом, после передачи данных\
    \ клиента)\n• Менеджер записывает данные клиента, номер телефона, адрес и передает\
    \ эти данные тренеру.\n• После ухода клиента менеджер пишет Регине о продаже кофеварки\
    \ и подарочном кофе, просит накладную о перемещении оборудования со склада на\
    \ сити мол и о подарке и проводит продажу в shop seller.\n\n**3. Действия при\
    \ \nотсутствии модели на торговой точке**\n\n3.1. Возможные варианты:\n • **Резервирование**\
    \ товара на складе и доставка в магазин (с указанием сроков клиенту);\n • **Оформление\
    \ предзаказа** и согласование даты получения;\nосуществляется путем выяснения\
    \ наличия у поставщика и сроков поставки от поставщик к нам через менеджеров -\
    \ НИНИ или САЛОМЕ\n • **Перенаправление клиента** в ближайшую торговую точку,\
    \ где данная модель есть в наличии с предварительным подтверждением по телефону\
    \ ( этот способ используем аккуратно, только в случаях, когда клиенту нужно срочно\
    \ и он согласен поехать и забрать на другой точке самостоятельно)\n\n3.2. При\
    \ отсутствии товара во всей сети и у поставщика:\n • Сотрудник фиксирует заявку\
    \ в системе;\n    •    Сотрудник записывает номер клиента и при наличии сообщает\
    \ ему\n • Информирует клиента о сроках возможного поступления (по данным отдела\
    \ закупок).\n\n**4. Проверка перед выдачей товара**\n\n4.1. Перед продажей сотрудник\
    \ обязан:\n\n • СВЕРИТЬ МОДЕЛЬ И СЕРИЙНЫЙ НОМЕР НА ОБОРУДОВАНИИ И НА КОРОБКЕ (УПАКОВКЕ)\
    \ !!!\n\n • Проверить целостность упаковки;\n • При необходимости (по просьбе\
    \ клиента) аккуратно вскрыть коробку и продемонстрировать комплектность (кофемашина,\
    \ кабель, фильтры, другие аксесуары, инструкция, гарантийный талон).\n\n4.2. После\
    \ проверки оборудование **повторно упаковывается в заводскую коробку**.\n\n**5.\
    \ Документы и гарантия**\n\n5.1. К каждой кофемашине прилагаются:\n • чек;\n •\
    \ гарантийный талон с печатью/штампом магазина;\n • инструкция.\n\n5.2. При продаже\
    \ необходимо внести данные о модели и серийном номере в гарантийный талон.\n\n\
    **6. Ответственность**\n\nНесоблюдение требований (выдача оборудования без оригинальной\
    \ коробки, неверная комплектация без согласования влечет дисциплинарную ответственность.\n\
    \n**7. Дополнительные положения**\n • Продажа оборудования «без коробки» или в\
    \ несоответствующей упаковке **строго запрещена**.\n • В исключительных случаях\
    \ (демонстрационные модели) продажа возможна только с письменного разрешения управляющего\
    \ сети и с обязательной скидкой, фиксируемой в системе.\n\n8. Отправить контактные\
    \ данные, имя, что купил и на каких условиях менеджеру Интернет магазина DimKava\
    \ !!!"
  title_ka: ყავის აპარატებზე ფასდაკლების რეგლამენტი
  content_ka: "ყავის აპარატებზე ფასდაკლების რეგლამენტი\n\nDim Kava Georgia\n\n1. ზოგადი\
    \ დებულებები\nწინამდებარე რეგლამენტი ადგენს Dim Kava Georgia-ს ქსელის თანამშრომლების\
    \ მოქმედების წესებს მომხმარებლებისთვის ყავის აპარატებზე ფასდაკლების გაცემისას.\n\
    2. ძირითადი წესები\n 1. ფასდაკლების ჩანაცვლება საჩუქრით.\nთუ მომხმარებელი ითხოვს\
    \ ფასდაკლებას, თანამშრომელი პირველ რიგში სთავაზობს ალტერნატივას — საჩუქარს (ყავა,\
    \ Caotina, აქსესუარები) ყავის აპარატის ღირებულების მაქსიმუმ 5%-ის ფარგლებში.\n\
    \n 2. ფასდაკლება შეთანხმების გარეშე.\nსავაჭრო ობიექტზე მენეჯერს შეუძლია დამოუკიდებლად\
    \ მისცეს ფასდაკლება ყავის აპარატზე 5%-მდე.\n\n 3. ფასდაკლება 5%-ზე მეტი.\nარასტანდარტულ\
    \ შემთხვევებში 5%-ზე მეტი ფასდაკლების მიცემა შესაძლებელია მხოლოდ უფროს მენეჯერთან\
    \ ან გაყიდვების განყოფილების ხელმძღვანელთან შეთანხმებით.\n\n 4. სავალდებულო თანმდევი\
    \ პროდუქციის გაყიდვა.\nყავის აპარატის ფასდაკლებით გაყიდვისას მენეჯერი ვალდებულია\
    \ შესთავაზოს და გაყიდოს თანმდევი პროდუქტები (ყავა, Caotina, აქსესუარები).\n\n\
    \ 5. მაქსიმალური საჩუქარი.\nფასდაკლების შემთხვევაში მაქსიმალურად დასაშვები საჩუქარია\
    \ 0.250 კგ ყავა (ბლენდი).\n\n 6. ფასი საიტიდან.\n • თუ მომხმარებელი მოვიდა Dim\
    \ Kava-ს ვებგვერდიდან — გაყიდვა ხორციელდება საიტზე მითითებული ფასით.\n • თუ მომხმარებელი\
    \ გვანახებს სხვა ვებგვერდს — გაყიდვა შესაძლებელია იმ ვებგვერდზე მითითებულ ფასად\
    \ მხოლოდ უფროს მენეჯერთან ან გაყიდვების განყოფილების ხელმძღვანელთან შეთანხმებით.\n\
    \ 7. ბონუსებზე გავლენა.\nფასდაკლებას აუცილებლად ექნება გავლენა თანამშრომლის ბონუსურ\
    \ ნაწილზე, რომელიც ყავის აპარატების გაყიდვაზე ეკუთვის გრაფიკის მიხედვით.\n 8.\
    \ ფასდაკლება ყავის საფქვავებსა და რძის ასაქაფებლებზე.\nმაქსიმალური დასაშვები ფასდაკლება\
    \ შეადგენს 5%-ს."
  title_en: Regulations on Selling Coffee Equipment at "Dim Kava Georgia"**
  content_en: "**Regulations on Selling Coffee Equipment at \"Dim Kava Georgia\"**\n\
    \n**1. General Provisions**\n\n1.1. These regulations define the rules and procedures\
    \ for selling coffee equipment (coffee machines, accessories) at Dim Kava retail\
    \ locations.\n\n1.2. The purpose of the regulations is to ensure correct sales,\
    \ eliminate errors in equipment assembly and issuance, and maintain a high level\
    \ of service for customers.\n\n1.3. All employees must strictly follow these regulations.\n\
    \n\n**2. Equipment Sales**\n\n2.1. Before selling, the employee must:\n • clarify\
    \ with the customer the model and specifications of the equipment they are interested\
    \ in;\n • check availability of this model in the inventory database (warehouse,\
    \ sales floor, reserve).\n\n2.2 . If the required model is **not in stock** in\
    \ the store:\n • The employee must offer the customer alternative models with\
    \ similar specifications and price.\n • If the customer is interested specifically\
    \ in the selected model, the employee places an order through the **centralized\
    \ system/warehouse**.\n\n2.3. Equipment is issued strictly in **factory packaging**\
    \ corresponding to the specific model.\n • The box must be **new, undamaged, clean**;\n\
    \ • The box must indicate: model, serial number;\n • The box must fully match\
    \ the coffee machine being sold (packaging replacement is not permitted).\n  \
    \  \n 2.4. Absence of a box at this location (for example City Mall, there are\
    \ no boxes there)\n   •We issue the coffee machine from the warehouse (the manager\
    \ notifies the office of the sale)\n   •The manager agrees with the customer on\
    \ home delivery of the equipment with our values (regarding time and delivery,\
    \ the trainer arranges with the customer after receiving the customer's details)\n\
    • The manager records the customer's details, phone number, address and passes\
    \ this information to the trainer.\n• After the customer leaves, the manager writes\
    \ to Regina about the coffee machine sale and gift coffee, requests a transfer\
    \ delivery note for equipment from the warehouse to City Mall and for the gift,\
    \ and processes the sale in Shop Seller.\n\n**3. Actions When \na Model Is Not\
    \ Available at the Retail Location**\n\n3.1. Possible options:\n • **Reserving**\
    \ goods at the warehouse and delivery to the store (with timeframe communicated\
    \ to the customer);\n • **Placing a pre-order** and agreeing on the pickup date;\n\
    carried out by checking availability with the supplier and delivery timeframes\
    \ from the supplier to us through managers — NINI or SALOME\n • **Redirecting\
    \ the customer** to the nearest retail location where this model is in stock with\
    \ prior phone confirmation (use this method carefully, only when the customer\
    \ needs it urgently and agrees to go and pick it up at another location themselves)\n\
    \n3.2. When the product is unavailable across the entire network and from the\
    \ supplier:\n • The employee records the request in the system;\n    •    The\
    \ employee records the customer's phone number and informs them if possible\n\
    \ • Informs the customer of possible arrival timeframes (based on procurement\
    \ department data).\n\n**4. Verification Before Issuing Goods**\n\n4.1. Before\
    \ selling, the employee must:\n\n • VERIFY THE MODEL AND SERIAL NUMBER ON THE\
    \ EQUIPMENT AND ON THE BOX (PACKAGING) !!!\n\n • Check packaging integrity;\n\
    \ • If necessary (at the customer's request) carefully open the box and demonstrate\
    \ completeness (coffee machine, cable, filters, other accessories, manual, warranty\
    \ card).\n\n4.2. After verification, the equipment is **repackaged in the factory\
    \ box**.\n\n**5. Documents and Warranty**\n\n5.1. Each coffee machine includes:\n\
    \ • receipt;\n • warranty card with store stamp/seal;\n • manual.\n\n5.2. When\
    \ selling, model and serial number data must be entered on the warranty card.\n\
    \n**6. Responsibility**\n\nFailure to comply with requirements (issuing equipment\
    \ without original box, incorrect assembly without approval) entails disciplinary\
    \ action.\n\n**7. Additional Provisions**\n • Sale of equipment \"without a box\"\
    \ or in mismatched packaging is **strictly prohibited**.\n • In exceptional cases\
    \ (demonstration models), sale is possible only with written permission from the\
    \ network manager and with a mandatory discount recorded in the system.\n\n8.\
    \ Send contact details, name, what was purchased and on what terms to the DimKava\
    \ online store manager!!!"
