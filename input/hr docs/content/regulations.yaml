  title_ru: Правила обучения стажеров на местах
  content_ru: 'Правила обучения стажеров на местах

    Кофе используем для тестирования, ( кофе для тестирования кофеварок и обучения
    должны заказывать заранее!) взбивать учимся на фейри !! а когда уже навыки получены
    - взбиваем на молоке - списывается на карточку акционную ( на всех точках такая
    карта есть! в примечании обязательно писать какого стажера обучали! Карту лояльности
    заводится на стажера после согласования с руководителем отдела продаж,через офис!
    Стажер дегустирует  еспрессо, что бы иметь знания вкуса кофе Blasercafe ( капучино
    только при обучении)'
  title_ka: სტაჟიორების ადგილზე შესწავლის წესები
  content_ka: 'სტაჟიორების ადგილზე შესწავლის წესები

    სასწავლო პროცესში ყავა გამოიყენება ტესტირებისთვის.

    (ყავა, რომელიც გამოიყენება ყავის აპარატების ტესტირებისა და სწავლებისთვის, წინასწარ
    უნდა იყოს შეკვეთილი!)


    რძის აქაფების სწავლა ხდება საწყის ეტაპზე ფეირის გამოყენებით.

    როდესაც სტაჟიორი უკვე იძენს საჭირო უნარებს — გადადის რძეზე მუშაობაზე.

    ამ შემთხვევაში გამოყენებული პროდუქტი იწერება აქციურ ბარათზე (ასეთი ბარათი ყველა
    ობიექტზე არის).

    შენიშვნებში აუცილებლად უნდა იყოს მითითებული, რომელი სტაჟიორი გადიოდა სწავლებას.


    ლოიალობის ბარათი სტაჟიორზე გაიცემა გაყიდვების დეპარტამენტის ხელმძღვანელთან შეთანხმების
    შემდეგ, ოფისის მეშვეობით.


    სტაჟიორი აგემოვნებს ესპრესოს, რათა ჰქონდეს ცოდნა ყავის გემოს შესახებ Blasercafe-ის
    მიხედვით.

    (კაპუჩინო მზადდება მხოლოდ სასწავლო პროცესში)'
  title_en: Rules for On-Site Trainee Training
  content_en: 'Rules for On-Site Trainee Training

    Coffee is used for testing (coffee for testing coffee machines and training must
    be ordered in advance!). We learn frothing on Fairy!! And once skills are acquired
    — we froth with milk — this is written off to the promotional card (every location
    has such a card! In the notes, you must always write which trainee was being trained!).
    The loyalty card is set up for the trainee after approval by the head of the sales
    department, through the office! The trainee tastes espresso to gain knowledge
    of Blasercafe coffee flavor (cappuccino only during training)'
