  title_en: РЕГЛАМЕНТ
  content_en: '****РЕГЛАМЕНТ


    ПО ЗАПОЛНЕНИЮ КАССЫ ЗА ДЕНЬ

    В ПРОГРАММЕ SHOP-SELLER**


    Для обеспечения качественной и бесперебойной работы торговой точки, а также своевременного
    реагирования на любые несоответствия, каждый сотрудник обязан ежедневно корректно
    и полностью заполнять таблицу кассы в программе Shop-seller.

    **

    ⸻

    **

    1. ЗАПОЛНЕНИЕ КОЛОНКИ «ПРИХОД»


    1.1. Дата

       •   В первом столбце указывается дата рабочего дня.


    1.2. Приходы


    В колонке «Приход» заполняются следующие данные:


    1️⃣ Наличные приходы за день

    — Вносим сумму фактического поступления наличных за день.

    — Обязательно сверяем с Z-отчётом и данными Shop-seller.


    2️⃣ Приход наличных с сервисного центра

    — Вносим сумму, полученную от сервисного центра.

    — Сверяем с рапортом сервисного центра и Z-отчётом.


    3️⃣ Безналичный приход на сервисный центр

    — Указываем сумму безналичных поступлений на сервисный центр.

    — Сверяем с рапортом и Z-отчётом.


    4️⃣ Приход на терминал TBS

    — Вносим сумму поступлений через терминал TBS.

    — Сверяем с итогами безналичных оплат в Shop-seller и с Z-отчётом.


    5️⃣ Приход на терминал BOG

    — Указываем сумму поступлений через терминал BOG.

    — Сверяем с итогами безнала и Z-отчётом.


    1.3. КАССА НА ВЕЧЕР


    — Вносим фактическую сумму наличных (в лари), находящихся на торговой точке на
    момент закрытия смены.

    — Если сумма больше или меньше — записываем фактическое значение, без исправлений
    и приписок.**( В примечании пишем ошибку)**


    1.4. Сотрудник


    — Указываем имя сотрудника, который работал в данный день и отвечает за кассу.

    **

    ⸻

    **

    2. ЗАПОЛНЕНИЕ КОЛОНКИ «РАСХОД»


    1️⃣ Дата

    2️⃣ Сумма расхода наличных

    3️⃣ Наименование расхода


    Требования:

       •   Обязательно указывать вид расхода:

    — вода (количество литров),

    — салфетки (количество),

    — хозтовары (не смешивать с производственными расходами).

       •   Непредвиденные расходы должны быть четко пояснены.

    Например: «такси» без объяснения цели — в расход не принимается!


    В **обязательном порядке высылаем чек на расход наличных в чат телеграмм канала
    данной торговой точки!! ( если нет чека или комментария, почему нет чека - является
    недостачей)**

    **

    ⸻

    **

    3. ЗАПОЛНЕНИЕ КОЛОНКИ «ИНКАСАЦИЯ»


    1️⃣ Дата

    2️⃣ Сумма инкассации (расход наличных)

    3️⃣ Кому или куда переданы деньги:

    — банк,

    — офис,

    — ответственное лицо.

    **

    ⸻

    **

    4. КАССА НА НАЧАЛО МЕСЯЦА


    В левом нижнем углу, в сером квадрате, указываем сумму наличных на начало месяца.

    Эта сумма должна совпадать с показанием в красном квадрате «КАССА» в правом верхнем
    углу, отображённым на конец предыдущего месяца.

    **

    ⸻

    **

    5. ОБЯЗАТЕЛЬНОЕ ИНФОРМИРОВАНИЕ О НЕСООТВЕТСТВИЯХ


    Если в течение рабочего периода выявлены несоответствия:

       •   по наличным,

       •   по терминалу,

       •   между программой Shop-seller и Z-отчетом,


    сотрудник обязан немедленно сообщить об этом в телеграм-канал shopseller, а также
    указать факт несоответствия в примечании таблицы.


    Ответственность:

       •   Первое несообщённое вовремя несоответствие — удержание 10 лари из зарплаты.

       •   Каждое последующее — сумма удержания удваивается.

    **

    ⸻

    **

    6. ПРАВИЛА ПРИЕМА СМЕНЫ (ОБЯЗАТЕЛЬНО)


    Каждый сотрудник при начале смены должен:

    ** 1. **Пересчитать наличные в кассе.

    ** 2. **Сверить с таблицей кассы.

    ** 3. При несоответствиях — **немедленно сообщить менеджеру по персоналу и в телеграм
    shopseller.


    Если сотрудник принимает смену с недостачей и не сообщает об этом — он автоматически
    берёт ответственность на себя.

    **

    ⸻

    **

    7. ВОПРОСЫ ПО ТОВАРУ


    Любые вопросы по наличию товара на точке можно задавать в телеграм-канале system.

    **

    ⸻

    **

    8. МИССИЯ КОМПАНИИ


    Команда Dim Kava заинтересована в:

       •   качественной и бесперебойной работе торговых точек,

       •   своевременном устранении ошибок,

       •   увеличении продаж,

       •   росте заработной платы сотрудников.**'
