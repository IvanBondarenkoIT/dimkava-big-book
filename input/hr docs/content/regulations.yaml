  title_ru: Правила выдачи товара клиенту в магазине
  content_ru: '**‼️ Правила выдачи товара клиенту в магазине

    ** 1. **Выявление потребности клиента.

    Уточните, что именно нужно покупателю, и предложите подходящий товар.

    ** 2. **Прием заказа с внесением в ShopSeller.

          •   Обязательно знание ассортимента и стоимости товара.

          •   Наличие правильных ( соответствующих с программой ShopSeller) ценников
    на всём товаре!

    ** 3. **Прием оплаты.

          •   Деньги принимаются наличными или через терминал.

          •   После оплаты обязательно закрыть проводку в ShopSeller.

    ** 4. **Выдача товара и чека.

    Товар выдается только после полной оплаты и оформления документов.

    ** 5. **‼️ Важно:

    Товар с торговой точки без денег, без оплаты через терминал и без выписки с RSG
    — НЕ ВЫДАЁТСЯ!

    Данный регламент относится ко всем складам продаж!

    Исключения из регламента - только через **Директора Компании Dim Kava Georgia.

    ‼️Cотрудник, выдавший товар с торговой точки Dim Kava Georgia без денег , несет
    полную ответственность, и возмещает убытки компании в полном обьеме.'
  title_ka: მაღაზიაში მომხმარებლისთვის საქონლის გაცემის წესები**
  content_ka: '**‼️ მაღაზიაში მომხმარებლისთვის საქონლის გაცემის წესები**


    ⸻


    **1. მომხმარებლის  საჭიროების განსაზღვრა**


    დააზუსტეთ, რა სჭირდება მყიდველს და შესთავაზეთ შესაბამისი პროდუქტი.


    ⸻


    **2. შეკვეთის მიღება და ShopSeller-ში გატარება**


    აუცილებელია პროდუქციის ასორტიმენტისა და ფასების ცოდნა

    ყველა პროდუქტზე უნდა იყოს სწორი (ShopSeller-ის პროგრამასთან შესაბამისი) ფასმაჩვენებლები


    ⸻


    **3. გადახდის მიღება**


    თანხა მიიღება ნაღდი ფულით ან ტერმინალის საშუალებით

    გადახდის შემდეგ აუცილებლად უნდა დაიხუროს ოპერაცია ShopSeller-ში


    ⸻


    **4. საქონლის და ჩეკის გაცემა**


    საქონელი გაიცემა მხოლოდ სრული გადახდისა და დოკუმენტაციის გაფორმების შემდეგ


    ⸻


    **5. ‼️ მნიშვნელოვანი**


    საქონელი სავაჭრო ობიექტიდან **ფულის გარეშე**, **ტერმინალით გადახდის გარეშე** და
    **RSG-დან ამოღების გარეშე** — **არ გაიცემა!**


    ეს რეგლამენტი ვრცელდება ყველა გაყიდვების ობიექტზე.


    გამონაკლისები დასაშვებია მხოლოდ **Dim Kava Georgia-ს დირექტორის თანხმობით**.


    ⸻


    ‼️ თანამშრომელი, რომელიც გასცემს საქონელს Dim Kava Georgia-ს ობიექტიდან თანხის
    გარეშე,

    იღებს სრულ პასუხისმგებლობას და ვალდებულია სრულად აანაზღაუროს კომპანიის ზარალი.'
  title_en: Rules for Issuing Goods to a Customer in the Store
  content_en: "**‼️ Rules for Issuing Goods to a Customer in the Store\n** 1. **Identifying\
    \ customer needs.\nClarify what the customer needs and offer a suitable product.\n\
    ** 2. **Order processing with entry in Shop Seller.\n      •   Must know the product\
    \ range and prices.\n      •   Correct price tags (matching the Shop Seller program)\
    \ on all products!\n** 3. **Payment processing.\n      •   Payment is accepted\
    \ in cash or via terminal.\n      •   After payment, you must close the transaction\
    \ in Shop Seller.\n** 4. **Issuing goods and receipt.\nGoods are issued only after\
    \ full payment and document processing.\n** 5. **‼️ Important:\nGoods from a retail\
    \ location without payment, without terminal payment and without an RSG entry\
    \ — ARE NOT ISSUED!\nThese regulations apply to all sales locations!\nExceptions\
    \ to the regulations — only through the **Director of Dim Kava Georgia Company.\n\
    ‼️An employee who issued goods from a Dim Kava Georgia retail location without\
    \ payment bears full responsibility and reimburses the company's losses in full."
