  title_ru: Регламент предоставления скидок на кофейное оборудование
  content_ru: "**Регламент предоставления скидок на кофейное оборудование\n\nDim Kava\
    \ Georgia\n\n1. Общие положения\n\nНастоящий регламент устанавливает порядок действий\
    \ сотрудников сети Dim Kava Georgia при предоставлении скидок на кофейное оборудование\
    \ (КО) клиентам.\n\n2. Основные правила\n** 1. **Замена скидки на подарок.\nПри\
    \ обращении клиента с просьбой о скидке сотрудник в первую очередь предлагает\
    \ альтернативу — подарок (кофе, Caotina, аксессуары) в пределах 5% от стоимости\
    \ кофеварки.\n** 2. **Скидка без согласования.\nМенеджер на торговой точке вправе\
    \ самостоятельно предоставить скидку на кофейное оборудование в размере до 5%.\n\
    ** 3. **Скидка свыше 5%.\nВ нестандартных ситуациях предоставление скидки более\
    \ 5% возможно только по согласованию со старшим менеджером или руководителем отдела\
    \ продаж.\n** 4. **Обязательная продажа сопутствующих товаров.\nПри продаже кофейного\
    \ оборудования со скидкой менеджер обязан предложить и реализовать сопутствующие\
    \ товары (кофе, Caotina, аксессуары).\n** 5. **Максимальный подарок.\nПри предоставлении\
    \ скидки максимальный допустимый подарок — 0,250 кг кофе (бленд).\n** 6. **Цена\
    \ с сайта.\n • Если клиент пришёл с сайта Dim Kava — продажа осуществляется по\
    \ цене, указанной на сайте.\n • Если клиент ссылается на сторонний сайт — продажа\
    \ возможна только по согласованию со старшим менеджером или руководителем отдела\
    \ продаж.\n** 7. **Влияние на бонусы.\nПредоставленная скидка может отразит**ь**ся\
    \ на размере бонусной части сотрудника за продажу кофейного оборудования.\n**\
    \ 8. **Скидки на кофемолки и вспениватели.\nМаксимальный размер скидки — 5%.**"
  title_ka: ფასდაკლებების რეგლამენტი ყავის აპარატურაზე**
  content_ka: '**📍 ფასდაკლებების რეგლამენტი ყავის აპარატურაზე**


    **Dim Kava Georgia**


    ⸻


    **1. ზოგადი დებულებები**


    ეს რეგლამენტი განსაზღვრავს Dim Kava Georgia-ს ქსელის თანამშრომლების მოქმედების
    წესებს,

    როდესაც ხდება ფასდაკლებების მიცემა ყავის აპარატურაზე (КО) კლიენტებისთვის.


    ⸻


    **2. ძირითადი წესები**


    **1. ფასდაკლების ჩანაცვლება საჩუქრით**


    თუ კლიენტი ითხოვს ფასდაკლებას, თანამშრომელი პირველ რიგში სთავაზობს ალტერნატივას
    — საჩუქარს (ყავა, Caotina, აქსესუარები)

    ყავის აპარატის ღირებულების მაქსიმუმ 5%-ის ფარგლებში.


    ⸻


    **2. ფასდაკლება შეთანხმების გარეშე**


    სავაჭრო ობიექტის მენეჯერს უფლება აქვს დამოუკიდებლად მიანიჭოს ფასდაკლება ყავის
    აპარატურაზე

    არაუმეტეს 5%-ისა.


    ⸻


    **3. ფასდაკლება 5%-ზე მეტი**


    არასტანდარტულ სიტუაციებში 5%-ზე მეტი ფასდაკლების გაცემა შესაძლებელია მხოლოდ

    უფროს მენეჯერთან ან გაყიდვების განყოფილების ხელმძღვანელთან შეთანხმებით.


    ⸻


    **4. დამატებითი პროდუქციის სავალდებულო გაყიდვა**


    ფასდაკლებით ყავის აპარატურის გაყიდვისას მენეჯერი ვალდებულია შესთავაზოს და გაყიდოს
    თანმხლები პროდუქტები

    (ყავა, Caotina, აქსესუარები).


    ⸻


    **5. მაქსიმალური საჩუქარი**


    ფასდაკლების მიცემის შემთხვევაში მაქსიმალური დასაშვები საჩუქარია

    **0.250 კგ ყავა (ბლენდი)**.


    ⸻


    **6. ვებსაიტის ფასი**


    თუ კლიენტი მოვიდა **Dim Kava-ს ვებსაიტიდან** — გაყიდვა ხორციელდება საიტზე მითითებული
    ფასით.

    თუ კლიენტი ეყრდნობა სხვა ვებსაიტს — გაყიდვა შესაძლებელია მხოლოდ უფროს მენეჯერთან
    ან გაყიდვების ხელმძღვანელთან შეთანხმებით.


    ⸻


    **7. გავლენა ბონუსებზე**


    მიცემული ფასდაკლება შეიძლება აისახოს თანამშრომლის ბონუსურ ნაწილზე ყავის აპარატურის
    გაყიდვისას.


    ⸻


    **8. ფასდაკლება ყავის საფქვავებსა და რძის ამქაფებლებზე**


    მაქსიმალური დასაშვები ფასდაკლება — **5%**.'
  title_en: Regulations on Providing Discounts on Coffee Equipment
  content_en: "**Regulations on Providing Discounts on Coffee Equipment\n\nDim Kava\
    \ Georgia\n\n1. General Provisions\n\nThese regulations establish the procedure\
    \ for Dim Kava Georgia network employees when providing discounts on coffee equipment\
    \ (CE) to customers.\n\n2. Main Rules\n** 1. **Replacing a discount with a gift.\n\
    When a customer requests a discount, the employee first offers an alternative\
    \ — a gift (coffee, Caotina, accessories) within 5% of the coffee machine cost.\n\
    ** 2. **Discount without approval.\nThe retail location manager may independently\
    \ provide a discount on coffee equipment of up to 5%.\n** 3. **Discount above\
    \ 5%.\nIn non-standard situations, providing a discount of more than 5% is possible\
    \ only with approval from the senior manager or head of the sales department.\n\
    ** 4. **Mandatory sale of related products.\nWhen selling coffee equipment with\
    \ a discount, the manager must offer and sell related products (coffee, Caotina,\
    \ accessories).\n** 5. **Maximum gift.\nWhen providing a discount, the maximum\
    \ allowable gift is 0.250 kg of coffee (blend).\n** 6. **Website price.\n • If\
    \ the customer came from the Dim Kava website — the sale is made at the price\
    \ stated on the website.\n • If the customer references a third-party website\
    \ — the sale is possible only with approval from the senior manager or head of\
    \ the sales department.\n** 7. **Impact on bonuses.\nThe discount provided may\
    \ affect the bonus portion of the employee's compensation for coffee equipment\
    \ sales.\n** 8. **Discounts on grinders and milk frothers.\nMaximum discount amount\
    \ — 5%.**"
