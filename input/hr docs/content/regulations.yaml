  title_en: Правила приема товара сотрудником магазина
  content_en: "Правила приема товара сотрудником магазина\nЗаказ товара:\nЗаказ товара\
    \ на торговую  точку делается 2  раз в неделю (исключение: кофеварка или кофе\
    \ под клиента), отправить заказ надо на телеграмм   менеджера - Регина.\nЗаполнить\
    \ бланк заказа и внести нужные  позиции. Если товар или кофеварка под клиента\
    \ ( указать про это в примечании)\nПрийом товара сотрудником:\nПри приеме товара\
    \ от логиста или курьером обязательно проверить целостность  коробок, сверить\
    \ количество товара фактически  и указанную в накладной . Тем самым вы снимаете\
    \ с себя ответственность штрафных санкций за бракованный/ потерянный/ недостающий\
    \ товар.\nКурьер или логист ждет  15 минут. Пока вы  проверяете и  принимаете\
    \  товар.\nДоставка курьером:  проверяем коробки , если помятые /раскрытые/ дефектные\
    \ - делаем фото для передачи в офис и проверяем количество фактическое и по накладной,\
    \ несоответствие сообщаем немедленно в офис!\nДоставка курьером Dim Kava:\nПроверить\
    \ термин годности товара и соответствие фактическое и по накладной количество,\
    \ если несоответствия – вернуть товар логисту и сообщить на офис сразу!.\nСверить\
    \ все позиции  и поставить галочки в приходной накладной. Если приходная накладная\
    \ не была вложена логистом, запросить этот  документ у менеджера офиса Регины\
    \ . Или  написать самим  список и количество товара какой приехал и отправить\
    \ фото в офис и Регине.\n \n Если какой то позиции  товара не было, а в документе\
    \  указан - делаем  «вычеркивание» и ставим !!!!!!!\nПриходную накладную нужно\
    \ сфотографировать  отправить в телеграмм офиса , ІИ бязательно написать комментарий\
    \  в тексте накладной:\n«Все сошлось! – только если все позиции товара точно сходятся»\
    \ «Вычеркнуто» - если вы отказываетесь от  какой-то  позиции в связи с порчей\
    \ или сроком годности.\n«Не сошлось» - если какая-нибудь  позиция отсутствует,\
    \ а документе значиться.\nДанные правила нужны для дальнейших сверок по вашему\
    \ товара. . Не соблюдение этого  правила тянет  за собой несвоевременное  оприходования\
    \  товара, и несоответствие в инвентаризации на конец месяца.!"
  title_ru: Правила приема товара сотрудником магазина
