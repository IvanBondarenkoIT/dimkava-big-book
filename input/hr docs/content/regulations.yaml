    პასუხისმგებლობა)


    თუ ლოგისტმა მოიტანა საქონელი ზედნადების გარეშე — თანამშრომელს აქვს უფლება არ მიიღოს
    საქონელი.


    📍 ჯარიმა — 20 ლარი, თუ საქონელი მოწოდებულია შიდა ზედნადების გარეშე


    📍 სახელმწიფო ჯარიმას (500 ლარი) იხდის ის თანამშრომელი, ვინც გავიდა საქონლით სატრანსპორტო
    ზედნადების გარეშე


    📍 საქონელი, რომელიც იგზავნება საკურიერო სერვისით, ასევე სავალდებულოა შეტანილი
    იყოს RSG- ში.'
