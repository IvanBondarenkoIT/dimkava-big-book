  title_en: 'Правила занесения чашек кофе в шоп селер для сотрудников компании Dim
    Kava:'
  content_en: "‼️‼️‼️‼️‼️‼️\nПравила занесения чашек кофе в шоп селер для сотрудников\
    \ компании Dim Kava:\n1. Выбираем сорт кофе - отмечаем в программе\n2. Молоко\
    \ вносим только в граммах! 150 грм( т.е. капучино или латте или 200гр на Lussuria\
    \ - это не правильно!)\n3. Пробиваем карточку сотрудника и пишем / Мы/ WE/\n4.\
    \ Если вы провели не по правилам - эта чашка будет считаться как недостача за\
    \ чашку!‼️‼️‼️‼️\n5. **Чашки отмеченные в программе без денег и без карточки -\
    \ есть недостача !**!‼️‼️‼️\n6. Сотруднику компании для дегустации на месяц выделено\
    \ 48 чашек  кофе и 10 порций по 150 гр молока, в программе, если вам больше не\
    \ пробивает программа - значит вы превышаете свой лимит!\nДегустационные чашки\
    \ даются для дегустации кофе , что бы вы знали какой кофе вы готовите клиенту,\
    \ для быстрого  регулирования качественного приготовления кофе для клиента! Качественный\
    \ эспрессо залог высоких продаж - чашек, пачек кофе и кофеварок!!\nЧай не входит\
    \ в дегустационные чашки! \nCaotina - 2 чашки в месяц!\n‼️\nПри покупке в течении\
    \ месяца пачки кофе 25% скидка на 2 пачки и 1 Caotina, остальные покупки по полной\
    \ стоимости!\nПокупка аксессуаров , кофеварок, чайников и др. осуществляться через\
    \ обсуждения с офисом!\nЕсли есть акции или рекламы - на каждой торговой точке\
    \ есть акционные карты - проводки делаем на нее с примечанием какая акция!"
