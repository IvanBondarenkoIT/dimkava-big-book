  title_en: Регламент по срокам годности товара.
  content_en: "Регламент по срокам годности товара.\nСроки годности товара сотрудники\
    \ проверяют при каждой инвентаризации ! И за ‼️3 месяца истечения срока реализации\
    \ сообщают на офис в system телеграмм канал, для дальнейших действий для реализации\
    \ данного товара! Офис разрабатывает акции , делает больший упор на продажу данного\
    \ товара, чтобы быстрей распродать! Также сами сотрудники должны больше продавать\
    \ товара у которого выходит срок реализации ( предлагают клиентам пачки и выготавливают\
    \ в чашках) Кофе не портится после истечения срока реализации на упаковке, поэтому\
    \ не надо сразу передавать на офис- надо выготовить его в чашках!!! \nРегламенты\
    \ выполняются качественно - залог успеха компании!"
