- slug: tg-31326
  section: regulations
  status: published
  title_en: ფასდაკლებების რეგლამენტი ყავის აპარატურაზე**
  content_en: '**📍 ფასდაკლებების რეგლამენტი ყავის აპარატურაზე**


    **Dim Kava Georgia**


    ⸻


    **1. ზოგადი დებულებები**


    ეს რეგლამენტი განსაზღვრავს Dim Kava Georgia-ს ქსელის თანამშრომლების მოქმედების
    წესებს,

    როდესაც ხდება ფასდაკლებების მიცემა ყავის აპარატურაზე (КО) კლიენტებისთვის.


    ⸻


    **2. ძირითადი წესები**


    **1. ფასდაკლების ჩანაცვლება საჩუქრით**


    თუ კლიენტი ითხოვს ფასდაკლებას, თანამშრომელი პირველ რიგში სთავაზობს ალტერნატივას
    — საჩუქარს (ყავა, Caotina, აქსესუარები)

    ყავის აპარატის ღირებულების მაქსიმუმ 5%-ის ფარგლებში.


    ⸻


    **2. ფასდაკლება შეთანხმების გარეშე**


    სავაჭრო ობიექტის მენეჯერს უფლება აქვს დამოუკიდებლად მიანიჭოს ფასდაკლება ყავის
    აპარატურაზე

    არაუმეტეს 5%-ისა.


    ⸻


    **3. ფასდაკლება 5%-ზე მეტი**


    არასტანდარტულ სიტუაციებში 5%-ზე მეტი ფასდაკლების გაცემა შესაძლებელია მხოლოდ

    უფროს მენეჯერთან ან გაყიდვების განყოფილების ხელმძღვანელთან შეთანხმებით.


    ⸻


    **4. დამატებითი პროდუქციის სავალდებულო გაყიდვა**


    ფასდაკლებით ყავის აპარატურის გაყიდვისას მენეჯერი ვალდებულია შესთავაზოს და გაყიდოს
    თანმხლები პროდუქტები

    (ყავა, Caotina, აქსესუარები).


    ⸻


    **5. მაქსიმალური საჩუქარი**


    ფასდაკლების მიცემის შემთხვევაში მაქსიმალური დასაშვები საჩუქარია

    **0.250 კგ ყავა (ბლენდი)**.


    ⸻


    **6. ვებსაიტის ფასი**


    თუ კლიენტი მოვიდა **Dim Kava-ს ვებსაიტიდან** — გაყიდვა ხორციელდება საიტზე მითითებული
    ფასით.

    თუ კლიენტი ეყრდნობა სხვა ვებსაიტს — გაყიდვა შესაძლებელია მხოლოდ უფროს მენეჯერთან
    ან გაყიდვების ხელმძღვანელთან შეთანხმებით.


    ⸻


    **7. გავლენა ბონუსებზე**


    მიცემული ფასდაკლება შეიძლება აისახოს თანამშრომლის ბონუსურ ნაწილზე ყავის აპარატურის
    გაყიდვისას.


    ⸻


    **8. ფასდაკლება ყავის საფქვავებსა და რძის ამქაფებლებზე**


    მაქსიმალური დასაშვები ფასდაკლება — **5%**.'
