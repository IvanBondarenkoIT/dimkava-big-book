  title_en: Регламент по ведению ежедневного отчёта по продажам
  content_en: "**Регламент по ведению ежедневного отчёта по продажам\n\nМенеджерами\
    \ торговых точек (City Mall, East Point, BatumiMall)\n\n1. Общие положения\n •\
    \ Таблица ежедневных продаж рассчитана на корректный учёт выполнения плана по\
    \ половине рабочего дня (6 часов из 12).\n • Внесение итоговых данных за 12 часов\
    \ (вал за день, всего чашек за день, всего кг кофе за день) считается нарушением\
    \ правил.\n • Все сотрудники обязаны заполнять таблицу строго по установленным\
    \ периодам.\n**\n⸻\n**\n2. Порядок заполнения таблицы\n** 1. **Промежутки для\
    \ заполнения:\n • с 10:00 до 16:00 – первая половина дня (Х-отчёт в 16:00).\n\
    \ • с 16:00 до 22:00 – вторая половина дня (Х-отчёт в 22:00).\n** 2. **Если сотрудник\
    \ работает полный день:\n • Он заполняет две таблицы:\n • за период 10:00–16:00\
    \ (вносит в свою таблицу);\n • за период 16:00–22:00 (вносит данные в таблицу\
    \ коллеги).\n** 3. **Идентификация сотрудника:\n • Обязательно выбирать своё имя\
    \ во всех заполняемых таблицах.\n**\n⸻\n**\n3. Подтверждающие материалы\n\nК каждой\
    \ таблице ежедневно прикрепляются:\n • фото данных из Shop-Seller:\n • сумма денег;\n\
    \ • итого продано (чашки и кофе);\n • фото Z-отчётов:\n • по банкам;\n • по терминалу.\n\
    **\n⸻\n**\n4. Выполнение планов\n • План выполнения считается по 6 часов, а не\
    \ по 12 ч\n • Корректность анализа достигается только при точном внесении данных\
    \ в указанные промежутки.\n**\n⸻\n**\n5. Ответственность\n • Незаполненные дни\
    \ или некорректно внесённые данные приводят к искажению итогов, что автоматически\
    \ считается нарушением.\n • Сотрудники обеспечивают правильность и своевременность\
    \ заполнения отчётных таблиц.**"
