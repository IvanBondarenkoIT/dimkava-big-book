  title_en: სალაროს შევსების რეგლამენტი დღის განმავლობაში პროგრამაში Shop-Seller**
  content_en: '**📍 სალაროს შევსების რეგლამენტი დღის განმავლობაში პროგრამაში Shop-Seller**


    ხარისხიანი მუშაობისთვის



    ყოველდღიურად ავსებთ ცხრილს პროგრამაში **Shop-Seller**, რათა უზრუნველყოფილი იყოს
    სავაჭრო ობიექტის გამართული მუშაობა და შეუსაბამობებზე დროული რეაგირება.



    **პირველ სვეტში:**


    📍 თარიღი



    **შემოსავლის (მიღების) ნაწილში:**


    📍 პირველი სვეტი — ვწერთ ნაღდი ფულის დღიურ შემოსავალს

    (აუცილებლად ვადარებთ Z-ანგარიშს და პროგრამა Shop-Seller-ს)


    📍 მეორე სვეტი — ვწერთ ნაღდი ფულის შემოსავალს სერვის ცენტრიდან

    (აუცილებლად ვადარებთ სერვის რეპორტსა და Z-ანგარიშს)


    📍 მესამე სვეტი — ვწერთ უნაღდო შემოსავალს სერვის ცენტრზე

    (აუცილებლად ვადარებთ სერვის რეპორტსა და Z-ანგარიშს)


    📍 მეოთხე სვეტი — ვწერთ თანხას TBS ტერმინალზე

    (აუცილებლად ვადარებთ Shop-Seller-ში უნაღდო გადახდების ჯამს და Z-ანგარიშს)


    📍 მეხუთე სვეტი — ვწერთ თანხას BOG ტერმინალზე

    (აუცილებლად ვადარებთ Shop-Seller-ში უნაღდო გადახდების ჯამს და Z-ანგარიშს)


    📍 სვეტი „სალარო საღამოსთვის“ — ვწერთ ნაღდ ფულს (ლარში),

    რაც ფაქტობრივად არის დღის ბოლოს, სამუშაო დღის დახურვისას

    (თუ მეტი ან ნაკლებია — ვწერთ რეალურ რაოდენობას)


    📍 სვეტი „თანამშრომელი“ — ვწერთ იმ თანამშრომლის სახელს,

    ვინც იმუშავა და იყო პასუხისმგებელი ამ სამუშაო დღეზე



    **ხარჯების სვეტში:**


    📍 თარიღი

    📍 მეორე სვეტი — ნაღდი ხარჯის თანხა

    📍 მესამე სვეტი — ხარჯის დასახელება


    აუცილებელი ხარჯები:


    წყალი — ლიტრაჟის მითითებით

    ხელსახოცები — რაოდენობის მითითებით


    ⚠️ სამეურნეო ხარჯები არ უნდა იყოს შერეული წარმოების ხარჯებთან!


    თუ ხარჯი არ არის წინასწარ დაგეგმილი — აუცილებლად უნდა იყოს დეტალურად აღწერილი
    (სტატისტისთვის გასაგებად).

    მაგალითად: „ტაქსი“ — დანიშნულების გარეშე არ მიიღება!



    **ინკასაციის სვეტში:**


    📍 პირველი სვეტი — თარიღი

    📍 მეორე სვეტი — ნაღდი თანხის რაოდენობა

    📍 მესამე სვეტი — სად/ვის გადაეცა თანხა (ბანკი, ოფისი, პასუხისმგებელი პირი)



    📌 მარცხენა ქვედა კუთხეში („სალარო თვის დასაწყისში“, ნაცრისფერ ბლოკში) — შეიყვანება
    წინა თვის ბოლოს არსებული ნაღდი თანხა,

    რომელიც აისახება მარჯვენა ზედა კუთხეში („სალარო“, წითელ ბლოკში)


    თუ თანხები არ ემთხვევა სამუშაო პერიოდში (ნაღდი ან ტერმინალი),

    არ ემთხვევა პროგრამას ან Z-ანგარიშებს — აუცილებელია ამის შესახებ შეტყობინება Telegram
    არხში **shopseller**,

    რათა დროულად მოხდეს რეაგირება და პრობლემის გადაწყვეტა.

    ასევე შენიშვნებში უნდა აღინიშნოს შეუსაბამობის ფაქტი.



    თუ თანამშრომელმა დროულად არ შეატყობინა სალაროს შეუსაბამობის შესახებ:

    📍 პირველი ჯარიმა — 10 ლარი

    📍 ყოველი მომდევნო თვე — ჯარიმა ორმაგდება


    ხარისხიანი მუშაობისთვის:


    აუცილებელია დილის сменის მიღებისას ნაღდი თანხის გადათვლა და სალაროს ცხრილთან შედარება.

    თუ აღმოჩნდება შეუსაბამობა — დაუყოვნებლივ უნდა ეცნობოს პერსონალის მენეჯერს და Telegram
    არხს **shopseller**.'
