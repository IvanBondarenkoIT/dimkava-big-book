  title_ru: Регламент по скидкам для сотрудников Dim Kava ( переведи пожалуйста)
  content_ru: "Регламент по скидкам для сотрудников Dim Kava ( переведи пожалуйста)\n\
    \n1. 25% скидка на кофе Blasercafe не более 0,5 кг в месяц, на Caotina не более\
    \ 2 штук в месяц,  на чай Blasercafe не более 5 шт в месяц ( скидка пробивается\
    \ на карту сотрудника)\n2. На аксессуары DeLonghi скидка не постоянная, может\
    \ меняться в зависимости от закупочной цены ! Не более 15% скидка на аксессуары\
    \ не более 2 х единиц в месяц.\n3. На китайские стаканы скидка по договоренности.\n\
    4. На капсулы Cafittaly скидка может менятся в зависимости от закупки и скидок,\
    \ скидка 15% .\n5. Скидка на воду пробивается на карту сотрудника, может меняться\
    \ от закупки. \n6. Печенье и батончики пробиваются на карту сотрудника уже со\
    \ скидкой. \n\n\nСкидки могут меняться в зависимости от закупочной цены.\n\nПусть\
    \ перезапустят программу чтобы скидки обновились"
  title_ka: Dim Kava-ს თანამშრომლებისთვის ფასდაკლების რეგლამენტი**
  content_ka: "**\U0001F4CD Dim Kava-ს თანამშრომლებისთვის ფასდაკლების რეგლამენტი**\n\
    \n**25% ფასდაკლება ყავაზე Blasercafe** — არაუმეტეს 0.5 კგ თვეში\n**    Caotina**\
    \ — არაუმეტეს 2 ერთეული თვეში\n**    Blasercafe-ის ჩაი** — არაუმეტეს 5 ერთეული\
    \ თვეში\n    (ფასდაკლება ფიქსირდება თანამშრომლის ბარათზე)\n**DeLonghi-ს აქსესუარებზე**\
    \ ფასდაკლება არ არის ფიქსირებული და შეიძლება შეიცვალოს შესყიდვის ფასის მიხედვით.\n\
    \    მაქსიმუმ — 15% ფასდაკლება, არაუმეტეს 2 ერთეული თვეში.\n**ჩინურ ჭიქებზე**\
    \ ფასდაკლება განისაზღვრება შეთანხმებით.\n**Cafittaly-ს კაფსულებზე** ფასდაკლება\
    \ შეიძლება შეიცვალოს შესყიდვის პირობებისა და მიმდინარე აქციების მიხედვით.\n  \
    \  საშუალოდ — 15% ფასდაკლება.\n**წყალზე** ფასდაკლება ფიქსირდება თანამშრომლის ბარათზე\
    \ და შეიძლება შეიცვალოს შესყიდვის ფასის მიხედვით.\n**ორცხობილა და ბატონჩიკები**\
    \ პროგრამაში გატარებულია უკვე ფასდაკლებით თანამშრომლის ბარათზე.\n\n\U0001F4CC\
    \ ფასდაკლებები შეიძლება შეიცვალოს შესყიდვის ფასების მიხედვით.\n\n\U0001F4CC ფასების\
    \ შეცვლის მერე, გადატვირთეთ პროგრამა, რათა ფასდაკლებები განახლდეს, შემდეგ თხოვეთ\
    \ რეგინას რომ დააბრუნოს ძველ ფასზე და გადატვირთეთ ისევ პროგრამა."
  title_en: Regulations on Discounts for Dim Kava Employees
  content_en: "Regulations on Discounts for Dim Kava Employees\n\n1. 25% discount\
    \ on Blasercafe coffee — no more than 0.5 kg per month, on Caotina — no more than\
    \ 2 units per month, on Blasercafe tea — no more than 5 units per month (discount\
    \ is processed on the employee card)\n2. DeLonghi accessories discount is not\
    \ fixed, may change depending on purchase price! No more than 15% discount on\
    \ accessories, no more than 2 units per month.\n3. Chinese cups — discount by\
    \ agreement.\n4. Cafittaly capsules discount may change depending on purchase\
    \ and supplier discounts, 15% discount.\n5. Water discount is processed on the\
    \ employee card, may change depending on purchase. \n6. Cookies and bars are processed\
    \ on the employee card already with discount. \n\n\nDiscounts may change depending\
    \ on purchase price.\n\nRestart the program so that discounts are updated"
