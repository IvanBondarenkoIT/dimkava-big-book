  title_ru: Правила приема товара сотрудником магазина
  content_ru: "Правила приема товара сотрудником магазина\nЗаказ товара:\nЗаказ товара\
    \ на торговую  точку делается 2  раз в неделю (исключение: кофеварка или кофе\
    \ под клиента), отправить заказ надо на телеграмм   менеджера - Регина.\nЗаполнить\
    \ бланк заказа и внести нужные  позиции. Если товар или кофеварка под клиента\
    \ ( указать про это в примечании)\nПрийом товара сотрудником:\nПри приеме товара\
    \ от логиста или курьером обязательно проверить целостность  коробок, сверить\
    \ количество товара фактически  и указанную в накладной . Тем самым вы снимаете\
    \ с себя ответственность штрафных санкций за бракованный/ потерянный/ недостающий\
    \ товар.\nКурьер или логист ждет  15 минут. Пока вы  проверяете и  принимаете\
    \  товар.\nДоставка курьером:  проверяем коробки , если помятые /раскрытые/ дефектные\
    \ - делаем фото для передачи в офис и проверяем количество фактическое и по накладной,\
    \ несоответствие сообщаем немедленно в офис!\nДоставка курьером Dim Kava:\nПроверить\
    \ термин годности товара и соответствие фактическое и по накладной количество,\
    \ если несоответствия – вернуть товар логисту и сообщить на офис сразу!.\nСверить\
    \ все позиции  и поставить галочки в приходной накладной. Если приходная накладная\
    \ не была вложена логистом, запросить этот  документ у менеджера офиса Регины\
    \ . Или  написать самим  список и количество товара какой приехал и отправить\
    \ фото в офис и Регине.\n \n Если какой то позиции  товара не было, а в документе\
    \  указан - делаем  «вычеркивание» и ставим !!!!!!!\nПриходную накладную нужно\
    \ сфотографировать  отправить в телеграмм офиса , ІИ бязательно написать комментарий\
    \  в тексте накладной:\n«Все сошлось! – только если все позиции товара точно сходятся»\
    \ «Вычеркнуто» - если вы отказываетесь от  какой-то  позиции в связи с порчей\
    \ или сроком годности.\n«Не сошлось» - если какая-нибудь  позиция отсутствует,\
    \ а документе значиться.\nДанные правила нужны для дальнейших сверок по вашему\
    \ товара. . Не соблюдение этого  правила тянет  за собой несвоевременное  оприходования\
    \  товара, и несоответствие в инвентаризации на конец месяца.!"
  title_ka: 'გრანიტის“ პროგრამის გათიშვის რეგლამენტი:'
  content_ka: '„გრანიტის“ პროგრამის გათიშვის რეგლამენტი:

    თუ პროგრამა Shop Seller არ მუშაობს, ყველა გაყიდვა უნდა დაფიქსირდეს ხელით — ან
    ქაღალდზე, ან უკვე გატარებულ ქვითრებზე.


    დღის ბოლოს:

    ყველა Z-რეპორტი და ქვითრები ან ხელნაწერი ანგარიში უნდა გაიგზავნოს Telegram არხში
    – სისტემის ინვენტარიზაცია და აღრიცხვა

    შენიშვნით: რომ პროგრამა არ მუშაობდა!


    ⚠️ ეს ძალიან მნიშვნელოვანია შემდგომი მუშაობისთვის და ხარისხიანი ინვენტარიზაციისთვის!


    და ყველა მონაცემი სავალდებულოა იყოს ინგლისურ ენაზე!'
  title_en: Rules for Store Employees Receiving Goods
  content_en: "Rules for Store Employees Receiving Goods\nProduct ordering:\nProduct\
    \ orders for the retail location are placed twice a week (exception: coffee machine\
    \ or coffee for a specific customer). The order must be sent via Telegram to the\
    \ manager — Regina.\nFill out the order form and enter the required items. If\
    \ the product or coffee machine is for a specific customer, indicate this in the\
    \ notes.\nReceiving goods by the employee:\nWhen receiving goods from the logistics\
    \ driver or courier, you must check the integrity of the boxes and verify the\
    \ actual quantity of goods against the quantity stated on the delivery note. This\
    \ removes your liability for penalties related to defective/lost/missing goods.\n\
    The courier or logistics driver waits 15 minutes while you check and accept the\
    \ goods.\nCourier delivery: check the boxes; if they are dented/open/damaged —\
    \ take photos to send to the office and verify the actual quantity against the\
    \ delivery note; report any discrepancy to the office immediately!\nDim Kava courier\
    \ delivery:\nCheck the product expiration date and verify the actual quantity\
    \ against the delivery note; if there are discrepancies — return the goods to\
    \ the logistics driver and notify the office immediately!\nVerify all items and\
    \ mark checkmarks on the goods receipt note. If the goods receipt note was not\
    \ included by the logistics driver, request this document from the office manager\
    \ Regina. Or write the list and quantity of goods that arrived yourself and send\
    \ photos to the office and to Regina.\n \n If an item was not received but is\
    \ listed in the document — cross it out and mark !!!!!!!\nThe goods receipt note\
    \ must be photographed and sent to the office Telegram; you must also write a\
    \ comment in the text of the delivery note:\n\"Everything matched!\" — only if\
    \ all product items match exactly\n\"Crossed out\" — if you are refusing an item\
    \ due to damage or expiration date.\n\"Did not match\" — if an item is missing\
    \ but is listed in the document.\nThese rules are needed for further reconciliation\
    \ of your goods. Failure to comply with this rule leads to untimely posting of\
    \ goods and discrepancies in end-of-month inventory!"
  source_ru_id: 31193
  source_ka_id: 900023
  match_method: txt_fuzzy
  match_confidence: 0.85
