  title_ru: 'Правила занесения чашек кофе в шоп селер для сотрудников компании Dim
    Kava:'
  content_ru: "‼️‼️‼️‼️‼️‼️\nПравила занесения чашек кофе в шоп селер для сотрудников\
    \ компании Dim Kava:\n1. Выбираем сорт кофе - отмечаем в программе\n2. Молоко\
    \ вносим только в граммах! 150 грм( т.е. капучино или латте или 200гр на Lussuria\
    \ - это не правильно!)\n3. Пробиваем карточку сотрудника и пишем / Мы/ WE/\n4.\
    \ Если вы провели не по правилам - эта чашка будет считаться как недостача за\
    \ чашку!‼️‼️‼️‼️\n5. **Чашки отмеченные в программе без денег и без карточки -\
    \ есть недостача !**!‼️‼️‼️\n6. Сотруднику компании для дегустации на месяц выделено\
    \ 48 чашек  кофе и 10 порций по 150 гр молока, в программе, если вам больше не\
    \ пробивает программа - значит вы превышаете свой лимит!\nДегустационные чашки\
    \ даются для дегустации кофе , что бы вы знали какой кофе вы готовите клиенту,\
    \ для быстрого  регулирования качественного приготовления кофе для клиента! Качественный\
    \ эспрессо залог высоких продаж - чашек, пачек кофе и кофеварок!!\nЧай не входит\
    \ в дегустационные чашки! \nCaotina - 2 чашки в месяц!\n‼️\nПри покупке в течении\
    \ месяца пачки кофе 25% скидка на 2 пачки и 1 Caotina, остальные покупки по полной\
    \ стоимости!\nПокупка аксессуаров , кофеварок, чайников и др. осуществляться через\
    \ обсуждения с офисом!\nЕсли есть акции или рекламы - на каждой торговой точке\
    \ есть акционные карты - проводки делаем на нее с примечанием какая акция!"
  title_ka: Регламент при неисправности терминала в компании Dim Kava Georgia
  content_ka: "Регламент при неисправности терминала в компании Dim Kava Georgia\n\
    1. Общие положения\n\n1.1. Настоящий регламент устанавливает порядок действий\
    \ менеджера и сотрудников торговой точки при выявлении неисправности банковского\
    \ терминала.\n1.2. Цель — обеспечение бесперебойной работы торговой точки, минимизация\
    \ сбоев в обслуживании клиентов и сохранение лояльности покупателей.\n\n2. Первичные\
    \ действия менеджера\n\nПри выявлении проблемы (терминал не включается, не проводит\
    \ оплату, зависает, выдает ошибку):\n • Проверить подключение к электропитанию\
    \ и целостность кабеля;\n • Проверить наличие интернет-соединения;\n • Перезагрузить\
    \ терминал (выключение и повторное включение);\n • Попробовать провести тестовую\
    \ операцию на минимальную сумму.\n\n3. Если проблема сохраняется\n\n3.1. Менеджер\
    \ обязан:\n • Уведомить сотрудника торговой точки о временной невозможности оплаты\
    \ по карте;\n • Немедленно сообщить о неисправности в:\n • Службу поддержки банка\
    \ (телефон горячей линии указан \U0001F447 );\n • Старшему менеджеру /менеджеру\
    \ по персоналу.\n\n3.2. При звонке в банк необходимо сообщить:\n • номер терминала\
    \ (указан на любом чеке этого терминала );\n • торговую точку и адрес;\n • описание\
    \ проблемы и предпринятые действия (перезагрузка, проверка сети).\n\n4. Действия\
    \ в период неисправности\n\n4.1. Прием оплаты:\n • Предложить клиенту наличный\
    \ расчет (если данный терминал работает); \n • Предложить перевод по расчетному\
    \ номеру компании (расчетный номер компании указан ниже \U0001F447);\n    • Если\
    \ клиент отказывается переводить деньги и хочет оплатить наличными (без чека мы\
    \ не можем выдать продукт) то просим выбить чек у другой торговой точки ,сфоткать\
    \ чек и выслать клиенту.\n • Уточнить возможность проведения оплаты через другой\
    \ терминал (если на точке их несколько).\n\n4.2. В случае невозможности проведения\
    \ операции:\n • Извиниться перед клиентом и объяснить ситуацию;\n • При необходимости\
    \ оформить резервирование заказа до восстановления работы терминала.\n\n5. Восстановление\
    \ работы\n • После устранения неисправности менеджер обязан проверить корректность\
    \ работы терминала (тестовый платеж/отмена тестовой операции);\n • Сообщить сотруднику\
    \ точки, что терминал работает в штатном режиме;\n • Зафиксировать инцидент в\
    \ журнале неисправностей (дата, время, суть поломки, предпринятые действия, контакт\
    \ с банком).\n\n6. Ответственность\n • Менеджер торговой точки отвечает за своевременное\
    \ уведомление банка и руководства.\n • Несвоевременное информирование или игнорирование\
    \ неисправности считается нарушением регламента.\n\nГорячая линия банка : \nBOG\
    \ - 0322 44 44 44\nTBC -  0322 27 27 27\n\nНомер счета компании: \n\nGE35TB7223436020100002\n\
    GE48BG0000000010697300\nმიმღები შ.პ.ს. \"ყავის სახლი\""
  title_en: 'Rules for Recording Coffee Cups in Shop Seller for Dim Kava Company Employees:'
  content_en: "‼️‼️‼️‼️‼️‼️\nRules for Recording Coffee Cups in Shop Seller for Dim\
    \ Kava Company Employees:\n1. Select the coffee variety — mark it in the program\n\
    2. Milk is entered only in grams! 150 g (i.e. cappuccino or latte or 200g for\
    \ Lussuria — this is incorrect!)\n3. Process the employee card and write / We\
    \ / WE /\n4. If you processed it incorrectly — this cup will count as a shortage\
    \ for one cup!‼️‼️‼️‼️\n5. **Cups marked in the program without payment and without\
    \ a card — count as a shortage!**!‼️‼️‼️\n6. Company employees are allocated 48\
    \ coffee cups and 10 portions of 150 g milk per month for tasting in the program;\
    \ if the program stops processing for you — it means you are exceeding your limit!\n\
    Tasting cups are provided for tasting coffee so you know what coffee you are preparing\
    \ for the customer, for quick adjustment of quality coffee preparation for the\
    \ customer! Quality espresso is the key to high sales — cups, coffee packages\
    \ and coffee machines!!\nTea is not included in tasting cups! \nCaotina — 2 cups\
    \ per month!\n‼️\nWhen purchasing during the month, 25% discount on 2 coffee packages\
    \ and 1 Caotina; all other purchases at full price!\nPurchase of accessories,\
    \ coffee machines, kettles, etc. is done through discussion with the office!\n\
    If there are promotions or advertising campaigns — each retail location has promotional\
    \ cards — process transactions on it with a note indicating which promotion!"
