- slug: tg-31325
  section: regulations
  status: published
  title_en: ყოველდღიური გაყიდვების ანგარიშის წარმოების რეგლამენტი**
  content_en: '**📍 ყოველდღიური გაყიდვების ანგარიშის წარმოების რეგლამენტი**


    **სავაჭრო ობიექტების მენეჯერებისთვის (City Mall, East Point, Batumi Mall)**


    ⸻


    **1. ზოგადი დებულებები**


    ყოველდღიური გაყიდვების ცხრილი განკუთვნილია გეგმის შესრულების სწორი აღრიცხვისთვის
    სამუშაო დღის ნახევარზე (12 საათიდან 6 საათი).

    დღის სრული 12-საათიანი შედეგების შეყვანა (დღიური ბრუნვა, ჭიქების საერთო რაოდენობა,
    ყავის საერთო კილოგრამები) ითვლება წესის დარღვევად.

    ყველა თანამშრომელი ვალდებულია შეავსოს ცხრილი მკაცრად განსაზღვრული პერიოდების მიხედვით.


    ⸻


    **2. ცხრილის შევსების წესი**


    **1. დროის მონაკვეთები:**


    10:00 – 16:00 → დღის პირველი ნახევარი (X-ანგარიში 16:00-ზე)

    16:00 – 22:00 → დღის მეორე ნახევარი (X-ანგარიში 22:00-ზე)


    **2. თუ თანამშრომელი მუშაობს სრულ დღეს:**


    ავსებს ორ ცხრილს:

    10:00–16:00 პერიოდი (შეაქვს საკუთარ ცხრილში)

    16:00–22:00 პერიოდი (შეაქვს კოლეგის ცხრილში)


    **3. თანამშრომლის იდენტიფიკაცია:**


    ყველა შევსებულ ცხრილში აუცილებლად უნდა იყოს მითითებული თანამშრომლის სახელი.


    ⸻


    **3. დამადასტურებელი მასალები**


    ყოველდღიურად თითოეულ ცხრილს უნდა დაემატოს:


    **Shop-Seller-ის მონაცემების ფოტო:**

    თანხის ჯამი

    გაყიდვების საერთო რაოდენობა (ჭიქები და ყავა)

    **Z-ანგარიშების ფოტო:**

    ბანკების მიხედვით

    ტერმინალის მიხედვით


    ⸻


    **4. გეგმის შესრულება**


    გეგმა ითვლება 6 საათის მიხედვით და არა 12 საათის მიხედვით.

    ანალიზის სიზუსტე მიიღწევა მხოლოდ მონაცემების სწორად და დროის მიხედვით შეყვანის
    შემთხვევაში.


    ⸻


    **5. პასუხისმგებლობა**


    დაუვსებელი დღეები ან არასწორად შეყვანილი მონაცემები იწვევს შედეგების დამახინჯებას
    და ავტომატურად ითვლება დარღვევად.

    თანამშრომლები ვალდებულნი არიან უზრუნველყონ ანგარიშების სწორად და დროულად შევსება.'
