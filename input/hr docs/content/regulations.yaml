- slug: reg-31213
  section: regulations
  status: published
  title_ru: РЕГЛАМЕНТ
  content_ru: '****РЕГЛАМЕНТ


    ПО ЗАПОЛНЕНИЮ КАССЫ ЗА ДЕНЬ

    В ПРОГРАММЕ SHOP-SELLER**


    Для обеспечения качественной и бесперебойной работы торговой точки, а также своевременного
    реагирования на любые несоответствия, каждый сотрудник обязан ежедневно корректно
    и полностью заполнять таблицу кассы в программе Shop-seller.

    **

    ⸻

    **

    1. ЗАПОЛНЕНИЕ КОЛОНКИ «ПРИХОД»


    1.1. Дата

       •   В первом столбце указывается дата рабочего дня.


    1.2. Приходы


    В колонке «Приход» заполняются следующие данные:


    1️⃣ Наличные приходы за день

    — Вносим сумму фактического поступления наличных за день.

    — Обязательно сверяем с Z-отчётом и данными Shop-seller.


    2️⃣ Приход наличных с сервисного центра

    — Вносим сумму, полученную от сервисного центра.

    — Сверяем с рапортом сервисного центра и Z-отчётом.


    3️⃣ Безналичный приход на сервисный центр

    — Указываем сумму безналичных поступлений на сервисный центр.

    — Сверяем с рапортом и Z-отчётом.


    4️⃣ Приход на терминал TBS

    — Вносим сумму поступлений через терминал TBS.

    — Сверяем с итогами безналичных оплат в Shop-seller и с Z-отчётом.


    5️⃣ Приход на терминал BOG

    — Указываем сумму поступлений через терминал BOG.

    — Сверяем с итогами безнала и Z-отчётом.


    1.3. КАССА НА ВЕЧЕР


    — Вносим фактическую сумму наличных (в лари), находящихся на торговой точке на
    момент закрытия смены.

    — Если сумма больше или меньше — записываем фактическое значение, без исправлений
    и приписок.**( В примечании пишем ошибку)**


    1.4. Сотрудник


    — Указываем имя сотрудника, который работал в данный день и отвечает за кассу.

    **

    ⸻

    **

    2. ЗАПОЛНЕНИЕ КОЛОНКИ «РАСХОД»


    1️⃣ Дата

    2️⃣ Сумма расхода наличных

    3️⃣ Наименование расхода


    Требования:

       •   Обязательно указывать вид расхода:

    — вода (количество литров),

    — салфетки (количество),

    — хозтовары (не смешивать с производственными расходами).

       •   Непредвиденные расходы должны быть четко пояснены.

    Например: «такси» без объяснения цели — в расход не принимается!


    В **обязательном порядке высылаем чек на расход наличных в чат телеграмм канала
    данной торговой точки!! ( если нет чека или комментария, почему нет чека - является
    недостачей)**

    **

    ⸻

    **

    3. ЗАПОЛНЕНИЕ КОЛОНКИ «ИНКАСАЦИЯ»


    1️⃣ Дата

    2️⃣ Сумма инкассации (расход наличных)

    3️⃣ Кому или куда переданы деньги:

    — банк,

    — офис,

    — ответственное лицо.

    **

    ⸻

    **

    4. КАССА НА НАЧАЛО МЕСЯЦА


    В левом нижнем углу, в сером квадрате, указываем сумму наличных на начало месяца.

    Эта сумма должна совпадать с показанием в красном квадрате «КАССА» в правом верхнем
    углу, отображённым на конец предыдущего месяца.

    **

    ⸻

    **

    5. ОБЯЗАТЕЛЬНОЕ ИНФОРМИРОВАНИЕ О НЕСООТВЕТСТВИЯХ


    Если в течение рабочего периода выявлены несоответствия:

       •   по наличным,

       •   по терминалу,

       •   между программой Shop-seller и Z-отчетом,


    сотрудник обязан немедленно сообщить об этом в телеграм-канал shopseller, а также
    указать факт несоответствия в примечании таблицы.


    Ответственность:

       •   Первое несообщённое вовремя несоответствие — удержание 10 лари из зарплаты.

       •   Каждое последующее — сумма удержания удваивается.

    **

    ⸻

    **

    6. ПРАВИЛА ПРИЕМА СМЕНЫ (ОБЯЗАТЕЛЬНО)


    Каждый сотрудник при начале смены должен:

    ** 1. **Пересчитать наличные в кассе.

    ** 2. **Сверить с таблицей кассы.

    ** 3. При несоответствиях — **немедленно сообщить менеджеру по персоналу и в телеграм
    shopseller.


    Если сотрудник принимает смену с недостачей и не сообщает об этом — он автоматически
    берёт ответственность на себя.

    **

    ⸻

    **

    7. ВОПРОСЫ ПО ТОВАРУ


    Любые вопросы по наличию товара на точке можно задавать в телеграм-канале system.

    **

    ⸻

    **

    8. МИССИЯ КОМПАНИИ


    Команда Dim Kava заинтересована в:

       •   качественной и бесперебойной работе торговых точек,

       •   своевременном устранении ошибок,

       •   увеличении продаж,

       •   росте заработной платы сотрудников.**'
  title_ka: Dim Kava Georgia“-ში ყავის აპარატების გაყიდვის რეგლამენტი
  content_ka: '„Dim Kava Georgia“-ში ყავის აპარატების გაყიდვის რეგლამენტი

    1. ზოგადი დებულებები


    1.1. აღნიშნული რეგლამენტი განსაზღვრავს წესებსა და პროცედურებს, რომლებიც დაკავშირებულია
    ყავის აპარატების (ყავის აპარატები, აქსესუარებისა და სხვა მოწყობილობების) რეალიზაციასთან
    „Dim Kava“-ს სავაჭრო ობიექტებში.


    1.2. რეგლამენტის მიზანია გაყიდვების სიზუსტის უზრუნველყოფა, შეცდომების თავიდან
    აცილება ყავის აპარატების კომპლექტაციასა და გაყიდვის პროცესში, ასევე მაღალი დონის
    მომსახურების შენარჩუნება მომხმარებლებისთვის.


    1.3. ყველა თანამშრომელი ვალდებულია მკაცრად დაიცვას მოცემული რეგლამენტი.


    2. ყავის აპარატის გაყიდვა


    2.1. გაყიდვამდე თანამშრომელმა უნდა:

    • დააზუსტოს მოხმარებელთან, რომელი მოდელი და მახასიათებლები აინტერესებს;

    • გადაამოწმოს მოდელის ხელმისაწვდომობა ბაზაში (საწყობი, სავაჭრო ობიექტი, რეზერვი).


    2.2. თუ მოთხოვნილი მოდელი ადგილზე არ არის:

    • თანამშრომელმა უნდა შესთავაზოს მომხმარებელს ანალოგიური მოდელები მსგავსი მახასიათებლებითა
    და ფასით;

    • თუ მოხმარებელი დაინტერესებულია მხოლოდ კონკრეტული მოდელით, თანამშრომელი აფორმებს
    შეკვეთას ცენტრალიზებული სისტემის/საწყობის მეშვეობით.


    2.3. აპარატის გაცემა ხორციელდება მხოლოდ ქარხნულ, ორიგინალ შეფუთვაში, რომელიც შეესაბამება
    კონკრეტულ მოდელს:

    • ყუთი უნდა იყოს ახალი, დაუზიანებელი და სუფთა;

    • ყუთზე აუცილებლად უნდა იყოს მითითებული მოდელი და სერიული ნომერი;

    • ყუთი უნდა სრულად შეესაბამებოდეს გაყიდულ ყავის აპარატს (შეფუთვის ჩანაცვლება დაუშვებელია).


    2.4. თუ კონკრეტულ ობიექტზე (მაგალითად, „City Mall“-ში) ყუთი არ არის:

    • ყუთი გაიცემა საწყობიდან (მენეჯერი აცნობებს ოფისს გაყიდვის შესახებ);

    • მენეჯერმა უნდა აუხსნას მომხმარებელს ყავის აპარატის სახლში მიწოდების ფასეულობები
    ანუ ჩვენი პლიუს სერვისი და გააფრთხილოს მომხარებელი, რომ მიწოდება ხდება სამუშაო
    დღის საათებში 4 საათამდე (ტრენერი უკავშირდება მომხმარებელს დროისა და პირობების
    დასაზუსტებლად);

    • მენეჯერი იწერს მომხმარებლის მონაცემებს (სახელი, ტელეფონის ნომერი, მისამართი)
    და გადასცემს ტრენერს;

    • მოხმარებლის წასვლის შემდეგ მენეჯერი ატყობინებს რეგინას გაყიდვის შესახებ და რომელ
    ყავას ვჩუქნით, სთხოვს საწყობიდან „City Mall“-ზე გადატანისა და საჩუქრის ზედნადებს
    და ახორციელებს გაყიდვის გატარებას სისტემაში Shop Seller.


    3. ქმედებები მოდელის არქონის შემთხვევაში


    3.1. შესაძლო ვარიანტები:

    • საქონლის დაჯავშნა საწყობში და მიტანა მაღაზიაში (სავარაუდო ვადების მითითებით
    მომხარებლისთვის);

    • წინასწარი შეკვეთის გაფორმება და მიღების თარიღის შეთანხმება (მომწოდებელთან ხელმისაწვდომობისა
    და მიწოდების ვადების დაზუსტება ხდება მენეჯერების — ნინის ან სალომეს — მეშვეობით);

    • მოხმარებლის გადამისამართება სხვა ობიექტზე, სადაც აღნიშნული მოდელი არის ადგილზე
    (წინასწარ შეთანხმებით ტელეფონის მეშვეობით; ამ მეთოდს ვიყენებთ მხოლოდ მაშინ, როცა
    მომხმარებელს სასწრაფოდ სჭირდება ეს კონკრეტული მოდელი და თანახმაა თავად მივიდეს
    სხვა ობიექტზე).


    3.2. თუ საქონელი არ არის არც ქსელში და არც მომწოდებელთან:

    • თანამშრომელი აფიქსირებს მოთხოვნას;

    • მენეჯერი ართმევს მომხმარებელს ტელეფონის ნომერს და აცნობებს, როცა ინფორმაცია
    იქნება ხელმისაწვდომი;

    • მომხმარებელს აწვდის ინფორმაციას სავარაუდო მიღების თარიღს (შესყიდვების განყოფილების
    მონაცემების საფუძველზე).


    4. შემოწმება გაყიდვამდე


    4.1. გაყიდვამდე თანამშრომელმა უნდა:

    • შეამოწმოს მოდელი და სერიული ნომერი აპარატზე და ყუთზე — ისინი უნდა ემთხვეოდნენ
    ერთმანეთს !!!

    • გადაამოწმოს შეფუთვის მთლიანობა;

    • საჭიროების შემთხვევაში (მომხმარებლის თხოვნით) ფრთხილად გახსნას შეფუთვა და აჩვენოს
    კომპლექტაცია (ყავის აპარატი, სადენი, ფილტრები, სხვა აქსესუარები, ინსტრუქცია, საგარანტიო).


    4.2. შემოწმების შემდეგ აპარატი ხელახლა იფუთება ქარხნულ შეფუთვაში.


    5. დოკუმენტები და გარანტია


    5.1. თითოეულ ყავის აპარატზე უნდა გავცეთ:

    • ქვითარი;

    • საგარანტიო ბეჭედით/მაღაზიის შტამპით;

    • ინსტრუქცია.


    5.2. გაყიდვისას საგარანტიო ტალონში აუცილებლად უნდა ჩაიწეროს მოდელისა და სერიული
    ნომრის მონაცემები.


    6. პასუხისმგებლობა


    რეგლამენტის დარღვევა (აპარატების გაცემა არაორიგინალი ყუთით/სხვა აპარატის ყუთით
    ან არასწორი კომპლექტაციით, ყოველგვარი შეთანხმების გარეშე) იწვევს დისციპლინურ პასუხისმგებლობას.


    7. დამატებითი დებულებები'
  title_en: REGULATIONS
  content_en: "****REGULATIONS\n\nFOR DAILY CASH REGISTER ENTRY\nIN SHOP-SELLER**\n\
    \nTo ensure quality and uninterrupted operation of the retail location, as well\
    \ as timely response to any discrepancies, every employee must daily correctly\
    \ and fully complete the cash register table in the Shop-Seller program.\n**\n\
    ⸻\n**\n1. COMPLETING THE \"INCOME\" COLUMN\n\n1.1. Date\n   •   The date of the\
    \ workday is entered in the first column.\n\n1.2. Income\n\nThe following data\
    \ is entered in the \"Income\" column:\n\n1️⃣ Cash income for the day\n— Enter\
    \ the amount of actual cash received for the day.\n— Must be reconciled with the\
    \ Z-report and Shop-Seller data.\n\n2️⃣ Cash income from the service center\n\
    — Enter the amount received from the service center.\n— Reconcile with the service\
    \ center report and Z-report.\n\n3️⃣ Non-cash income for the service center\n\
    — Enter the amount of non-cash receipts for the service center.\n— Reconcile with\
    \ the report and Z-report.\n\n4️⃣ Income on TBS terminal\n— Enter the amount of\
    \ receipts via the TBS terminal.\n— Reconcile with non-cash payment totals in\
    \ Shop-Seller and the Z-report.\n\n5️⃣ Income on BOG terminal\n— Enter the amount\
    \ of receipts via the BOG terminal.\n— Reconcile with non-cash totals and Z-report.\n\
    \n1.3. CASH AT END OF DAY\n\n— Enter the actual cash amount (in lari) at the retail\
    \ location at shift closing.\n— If the amount is higher or lower — record the\
    \ actual value, without corrections or additions.**(Note the error in the notes)**\n\
    \n1.4. Employee\n\n— Enter the name of the employee who worked that day and is\
    \ responsible for the cash register.\n**\n⸻\n**\n2. COMPLETING THE \"EXPENSE\"\
    \ COLUMN\n\n1️⃣ Date\n2️⃣ Cash expense amount\n3️⃣ Expense description\n\nRequirements:\n\
    \   •   Expense type must be specified:\n— water (number of liters),\n— napkins\
    \ (quantity),\n— household supplies (do not mix with production expenses).\n \
    \  •   Unforeseen expenses must be clearly explained.\nFor example: \"taxi\" without\
    \ explanation of purpose — not accepted as an expense!\n\nYou **must send the\
    \ cash expense receipt to the Telegram channel of this retail location!! (if there\
    \ is no receipt or comment explaining why there is no receipt — it is considered\
    \ a shortage)**\n**\n⸻\n**\n3. COMPLETING THE \"COLLECTION\" COLUMN\n\n1️⃣ Date\n\
    2️⃣ Collection amount (cash expense)\n3️⃣ To whom or where the money was transferred:\n\
    — bank,\n— office,\n— responsible person.\n**\n⸻\n**\n4. CASH AT START OF MONTH\n\
    \nIn the lower left corner, in the gray square, enter the cash amount at the start\
    \ of the month.\nThis amount must match the figure in the red \"CASH\" square\
    \ in the upper right corner, displayed at the end of the previous month.\n**\n\
    ⸻\n**\n5. MANDATORY REPORTING OF DISCREPANCIES\n\nIf discrepancies are identified\
    \ during the work period:\n   •   in cash,\n   •   at the terminal,\n   •   between\
    \ Shop-Seller and Z-report,\n\nthe employee must immediately report this in the\
    \ shopseller Telegram channel, and also note the discrepancy in the table notes.\n\
    \nResponsibility:\n   •   First untimely unreported discrepancy — deduction of\
    \ 10 lari from salary.\n   •   Each subsequent one — deduction amount doubles.\n\
    **\n⸻\n**\n6. SHIFT ACCEPTANCE RULES (MANDATORY)\n\nEvery employee at the start\
    \ of a shift must:\n** 1. **Recount cash in the register.\n** 2. **Reconcile with\
    \ the cash table.\n** 3. If there are discrepancies — **immediately notify the\
    \ HR manager and shopseller Telegram.\n\nIf an employee accepts a shift with a\
    \ shortage and does not report it — they automatically take responsibility upon\
    \ themselves.\n**\n⸻\n**\n7. PRODUCT QUESTIONS\n\nAny questions about product\
    \ availability at the location can be asked in the system Telegram channel.\n\
    **\n⸻\n**\n8. COMPANY MISSION\n\nThe Dim Kava team is committed to:\n   •   quality\
    \ and uninterrupted operation of retail locations,\n   •   timely correction of\
    \ errors,\n   •   increasing sales,\n   •   growth in employee wages.**"
