  title_ru: Регламент обязательств сотрудников Dim Kava Georgia для стабильной и качественной
    работы компании Dim Kava Georgia **
  content_ru: "**Регламент обязательств сотрудников Dim Kava Georgia для стабильной\
    \ и качественной работы компании Dim Kava Georgia **\n(помощи коллегам и работе\
    \ в не стандартных ситуациях)\n\n**Цель:** Обеспечить стабильную работу компании\
    \ в целом, слаженную работу команды и поддержку компании в экстренных или нестандартных\
    \ ситуациях, гарантируя при этом прозрачные условия оплаты.\n\n⸻\n\n**1. Общие\
    \ положения**\n\n1.1. Все сотрудники компании обязаны оказывать помощь коллегам\
    \ в **чрезвычайных или критических ситуациях**, когда это необходимо для поддержания\
    \ работы компании или оказания помощи другим сотрудникам.\n\n1.2. Чрезвычайная\
    \ или критическая ситуация может включать, но не ограничивается:\n • отсутствие\
    \ коллеги из-за болезни или чрезвычайного события;\n • необходимость срочного\
    \ выполнения задач для поддержания работы филиала;\n • непредвиденные производственные\
    \ или организационные ситуации.\n\n⸻\n\n**2. Обязанности сотрудников**\n\n2.1.\
    \ Сотрудник обязан быть готовым:\n • временно заменить коллегу на его позиции;\n\
    \ • оказать помощь в выполнении его рабочих обязанностей;\n • при необходимости\
    \ временно работать в другом филиале компании.\n\n2.2. Переработка, связанная\
    \ с оказанием помощи, является **оплачиваемой**, согласно действующему трудовому\
    \ законодательству и внутренним правилам компании.\n\n2.3. В случае помощи другим\
    \ сотрудникам или работы в другом филиале:\n • время работы фиксируется в графике\
    \ и уведомляем об этом менеджера пр персоналу;\n • начисляется оплата за переработку\
    \ в соответствии с внутренними ставками компании или действующим законодательством.\n\
    \n⸻\n\n**3. Процедура уведомления и согласования**\n\n3.1. При необходимости оказания\
    \ помощи сотрудник уведомляется руководителем заранее, если ситуация позволяет.\n\
    \n3.2. В срочных ситуациях, когда невозможно заранее уведомить сотрудника, помощь\
    \ считается **обязанностью по внутреннему регламенту**, с последующим фиксированием\
    \ времени.\n\n3.3. Все случаи временного перевода в другой филиал согласуются\
    \ с HR и непосредственным руководителем.\n\n⸻\n\n**4. Исключения**\n\n4.1. Сотрудник\
    \ может быть освобожден от оказания помощи только при наличии уважительных причин\
    \ (болезнь при предоставлении документа , декрет и т.д.).\n\n4.2. Любые исключения\
    \ фиксируются письменно и утверждаются руководством.\n\n⸻\n\n**5. Ответственность**\n\
    \n5.1. Несоблюдение данного регламента считается нарушением внутренних правил\
    \ компании и может повлечь дисциплинарные меры, включая предупреждение или штрафные\
    \ санкции, в пределах, установленных законодательством."
  title_ka: Dim Kava Georgia-ს თანამშრომელთა ვალდებულებების რეგლამენტი**
  content_ka: '**📍 Dim Kava Georgia-ს თანამშრომელთა ვალდებულებების რეგლამენტი**


    **კომპანიის სტაბილური და ხარისხიანი მუშაობის უზრუნველსაყოფად**

    (კოლეგების დახმარება და არასტანდარტულ სიტუაციებში მოქმედება)


    ⸻


    **მიზანი:**


    კომპანიის სტაბილური მუშაობის უზრუნველყოფა, გუნდის კოორდინირებული მუშაობა და კრიტიკულ
    ან არასტანდარტულ სიტუაციებში კომპანიის მხარდაჭერა, ამავდროულად ანაზღაურების გამჭვირვალე
    პირობების შენარჩუნებით.


    ⸻


    **1. ზოგადი დებულებები**


    **1.1.** კომპანიის ყველა თანამშრომელი ვალდებულია დაეხმაროს კოლეგებს საგანგებო
    ან კრიტიკულ სიტუაციებში, როდესაც ეს აუცილებელია კომპანიის მუშაობის შესანარჩუნებლად
    ან სხვა თანამშრომლის დასახმარებლად.


    **1.2.** საგანგებო ან კრიტიკული სიტუაციები შეიძლება მოიცავდეს, მაგრამ არ შემოიფარგლება:


    კოლეგის არყოფნა ავადმყოფობის ან საგანგებო შემთხვევის გამო;

    ფილიალის მუშაობის შესანარჩუნებლად სასწრაფო დავალებების შესრულების აუცილებლობა;

    მოულოდნელი საწარმოო ან ორგანიზაციული სიტუაციები.


    ⸻


    **2. თანამშრომელთა ვალდებულებები**


    **2.1.** თანამშრომელი ვალდებულია იყოს მზად:


    დროებით შეცვალოს კოლეგა მის პოზიციაზე;

    დაეხმაროს მისი სამუშაო მოვალეობების შესრულებაში;

    საჭიროების შემთხვევაში დროებით იმუშაოს კომპანიის სხვა ფილიალში.


    **2.2.** დახმარებასთან დაკავშირებული დამატებითი სამუშაო დრო ანაზღაურებადია მოქმედი
    შრომის კანონმდებლობისა და კომპანიის შიდა წესების შესაბამისად.


    **2.3.** სხვა თანამშრომლების დახმარების ან სხვა ფილიალში მუშაობის შემთხვევაში:


    სამუშაო დრო ფიქსირდება გრაფიკში და ეცნობება პერსონალის მენეჯერს;

    დამატებითი სამუშაო დრო ანაზღაურდება კომპანიის შიდა ტარიფების ან მოქმედი კანონმდებლობის
    შესაბამისად.


    ⸻


    **3. შეტყობინებისა და შეთანხმების პროცედურა**


    **3.1.** საჭიროების შემთხვევაში თანამშრომელს წინასწარ ეცნობება ხელმძღვანელის მიერ,
    თუ სიტუაცია ამის საშუალებას იძლევა.


    **3.2.** გადაუდებელ შემთხვევებში, როდესაც წინასწარი შეტყობინება შეუძლებელია, დახმარება
    ითვლება შიდა რეგლამენტის ვალდებულებად, ხოლო დრო შემდგომში ფიქსირდება.


    **3.3.** დროებითი გადაყვანის ყველა შემთხვევა სხვა ფილიალში შეთანხმდება HR-თან
    და უშუალო ხელმძღვანელთან.


    ⸻


    **4. გამონაკლისები**


    **4.1.** თანამშრომელი შეიძლება გათავისუფლდეს დახმარების ვალდებულებისგან მხოლოდ
    დასაბუთებული მიზეზების შემთხვევაში (ავადმყოფობა შესაბამისი დოკუმენტით, დეკრეტული
    შვებულება და ა.შ.).


    **4.2.** ყველა გამონაკლისი ფიქსირდება წერილობით და დასტურდება ხელმძღვანელობის
    მიერ.


    ⸻


    **5. პასუხისმგებლობა**


    **5.1.** აღნიშნული რეგლამენტის შეუსრულებლობა ითვლება კომპანიის შიდა წესების დარღვევად
    და შეიძლება გამოიწვიოს დისციპლინური ზომები, მათ შორის გაფრთხილება ან სანქციები,
    მოქმედი კანონმდებლობის ფარგლებში.'
  title_en: Regulations on Employee Obligations at Dim Kava Georgia for Stable and
    Quality Operation of Dim Kava Georgia **
  content_en: "**Regulations on Employee Obligations at Dim Kava Georgia for Stable\
    \ and Quality Operation of Dim Kava Georgia **\n(assisting colleagues and working\
    \ in non-standard situations)\n\n**Purpose:** To ensure stable operation of the\
    \ company as a whole, coordinated teamwork and company support in emergency or\
    \ non-standard situations, while guaranteeing transparent payment terms.\n\n⸻\n\
    \n**1. General Provisions**\n\n1.1. All company employees are obliged to assist\
    \ colleagues in **emergency or critical situations** when this is necessary to\
    \ maintain company operations or to help other employees.\n\n1.2. An emergency\
    \ or critical situation may include, but is not limited to:\n • absence of a colleague\
    \ due to illness or emergency event;\n • need for urgent task completion to maintain\
    \ branch operations;\n • unforeseen production or organizational situations.\n\
    \n⸻\n\n**2. Employee Duties**\n\n2.1. An employee must be prepared to:\n • temporarily\
    \ replace a colleague in their position;\n • assist in performing their work duties;\n\
    \ • if necessary, temporarily work at another company branch.\n\n2.2. Overtime\
    \ related to providing assistance is **paid**, in accordance with applicable labor\
    \ legislation and internal company rules.\n\n2.3. In case of assisting other employees\
    \ or working at another branch:\n • working time is recorded in the schedule and\
    \ the HR manager is notified;\n • overtime pay is calculated in accordance with\
    \ internal company rates or applicable legislation.\n\n⸻\n\n**3. Notification\
    \ and Approval Procedure**\n\n3.1. When assistance is needed, the employee is\
    \ notified by the manager in advance, if the situation allows.\n\n3.2. In urgent\
    \ situations when it is impossible to notify the employee in advance, assistance\
    \ is considered an **obligation under internal regulations**, with subsequent\
    \ recording of time.\n\n3.3. All cases of temporary transfer to another branch\
    \ are coordinated with HR and the direct manager.\n\n⸻\n\n**4. Exceptions**\n\n\
    4.1. An employee may be exempt from providing assistance only for valid reasons\
    \ (illness with documentation provided, maternity leave, etc.).\n\n4.2. Any exceptions\
    \ are recorded in writing and approved by management.\n\n⸻\n\n**5. Responsibility**\n\
    \n5.1. Failure to comply with these regulations is considered a violation of internal\
    \ company rules and may result in disciplinary measures, including a warning or\
    \ penalties, within limits established by law."
