  title_en: Регламент предоставления скидок на кофейное оборудование
  content_en: "**Регламент предоставления скидок на кофейное оборудование\n\nDim Kava\
    \ Georgia\n\n1. Общие положения\n\nНастоящий регламент устанавливает порядок действий\
    \ сотрудников сети Dim Kava Georgia при предоставлении скидок на кофейное оборудование\
    \ (КО) клиентам.\n\n2. Основные правила\n** 1. **Замена скидки на подарок.\nПри\
    \ обращении клиента с просьбой о скидке сотрудник в первую очередь предлагает\
    \ альтернативу — подарок (кофе, Caotina, аксессуары) в пределах 5% от стоимости\
    \ кофеварки.\n** 2. **Скидка без согласования.\nМенеджер на торговой точке вправе\
    \ самостоятельно предоставить скидку на кофейное оборудование в размере до 5%.\n\
    ** 3. **Скидка свыше 5%.\nВ нестандартных ситуациях предоставление скидки более\
    \ 5% возможно только по согласованию со старшим менеджером или руководителем отдела\
    \ продаж.\n** 4. **Обязательная продажа сопутствующих товаров.\nПри продаже кофейного\
    \ оборудования со скидкой менеджер обязан предложить и реализовать сопутствующие\
    \ товары (кофе, Caotina, аксессуары).\n** 5. **Максимальный подарок.\nПри предоставлении\
    \ скидки максимальный допустимый подарок — 0,250 кг кофе (бленд).\n** 6. **Цена\
    \ с сайта.\n • Если клиент пришёл с сайта Dim Kava — продажа осуществляется по\
    \ цене, указанной на сайте.\n • Если клиент ссылается на сторонний сайт — продажа\
    \ возможна только по согласованию со старшим менеджером или руководителем отдела\
    \ продаж.\n** 7. **Влияние на бонусы.\nПредоставленная скидка может отразит**ь**ся\
    \ на размере бонусной части сотрудника за продажу кофейного оборудования.\n**\
    \ 8. **Скидки на кофемолки и вспениватели.\nМаксимальный размер скидки — 5%.**"
