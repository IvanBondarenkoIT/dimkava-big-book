  title_en: Регламент по доставке товара!!!
  content_en: "\U0001F4CDРегламент по доставке товара!!!\nЛогист , по накладной с\
    \ офиса ( Регина) из гранита, собирает товар на складе и только после внесения\
    \ транспортной накладной в RSG , (выписанной Лидой или Тамуной) может выезжать\
    \ по адресу доставки( или для клиентов офиса или на наши торговые точки) Товар\
    \ должен быт проверен по количеству , по целостности коробок ( не битых и не испорченных)\
    \ посуда - целая( не битая), сроки годности товара -хорошие .\nДоставка товара\
    \ на любые объекты - только строго по накладной( частным клиентам с выпиской в\
    \ RSG) на торговые точки Dom Kava - с 2 внутренними накладными, 1 остается у сотрудников\
    \ для сверки, 2 забирает с собой с подписью сотрудника, который принимал товар(\
    \ что он взял на себя ответственность за полученный товар)\nЕсли товар логист\
    \ привез без накладной - сотрудник вправе не принимать товар.\n\n\U0001F4CDштраф\
    \ 20 лари за доставку товара без внутренней накладной)\n\n\U0001F4CDШтраф от государства\
    \ оплачивает сотрудник , который выехал с товаром без транспортной накладной!!!(500\
    \ лари)\n/////\n\U0001F4CDТовар - отправляемый службой доставки , тоже в \nобязательном\
    \ порядке вносим в RSG!!!"
