  title_en: Регламент по продаже кофейного оборудования в компании “Dim Kava Georgia”**
  content_en: "**Регламент по продаже кофейного оборудования в компании “Dim Kava\
    \ Georgia”**\n\n**1. Общие положения**\n\n1.1. Настоящий регламент определяет\
    \ правила и порядок реализации кофейного оборудования (кофемашин, аксессуаров)\
    \ в торговых точках «Dim Kava».\n\n1.2. Цель регламента — обеспечение корректности\
    \ продаж, исключение ошибок при комплектации и выдаче оборудования, а также поддержание\
    \ высокого уровня сервиса для клиентов.\n\n1.3. Все сотрудники обязаны строго\
    \ следовать настоящему регламенту.\n\n\n**2. Продажа оборудования**\n\n2.1. Перед\
    \ продажей сотрудник обязан:\n • уточнить у клиента модель и характеристики оборудования,\
    \ которые его интересуют;\n • проверить наличие данной модели в базе остатков\
    \ (склад, торговый зал, резерв).\n\n2.2 . Если необходимой модели **нет в наличии**\
    \ в магазине:\n • Сотрудник обязан предложить клиенту альтернативные модели с\
    \ аналогичными характеристиками и ценой.\n • Если клиент заинтересован именно\
    \ в выбранной модели, сотрудник оформляет заказ через **централизованную систему/склад**.\n\
    \n2.3. Выдача оборудования осуществляется строго в **заводской упаковке**, соответствующей\
    \ конкретной модели.\n • Коробка должна быть **новой, неповрежденной, чистой**;\n\
    \ • На коробке должны быть указаны: модель, серийный номер;\n • Коробка должна\
    \ полностью соответствовать продаваемой кофеварке (недопустима замена упаковки).\n\
    \    \n 2.4. Отсутствие коробки на данной точке (например Сити мол, там нет коробок)\n\
    \   •Кофеварку выдаем со склада (менеджер сообщает о продаже офису)\n   •Менеджер\
    \ согласовывает с клиентом о доставке оборудование на дом с нашими ценностями\
    \ ( о времени и доставке тренер договаривается с клиентом, после передачи данных\
    \ клиента)\n• Менеджер записывает данные клиента, номер телефона, адрес и передает\
    \ эти данные тренеру.\n• После ухода клиента менеджер пишет Регине о продаже кофеварки\
    \ и подарочном кофе, просит накладную о перемещении оборудования со склада на\
    \ сити мол и о подарке и проводит продажу в shop seller.\n\n**3. Действия при\
    \ \nотсутствии модели на торговой точке**\n\n3.1. Возможные варианты:\n • **Резервирование**\
    \ товара на складе и доставка в магазин (с указанием сроков клиенту);\n • **Оформление\
    \ предзаказа** и согласование даты получения;\nосуществляется путем выяснения\
    \ наличия у поставщика и сроков поставки от поставщик к нам через менеджеров -\
    \ НИНИ или САЛОМЕ\n • **Перенаправление клиента** в ближайшую торговую точку,\
    \ где данная модель есть в наличии с предварительным подтверждением по телефону\
    \ ( этот способ используем аккуратно, только в случаях, когда клиенту нужно срочно\
    \ и он согласен поехать и забрать на другой точке самостоятельно)\n\n3.2. При\
    \ отсутствии товара во всей сети и у поставщика:\n • Сотрудник фиксирует заявку\
    \ в системе;\n    •    Сотрудник записывает номер клиента и при наличии сообщает\
    \ ему\n • Информирует клиента о сроках возможного поступления (по данным отдела\
    \ закупок).\n\n**4. Проверка перед выдачей товара**\n\n4.1. Перед продажей сотрудник\
    \ обязан:\n\n • СВЕРИТЬ МОДЕЛЬ И СЕРИЙНЫЙ НОМЕР НА ОБОРУДОВАНИИ И НА КОРОБКЕ (УПАКОВКЕ)\
    \ !!!\n\n • Проверить целостность упаковки;\n • При необходимости (по просьбе\
    \ клиента) аккуратно вскрыть коробку и продемонстрировать комплектность (кофемашина,\
    \ кабель, фильтры, другие аксесуары, инструкция, гарантийный талон).\n\n4.2. После\
    \ проверки оборудование **повторно упаковывается в заводскую коробку**.\n\n**5.\
    \ Документы и гарантия**\n\n5.1. К каждой кофемашине прилагаются:\n • чек;\n •\
    \ гарантийный талон с печатью/штампом магазина;\n • инструкция.\n\n5.2. При продаже\
    \ необходимо внести данные о модели и серийном номере в гарантийный талон.\n\n\
    **6. Ответственность**\n\nНесоблюдение требований (выдача оборудования без оригинальной\
    \ коробки, неверная комплектация без согласования влечет дисциплинарную ответственность.\n\
    \n**7. Дополнительные положения**\n • Продажа оборудования «без коробки» или в\
    \ несоответствующей упаковке **строго запрещена**.\n • В исключительных случаях\
    \ (демонстрационные модели) продажа возможна только с письменного разрешения управляющего\
    \ сети и с обязательной скидкой, фиксируемой в системе.\n\n8. Отправить контактные\
    \ данные, имя, что купил и на каких условиях менеджеру Интернет магазина DimKava\
    \ !!!"
