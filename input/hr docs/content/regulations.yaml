  title_ru: Регламент по расходу одноразовых стаканов
  content_ru: "**Регламент по расходу одноразовых стаканов\n\nКомпания: Dim Kava\n\
    Дата вступления в силу: 1 августа 2025 года\nДействует на всех торговых точках\
    \ компании\n**\n⸻\n**\n1. Общие положения\n\nС 01.08.2025 года вводится новый\
    \ регламент по контролю расхода одноразовых стаканов с целью оптимизации расходов\
    \ и предотвращения необоснованных потерь.\n**\n⸻\n**\n2. Норматив расчёта расхода\
    \ стаканов\n\nРасход стаканов в месяц определяется по следующей формуле:\n\nОбоснованный\
    \ расход =\nКоличество проданных напитков + бонусных стаканов + акционных + “Мы”\n\
    + допустимая погрешность в 10% от общей суммы вышеуказанных позиций.\n\nПример\
    \ расчета:\n • Продано: 500 стаканов\n • Бонусных: 100 стаканов\n • Акционных:\
    \ 30 стаканов\n • “Мы”: 100 стаканов\n • Итого: 730 стаканов\n • Допустимая погрешность\
    \ (10%): 73 стакана\n • Максимально допустимый расход: 803 стакана в месяц\n\n\
    Расход выше 803 стаканов будет считаться необоснованным и квалифицироваться как\
    \ недостача.\n**\n⸻\n**\n3. Ответственность\n\nЕсли фактическое количество израсходованных\
    \ одноразовых стаканов превышает норматив (включая допустимую погрешность), разница\
    \ будет считаться недостачей и стоимость излишне потраченных стаканов будет удержана\
    \ из заработной платы ответственного сотрудника или смены.\n**\n⸻\n**\n4. Особые\
    \ положения (пример на Палиашвили)\n\nЗа период с 01.01.2025 года на точке Палиашвили:\n\
    \ • Продано с бонусными: 2287 стаканов\n • Списано на “Мы”: 2000 стаканов\n •\
    \ Итого по регламенту: 4287 стаканов\n • Фактически израсходовано: 4900 стаканов\n\
    \ • Перерасход: 613 стаканов\n • Стоимость перерасхода: 500 лари\n\nВ связи с\
    \ этим, для данной точки с 01.08.2025 года также вводится строгий контроль:\n\
    Расход не должен превышать сумму проданных + бонусных стаканов более чем на 10%.\n\
    Превышение будет расцениваться как недостача с удержанием стоимости.\n**\n⸻\n\
    **\n5. Цель регламента\n • Сократить необоснованные расходы\n • Повысить ответственность\
    \ персонала\n • Сохранить прозрачность и эффективность использования ресурсов\n\
    **\n⸻\n**\nУбедительно просим всех сотрудников соблюдать данные нормы и не допускать\
    \ перерасхода.\n\nС уважением,\nАдминистрация компании Dim Kava**"
  title_ka: ერთჯერადი ჭიქების ხარჯვის რეგლამენტი
  content_ka: "ერთჯერადი ჭიქების ხარჯვის რეგლამენტი\n\nკომპანია: Dim Kava\nძალაში\
    \ შესვლის თარიღი: 2025 წლის 1 აგვისტო\nვრცელდება კომპანიის ყველა სავაჭრო ობიექტზე\n\
    1. ზოგადი მდგომარეობა\n01.08.2025 წლიდან ამოქმედდება ერთჯერადი ჭიქების ხარჯვის\
    \ კონტროლის ახალი რეგლამენტი, რომლის მიზანია ხარჯების ოპტიმიზაცია და გაუმართლებელი\
    \ დანაკარგების პრევენცია.\n2. ჭიქების ხარჯვის ნორმატივი\nთვეში ჭიქების ხარჯვის\
    \ ნორმა განისაზღვრება შემდეგი ფორმულით:\nგამართლებული დანახარჯი\nგაყიდული სასმელების\
    \ რაოდენობა + საბონუსე ყავებზე  გაცემული ჭიქები + აქციებში გამოყენებული + „ჩვენ“\n\
    \ • დასაშვები ცდომილება — ზემოთ აღნიშნული პოზიციების 10% - ია.\nგამოთვლის მაგალითი:\n\
    • გაყიდულია: 500 ჭიქა\n• საბონუსე ყავებზე გაცემული ჭიქები: 100 ჭიქა\n• აქციებში\
    \ გამოყენებულია: 30 ჭიქა\n• „ჩვენ“: 100 ჭიქა\n• ჯამი: 730 ჭიქა\n• დასაშვები ცდომილება\
    \ (10%): 73 ჭიქა\n• მაქსიმალურად დასაშვები ხარჯი: 803 ჭიქა თვეში\n803 ჭიქაზე მეტი\
    \ ხარჯი ჩაითვლება გაუმართლებლად და განისაზღვრება, როგორც დანაკლისი.\n\n3. პასუხისმგებლობა\n\
    \nთუ ერთჯერადი ჭიქების ფაქტობრივი ხარჯვა გადააჭარბებს ნორმას (მათ შორის დასაშვებ\
    \ ცდომილებას), განსხვავება ჩაითვლება დანაკლისად და ზედმეტად დახარჯული ჭიქების\
    \ ღირებულება  ჩამოიჭრება ობიექტზე პასუხისმგებელი თანამშრომლების ხელფასიდან.\n\n\
    4. საგანგაშო მდგომარეობის მაგალითი ერთ ერთი კუთხიდან!!!\n\nპერიოდში 01.01.2025\
    \ წლიდან ობიექტზე:\n• გაყიდული + ბონუსად გაცემული: 2287 ჭიქა\n• „ჩვენ“: 2000 ჭიქა\n\
    • რეგლამენტის მიხედვით ჯამი: 4287 ჭიქა\n• ფაქტობრივი ხარჯი: 4900 ჭიქა\n• ზედმეტი\
    \ ხარჯვა: 613 ჭიქა\n• ზედმეტი ხარჯვის ღირებულება: 500 ლარი\n\nამ მიზეზით, აღნიშნულ\
    \ ობიექტებზე 01.08.2025 წლიდან ამოქმედდება მკაცრი კონტროლი:\nდახარჯული არ უნდა\
    \ აღემატებოდეს გაყიდულს + ბონუსად გაცემული ჭიქების ჯამს + აქციებში გამოყენებული\
    \ + „ჩვენ“\nზედმეტი ხარჯი ჩაითვლება დანაკლისად და მისი ღირებულება ჩამოიჭრება ობიექტზე\
    \ პასუხისმგებელი პირების ხელფასიდან.\n\n5. რეგლამენტის მიზნები\n• გაუმართლებელი\
    \ ხარჯების შემცირება\n• პერსონალის პასუხისმგებლობის ამაღლება\n• რესურსების გამოყენების\
    \ გამჭვირვალობისა და ეფექტიანობის უზრუნველყოფა\nგთხოვთ, ყველა თანამშრომელმა დაიცვას\
    \ აღნიშნული ნორმები და არ დაუშვას ზედმეტი დანახარჯი.\n\nპატივისცემით,\nDim Kava-ს\
    \ ადმინისტრაცია"
  title_en: Regulations on Disposable Cup Usage
  content_en: "**Regulations on Disposable Cup Usage\n\nCompany: Dim Kava\nEffective\
    \ date: August 1, 2025\nApplies to all company retail locations\n**\n⸻\n**\n1.\
    \ General Provisions\n\nAs of 08/01/2025, new regulations for controlling disposable\
    \ cup usage are introduced to optimize expenses and prevent unjustified losses.\n\
    **\n⸻\n**\n2. Cup Usage Calculation Standard\n\nMonthly cup usage is determined\
    \ by the following formula:\n\nJustified usage =\nNumber of drinks sold + bonus\
    \ cups + promotional + \"We\"\n+ allowable margin of 10% of the total of the above\
    \ items.\n\nCalculation example:\n • Sold: 500 cups\n • Bonus: 100 cups\n • Promotional:\
    \ 30 cups\n • \"We\": 100 cups\n • Total: 730 cups\n • Allowable margin (10%):\
    \ 73 cups\n • Maximum allowable usage: 803 cups per month\n\nUsage above 803 cups\
    \ will be considered unjustified and classified as a shortage.\n**\n⸻\n**\n3.\
    \ Responsibility\n\nIf the actual number of disposable cups used exceeds the standard\
    \ (including the allowable margin), the difference will be considered a shortage\
    \ and the cost of excessively used cups will be deducted from the responsible\
    \ employee's or shift's wages.\n**\n⸻\n**\n4. Special Provisions (Paliashvili\
    \ example)\n\nFor the period from 01/01/2025 at the Paliashvili location:\n •\
    \ Sold with bonus: 2287 cups\n • Written off as \"We\": 2000 cups\n • Total per\
    \ regulations: 4287 cups\n • Actually used: 4900 cups\n • Overuse: 613 cups\n\
    \ • Cost of overuse: 500 lari\n\nIn connection with this, for this location as\
    \ of 08/01/2025, strict control is also introduced:\nUsage must not exceed sold\
    \ + bonus cups by more than 10%.\nExceeding will be treated as a shortage with\
    \ cost deduction.\n**\n⸻\n**\n5. Purpose of the Regulations\n • Reduce unjustified\
    \ expenses\n • Increase staff accountability\n • Maintain transparency and efficient\
    \ use of resources\n**\n⸻\n**\nWe kindly ask all employees to comply with these\
    \ standards and avoid overuse.\n\nSincerely,\nDim Kava Company Administration**"
