  title_en: ერთჯერადი ჭიქების ხარჯვის რეგლამენტი**
  content_en: '**📍 ერთჯერადი ჭიქების ხარჯვის რეგლამენტი**


    **კომპანია:** Dim Kava

    **ძალაში შესვლის თარიღი:** 2025 წლის 1 აგვისტო

    ვრცელდება კომპანიის ყველა სავაჭრო ობიექტზე


    **1. ზოგადი დებულებები**


    2025 წლის 01.08-დან ძალაში შედის ახალი რეგლამენტი ერთჯერადი ჭიქების ხარჯვის კონტროლის
    შესახებ,

    რომლის მიზანია ხარჯების ოპტიმიზაცია და გაუმართლებელი დანაკარგების პრევენცია.


    **2. ჭიქების ხარჯვის ნორმატივი**


    ჭიქების თვიური ხარჯი განისაზღვრება შემდეგი ფორმულით:


    **დასაბუთებული ხარჯი =**

    გაყიდული სასმელები + ბონუს ჭიქები + აქციური ჭიქები + „ჩვენ“


    დასაშვები ცდომილება 10% ზემოთ აღნიშნული პოზიციების ჯამიდან


    **მაგალითი:**


    გაყიდული: 500 ჭიქა

    ბონუსი: 100 ჭიქა

    აქცია: 30 ჭიქა

    „ჩვენ“: 100 ჭიქა


    **ჯამი:** 730 ჭიქა

    **დასაშვები ცდომილება (10%):** 73 ჭიქა

    **მაქსიმალური დასაშვები ხარჯი:** 803 ჭიქა თვეში


    803 ჭიქაზე მეტი ხარჯი ჩაითვლება გაუმართლებლად და დეფიციტად.



    **3. პასუხისმგებლობა**


    თუ ფაქტობრივი ერთჯერადი ჭიქების ხარჯი გადააჭარბებს ნორმატივს (ცდომილების ჩათვლით),

    განსხვავება ჩაითვლება დეფიციტად და ჭარბად დახარჯული ჭიქების ღირებულება დაიკავება
    პასუხისმგებელი თანამშრომლის ან ცვლის ხელფასიდან.



    **4. განსაკუთრებული პირობები (მაგალითი პალიაშვილზე)**


    2025 წლის 01.01-დან პალიაშვილის ობიექტზე:


    გაყიდული ბონუსთან ერთად: 2287 ჭიქა

    „ჩვენ“-ზე ჩამოწერილი: 2000 ჭიქა

    რეგლამენტის მიხედვით ჯამი: 4287 ჭიქა

    ფაქტობრივი ხარჯი: 4900 ჭიქა

    გადახარჯვა: 613 ჭიქა

    გადახარჯვის ღირებულება: 500 ლარი


    ამ მიზეზით, 2025 წლის 01.08-დან აღნიშნულ ობიექტზეც ინერგება მკაცრი კონტროლი:

    ხარჯი არ უნდა აღემატებოდეს გაყიდული + ბონუს ჭიქების ჯამს 10%-ზე მეტით.

    გადაჭარბება ჩაითვლება დეფიციტად და გამოიწვევს თანხის დაკავებას.


    **5. რეგლამენტის მიზანი**


    გაუმართლებელი ხარჯების შემცირება

    პერსონალის პასუხისმგებლობის გაზრდა

    რესურსების გამოყენების გამჭვირვალობისა და ეფექტურობის უზრუნველყოფა


    გთხოვთ ყველა თანამშრომელს დაიცვას აღნიშნული წესები და თავიდან აიცილოს გადაჭარბებული
    დანახარჯი.'
