  content_en: "ტერმინალის გაუმართაობის შემთხვევაში მოქმედების რეგლამენტი\n\nკომპანია\
    \ “Dim Kava Georgia”\n\n1. ზოგადი დებულებები\n\n1.1. მოცემული რეგლამენტი ადგენს\
    \ მენეჯერისა და სავაჭრო ობიექტის თანამშრომლების მოქმედების წესს საბანკო ტერმინალის\
    \ გაუმართაობის შემთხვევაში.\n1.2. მიზანია — სავაჭრო ობიექტის შეუფერხებელი მუშაობის\
    \ უზრუნველყოფა, მომხმარებელთა მომსახურებაში შეფერხებების მინიმალიზაცია და მათი\
    \ ლოიალობის შენარჩუნება.\n\n2. მენეჯერის საწყისი მოქმედებები\n\nტერმინალის გაუმართაობის\
    \ აღმოჩენის შემთხვევაში (ტერმინალი არ ირთვება, არ ანხორციელებს გადახდას, იჭედება\
    \ ან აჩვენებს შეცდომას):\n • შეამოწმოს ელექტროენერგია ,კაბელის მდგომარეობა;\n\
    \ • გადაამოწმოს ინტერნეტ-კავშირი;\n • გადატვირთოს ტერმინალი (გამორთვა და ხელახლა\
    \ ჩართვა);\n • სცადოს ტესტური ტრანზაქციის ჩატარება მინიმალურ თანხაზე.\n\n3. თუ\
    \ პრობლემა არ მოგვარდა\n\n3.1. მენეჯერი ვალდებულია:\n • აცნობოს თანამშრომელს,\
    \ რომ დროებით შეუძლებელია ბარათით გადახდა;\n • დაუყოვნებლივ შეატყობინოს შემდეგ\
    \ სუბიექტებს:\n • შესაბამისი ბანკის ტექნიკურ მხარდაჭერას (ცხელი ხაზის ნომრები\
    \ მითითებულია ქვემოთ \U0001F447);\n • უფროს მენეჯერს ან პერსონალის მენეჯერს.\n\
    \n3.2. ბანკში დარეკვისას აუცილებელია მიაწოდოთ ინფორმაცია:\n • ტერმინალის ნომერი\
    \ (მოცემულია ამ ტერმინალის ნებისმიერ ქვითარზე);\n • სავაჭრო ობიექტის დასახელება\
    \ და მისამართი;\n • პრობლემის აღწერა და განხორციელებული ქმედებები (გადატვირთვა,\
    \ ქსელის შემოწმება და სხვ.).\n\n4. მოქმედებები გაუმართაობის პერიოდში\n\n4.1. გადახდის\
    \ მიღება:\n • შესთავაზეთ მომხმარებელს ნაღდი ანგარიშსწორება (თუ ნაღდი თანხის ტერმინალი\
    \ მუშაობს);\n • შესთავაზეთ გადარიცხვა კომპანიის საბანკო ანგარიშზე (საბანკო ანგარიშის\
    \ ნომრები მოცემულია ქვემოთ \U0001F447);\n • თუ მომხმარებელი უარს ამბობს გადარიცხვაზე\
    \ და სურს ნაღდი ანგარიშსწორება, მაგრამ ქვითრის გაცემის გარეშე პროდუქტის გაცემა\
    \ შეუძლებელია — სთხოვეთ, რომ ქვითარი ამოიღოს ჩვენმა სხვა სავაჭრო ობიექტმა, გადაუღოს\
    \ ფოტო და გაუგზავნოს მას.\n • გადაამოწმეთ, შესაძლებელია თუ არა გადახდის განხორციელება\
    \ სხვა ტერმინალით (თუ ობიექტზე რამოდენიმე ტერმინალია).\n\n4.2. თუ ოპერაციის განხორციელება\
    \ შეუძლებელია:\n • ბოდიში მოიხადეთ მომხმარებელთან და აუხსენით სიტუაცია;\n • საჭიროების\
    \ შემთხვევაში, დაარეზერვეთ შეკვეთა ტერმინალის მუშაობის აღდგენამდე.\n\n5. მუშაობის\
    \ აღდგენა\n • გაუმართაობის აღმოფხვრის შემდეგ მენეჯერი ვალდებულია გადაამოწმოს ტერმინალის\
    \ გამართული ფუნქციონირება (ტესტური გადახდა / ტესტური ოპერაციის გაუქმება);\n •\
    \ აცნობოს თანამშრომლებს, რომ ტერმინალი მუშაობს ნორმალურად;\n • შეიტანოს ჩანაწერი\
    \ გაუმართაობათა ჟურნალში (თარიღი, დრო, პრობლემის შინაარსი, გადადგმული ნაბიჯები,\
    \ ბანკთან კომუნიკაცია).\n6. პასუხისმგებლობა\n • სავაჭრო ობიექტის მენეჯერი აგებს\
    \ პასუხს ბანკისა და ხელმძღვანელობის დროულად ინფორმირებაზე;\n • გაუმართაობის უგულებელყოფა\
    \ ან დაგვიანებული ინფორმირება ჩაითვლება რეგლამენტის დარღვევად.\n\nბანკების ცხელი\
