articles:

  - slug: daily-checklist
    section: procedures
    title: "Daily Checklist — Morning to Close"
    title_en: "Daily Checklist — Morning to Close"
    title_ru: "Ежедневный чек-лист — от открытия до закрытия"
    status: published
    content: |
      This checklist covers every task that must be completed each working day,
      from opening to closing. All items are mandatory. The shift is not considered
      complete until every step is done.

      ## Opening (Start of Day)

      1. **Clock in** — Register your card/attendance in the programme at 9:30 or 15:45 (depending on shift).
      2. **Switch on** — Lights, security camera, TV, coffee machine, Shop Seller, Telegram.
      3. **Accept the shift register** — Cash in the till must match the previous evening's Shop Seller balance.
      4. **Open the daily plan file** — Set your personal sales goal for the day. Fill it in at end of shift.

      ## During the Day

      5. **Consumables** — Replenish take-away zone supplies throughout the day. Empty and clean bins.
      6. **Dust** — Wipe dust from all products and shelves.
      7. **Price tags** — Check every product has a price tag that matches the Shop Seller price list.
      8. **Stock control** — Monitor stock levels throughout the day so nothing runs out.
      9. **Client workflow** (always follow this sequence):
         - Greet the client warmly, identify their needs
         - Enter the order in Shop Seller
         - Scan the DK loyalty card
         - Process payment
         - Issue the receipt
         - Prepare the order
      10. **Loyalty card** — Ask every client about their card. Inform about current promotions and competitions.
      11. **Coffee preparation** — Always prepare to standard. No exceptions.
      12. **Latte art** — Apply latte art technique. Send photos of your work to the team Telegram chat.
      13. **Display cleanliness** — Keep display cases, cabinets, fridge, and pastry bowls clean.
      14. **Coffee packaging alignment** — Keep all coffee packaging neat and tidy throughout the day.
      15. **Inventory** — Conduct the daily inventory correctly and completely.

      ## Closing (End of Day)

      16. **Cash register reconciliation** — Fill in the register (granite). Total must match the amount shown in the top-right corner of the register programme.
      17. **Record cash expenses** — Enter all cash expense amounts in Shop Seller with a mandatory description of each item.
      18. **Accounting sheets** — Fill in accounting sheets with Z-reports from all payment terminals at end of day.
      19. **Close the day** — Run the end-of-day close procedure in Shop Seller.
      20. **Clean the coffee machines** — Wash and clean machines, holders, grinder flasks. Clean shelves and floor.
      21. **Secure and lock** — Switch off lights, set the alarm, lock the store according to the security procedure.

      ---
      > **Note:** Steps 16–18 relate to financial reporting and must never be skipped.
      > Discrepancies between the register and Shop Seller must be flagged to the manager immediately.

