  title: Professional Qualification Levels — Dim Kava
  title_en: Professional Qualification Levels — Dim Kava
  title_ru: Уровни профессиональной квалификации — Dim Kava
  status: published
  content: "Dim Kava has a structured qualification system. Every employee starts at the foundation\nlevel and grows through\
    \ demonstrated knowledge and practice. Advancement is confirmed\nby passing the corresponding quiz and manager review.\n\
    \n---\n\n## Qualification Areas\n\n### 1. Coffee Specialist — \"Dim Kava Coffee Expert\"\nKnowledge of coffee from seed\
    \ to cup:\n- Coffee botany and growing conditions\n- History of espresso and its value\n- Espresso preparation technique\
    \ to SCA standards\n- Espresso-based drinks (espresso as the base)\n- Roasting and flavour characteristics by roast level\n\
    - Grinding\n- Alternative preparation methods\n- Which coffee works best with which method\n- Latte art\n\n**Must know:**\n\
    - Coffee tree botany and cultivation\n- Espresso history and value\n- SCA espresso preparation standards\n- All espresso-based\
    \ drinks\n- Roasting levels and their impact on flavour\n- Grinding for each method\n- Alternative brewing methods\n-\
    \ Coffee-method pairing\n- Latte art fundamentals\n\n---\n\n### 2. Sales Techniques\nCore sales skills applied consistently:\n\
    - **Contact** — eye contact, smile, open body language\n- **Needs identification** — asking questions to understand client\
    \ preferences\n- **Presentation** — *\"We carry Swiss-brand coffee...\"* + show packaging + smell\n- **Closing the sale**\
    \ — always sell something; the client does not leave empty-handed\n- **Farewell** — leaves the client wanting to return\n\
    \  > *\"Looking forward to seeing you again! Next time try...\"*\n- **Cross-sale** — offer a complementary product alongside\
    \ the main purchase\n- **Up-sale** — suggest a higher-value option\n- **Key factor:** information transfer → value communication.\n\
    \  The client understands why our product is worth it.\n\n---\n\n### 3. Product Value Communication\nThe ability to articulate\
    \ the value of our products clearly:\n- Know the values and positioning of Dim Kava as a company\n- Know the values of\
    \ each brand we carry (Blaser, Delonghi, Nivona, Melitta, Caotina, etc.)\n- Communicate those values to clients in simple,\
    \ natural language\n\n---\n\n### 4. Checklist Execution\nConsistent fulfilment of all operational checklists:\n- Daily\
    \ checklist (every item, every day)\n- Weekly tasks (chemical cleaning, price check, order, task submission)\n- Monthly\
    \ tasks (deep clean, inventory, expiry check)\n\n---\n\n### 5. Coffee Machine Knowledge\nFor stable equipment sales:\n\
    - Operating principles of manual and automatic machines\n- Components and how they work\n- Delonghi range: key models\
    \ and their features\n- When to recommend manual vs. automatic to a client\n- Basic troubleshooting guidance\n\n---\n\n\
    ### 6. Service Standards\nMastery and consistent application of DK service rules:\n- Greeting and farewell scripts\n-\
    \ Loyalty card — always asked, always explained\n- Up-sale and cross-sale in every interaction\n- Product presentations\
    \ and sensory offers (smell the coffee)\n- Compliance with appearance and behaviour standards\n"
  content_ru: "В Dim Kava действует структурированная система квалификации. Каждый сотрудник начинает с базового уровня\n\
    и растёт через подтверждённые знания и практику. Переход подтверждается\nсдачей соответствующего теста и оценкой менеджера.\n\
    \n---\n\n## Области квалификации\n\n### 1. Coffee Specialist — «эксперт по кофе Dim Kava»\nЗнание кофе от зерна до чашки:\n\
    - Ботаника кофе и условия выращивания\n- История эспрессо и его ценность\n- Техника приготовления эспрессо по стандартам\
    \ SCA\n- Напитки на основе эспрессо (эспрессо как основа)\n- Обжарка и вкусовые характеристики по степени обжарки\n- Помол\n\
    - Альтернативные способы приготовления\n- Какой кофе к какому методу подходит\n- Латте-арт\n\n**Обязательно знать:**\n\
    - Ботанику кофейного дерева и выращивание\n- Историю и ценность эспрессо\n- Стандарты SCA по приготовлению эспрессо\n\
    - Все напитки на основе эспрессо\n- Степени обжарки и влияние на вкус\n- Помол под каждый метод\n- Альтернативные методы\
    \ заваривания\n- Сочетание кофе и метода\n- Основы латте-арта\n\n---\n\n### 2. Техники продаж\nБазовые навыки продаж,\
    \ применяемые последовательно:\n- **Контакт** — зрительный контакт, улыбка, открытая поза\n- **Выявление потребностей**\
    \ — вопросы, чтобы понять предпочтения клиента\n- **Презентация** — *«У нас кофе швейцарского бренда…»* + показать упаковку\
    \ + дать понюхать\n- **Закрытие сделки** — всегда продать что-то; клиент не уходит с пустыми руками\n- **Прощание** —\
    \ клиент хочет вернуться\n  > *«Ждём вас снова! В следующий раз попробуйте…»*\n- **Кросс-продажа** — дополнительный товар\
    \ к основной покупке\n- **Апсейл** — предложение более ценного варианта\n- **Ключевой фактор:** передача информации →\
    \ донесение ценности.\n  Клиент понимает, за что платит.\n\n---\n\n### 3. Донесение ценности продукта\nУмение ясно формулировать\
    \ ценность наших товаров:\n- Знать ценности и позиционирование Dim Kava как компании\n- Знать ценности каждого бренда\
    \ в ассортименте (Blaser, Delonghi, Nivona, Melitta, Caotina и др.)\n- Доносить их до клиентов простым, естественным языком\n\
    \n---\n\n### 4. Выполнение чек-листов\nСтабильное выполнение всех операционных чек-листов:\n- Ежедневный чек-лист (каждый\
    \ пункт, каждый день)\n- Еженедельные задачи (химчистка, проверка цен, заказ, сдача задач)\n- Ежемесячные задачи (глубокая\
    \ чистка, инвентаризация, проверка сроков)\n\n---\n\n### 5. Знание кофемашин\nДля стабильных продаж оборудования:\n- Принципы\
    \ работы ручных и автоматических машин\n- Узлы и их назначение\n- Линейка Delonghi: ключевые модели и особенности\n- Когда\
    \ рекомендовать ручную, когда автоматическую клиенту\n- Базовая помощь при неисправностях\n\n---\n\n### 6. Стандарты обслуживания\n\
    Владение и последовательное применение правил сервиса DK:\n- Скрипты приветствия и прощания\n- Карта лояльности — всегда\
    \ спросить, всегда объяснить\n- Апсейл и кросс-продажа в каждом контакте\n- Презентации товара и сенсорные предложения\
    \ (понюхать кофе)\n- Соблюдение стандартов внешнего вида и поведения\n"
  title_ka: პროფესიული კვალიფიკაციის საფეხურები - დიმ კავა
  content_ka: "დიმ კავას აქვს სტრუქტურირებული საკვალიფიკაციო სისტემა. ყველა თანამშრომელი იწყება ფონდიდან\nდონეზე და იზრდება\
    \ დემონსტრირებული ცოდნისა და პრაქტიკის მეშვეობით. წინსვლა დადასტურებულია\nშესაბამისი ვიქტორინის და მენეჯერის მიმოხილვის\
    \ გავლის გზით.\n\n---\n\n## საკვალიფიკაციო სფეროები\n\n### 1. ყავის სპეციალისტი — „დიმ კავა ყავის ექსპერტი“\nყავის ცოდნა\
    \ თესლიდან ფინჯამდე:\n- ყავის ბოტანიკა და მზარდი პირობები\n- ესპრესოს ისტორია და მისი ღირებულება\n- ესპრესოს მომზადების\
    \ ტექნიკა SCA სტანდარტების შესაბამისად\n- ესპრესოზე დაფუძნებული სასმელები (ესპრესო, როგორც საფუძველი)\n- გამოწვის და გემოს\
    \ მახასიათებლები შემწვარი დონის მიხედვით\n- დაფქვა\n- მომზადების ალტერნატიული მეთოდები\n- რომელი ყავა რომელი მეთოდით მუშაობს\
    \ საუკეთესოდ\n- ლატე არტი\n\n**უნდა იცოდე:**\n- ყავის ხის ბოტანიკა და კულტივირება\n- ესპრესოს ისტორია და ღირებულება\n\
    - SCA ესპრესო მომზადების სტანდარტები\n- ესპრესოზე დაფუძნებული ყველა სასმელი\n- გამოწვის დონე და მათი გავლენა გემოზე\n\
    - დაფქვა თითოეული მეთოდისთვის\n- მოხარშვის ალტერნატიული მეთოდები\n- ყავის მეთოდის დაწყვილება\n- ლატე ხელოვნების საფუძვლები\n\
    \n---\n\n### 2. გაყიდვების ტექნიკა\nგაყიდვების ძირითადი უნარები მუდმივად გამოიყენება:\n- **კონტაქტი** - თვალის კონტაქტი,\
    \ ღიმილი, სხეულის ღია ენა\n- ** საჭიროებს იდენტიფიკაციას ** - დასვით კითხვები კლიენტის პრეფერენციების გასაგებად\n- **პრეზენტაცია**\
    \ — *\"ჩვენ ვატარებთ შვეიცარიული ბრენდის ყავას...\"* + ჩვენება შეფუთვა + სუნი\n- **გაყიდვის დახურვა** — ყოველთვის გაყიდე\
    \ რაღაც; კლიენტი ხელცარიელი არ ტოვებს\n- **მშვიდობით** - კლიენტს უტოვებს დაბრუნების სურვილს\n  > *\"მოუთმენლად ველი თქვენთან\
    \ ხელახლა ნახვას! შემდეგ ჯერზე სცადეთ...\"*\n- **ჯვარედინი გაყიდვა** — შესთავაზეთ დამატებითი პროდუქტი ძირითად შესყიდვასთან\
    \ ერთად\n- **Up-sale** — შემოგვთავაზეთ უფრო მაღალი ღირებულების ვარიანტი\n- **საკვანძო ფაქტორი:** ინფორმაციის გადაცემა\
    \ → ღირებულების კომუნიკაცია.\n  კლიენტს ესმის, რატომ ღირს ჩვენი პროდუქტი.\n\n---\n\n### 3. პროდუქტის ღირებულების კომუნიკაცია\n\
    ჩვენი პროდუქციის ღირებულების ნათლად გამოხატვის უნარი:\n- იცოდე Dim Kava-ს, როგორც კომპანიის ღირებულებები და პოზიციონირება\n\
    - იცოდეთ თითოეული ბრენდის ღირებულებები, რომელსაც ჩვენ ვატარებთ (Blaser, Delonghi, Nivona, Melitta, Caotina და ა.შ.)\n\
    - მიაწოდეთ ეს ღირებულებები კლიენტებს მარტივი, ბუნებრივი ენით\n\n---\n\n### 4. სიის შესრულება\nყველა ოპერატიული სიის თანმიმდევრული\
    \ შესრულება:\n- ყოველდღიური საკონტროლო სია (ყოველი პუნქტი, ყოველდღე)\n- ყოველკვირეული დავალებები (ქიმიური გაწმენდა, ფასის\
    \ შემოწმება, შეკვეთა, დავალების წარდგენა)\n- ყოველთვიური დავალებები (ღრმა გაწმენდა, ინვენტარი, ვადის გასვლის შემოწმება)\n\
    \n---\n\n### 5. ყავის აპარატის ცოდნა\nაღჭურვილობის სტაბილური გაყიდვისთვის:\n- მექანიკური და ავტომატური მანქანების მუშაობის\
    \ პრინციპები\n- კომპონენტები და როგორ მუშაობს ისინი\n- Delonghi დიაპაზონი: ძირითადი მოდელები და მათი მახასიათებლები\n\
    - როდის უნდა ვურჩიოთ კლიენტს მექანიკური და ავტომატური\n- ძირითადი პრობლემების მოგვარების ინსტრუქცია\n\n---\n\n### 6. მომსახურების\
    \ სტანდარტები\nDK სერვისის წესების ოსტატობა და თანმიმდევრული გამოყენება:\n- მისალმებისა და გამოსამშვიდობებელი სკრიპტები\n\
    - ერთგული ბარათი - ყოველთვის ეკითხებოდა, ყოველთვის ხსნიდა\n- გაყიდვები და ჯვარედინი გაყიდვები ყველა ურთიერთქმედებაში\n\
    - პროდუქტის პრეზენტაციები და სენსორული შეთავაზებები (ყავის სუნი)\n- გარეგნობისა და ქცევის სტანდარტების დაცვა"
