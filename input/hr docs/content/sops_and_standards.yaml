  title_en: Job Description — Manager Consultant
  title_ru: Должностная инструкция — менеджер-консультант
  status: published
  content: "## About Dim Kava\n\nDIM KAVA is a network of specialised stores selling Swiss-brand Blaser Café coffee\nand coffee\
    \ equipment from leading Italian manufacturers, with a tasting room and service centre.\nOur mission: to spread espresso\
    \ culture. Our goal: to maintain a leadership position in the coffee business.\n\nThe Manager Consultant is an integral\
    \ part of the Dim Kava team and embodies the\ncompany's core values: **teamwork, competence, leadership, uniqueness, espresso\
    \ culture**.\n\nThe Manager is the face of Dim Kava in Georgia.\n\nThey are a key link in the coffee chain:\n**plantation\
    \ → harvest → processing → roasting → preparation → sale**.\n\n---\n\n## Core Functions\n\n### 1. Sales\nProfessional\
    \ consultation and sale of products in the store. Pre-sale product preparation.\nWe care about every visitor and client.\
    \ Our core goal: introduce them to the quality of\nour products and make their life more enjoyable through what we sell.\n\
    **Active work to increase sales through competence, sales techniques, and client bonus systems.**\n\n### 2. Education\
    \ & Development of the Client\nThe client is part of the Dim Kava community. With every cup, every visit, they learn\n\
    something new about coffee and how to prepare it correctly. We make it interesting.\nClients want to come back. Our clients\
    \ understand coffee varieties and brewing methods.\nThey know what makes our coffee different.\n\n### 3. Self-Improvement\n\
    - Continuously improve sales technique skills.\n- Deepen knowledge of Dim Kava products (how they work, brand history,\
    \ values).\n- Master barista technique and develop latte art skills.\n- Stay current with coffee trends and news.\n- Participate\
    \ in championships and training events.\n- Promote espresso culture.\n\n### 4. Professionalism — \"Building the Dream\"\
    \n- Use sales techniques, promotional programmes, and client offers professionally.\n- Apply every available method to\
    \ hit sales targets.\n- Maintain professional records (inventory, reporting), submit reports on time.\n- Know all products\
    \ in the store and navigate the price list confidently.\n- Communicative, active, and always smiling.\n- Use professional\
    \ coffee vocabulary.\n- Know how to pique a client's interest — **\"plant the seed of a dream\"**.\n- Maintain at least\
    \ Category 1 qualification and continuously grow.\n- Contribute to building a strong team by training new employees.\n\
    \n### 5. Operations\n- Follow store operating standards.\n- Ensure high-quality, active sales through product knowledge,\
    \ sales techniques,\n  cleanliness, quality product range, preparation skills, and professional client consultation.\n\
    - The store (coffee corner) is always clean and welcoming.\n\n---\n\n## Barista Function\nCorrectly prepare drinks according\
    \ to standards. Never serve a sub-standard drink.\nIntroduce clients to different preparation methods. Give professional\
    \ advice on coffee varieties.\n> *Barista philosophy: start a good day with a good cup of coffee.\n> A cup of coffee is\
    \ the beginning of the path to selling coffee in packs — and eventually to selling a coffee machine.*\n\n## Active Sales\
    \ Manager Function\nAn employee who is actively invested in increasing store sales.\nAlways meets the client with energy\
    \ and readiness to help.\n"
  content_ru: "## О Dim Kava\n\nDIM KAVA — сеть специализированных магазинов, где продаётся кофе швейцарского бренда Blaser\
    \ Café\nи кофейное оборудование ведущих итальянских производителей, с дегустационной зоной и сервисным центром.\nНаша\
    \ миссия: распространять эспрессо-культуру. Наша цель: сохранять лидирующие позиции в кофейном бизнесе.\n\nМенеджер-консультант\
    \ — неотъемлемая часть команды Dim Kava и воплощает\nключевые ценности компании: **командность, компетентность, лидерство,\
    \ уникальность, эспрессо-культура**.\n\nМенеджер — лицо Dim Kava в Грузии.\n\nОн — важное звено в кофейной цепочке:\n\
    **плантация → сбор → обработка → обжарка → приготовление → продажа**.\n\n---\n\n## Основные функции\n\n### 1. Продажи\n\
    Профессиональное консультирование и продажа товаров в магазине. Предпродажная подготовка продукции.\nМы заботимся о каждом\
    \ посетителе и клиенте. Главная цель: познакомить их с качеством\nнашей продукции и сделать жизнь приятнее через то, что\
    \ мы продаём.\n**Активная работа по росту продаж через компетентность, техники продаж и бонусные программы для клиентов.**\n\
    \n### 2. Обучение и развитие клиента\nКлиент — часть сообщества Dim Kava. С каждой чашкой и каждым визитом он узнаёт\n\
    что-то новое о кофе и о том, как его правильно готовить. Мы делаем это интересно.\nКлиенты хотят возвращаться. Наши клиенты\
    \ понимают сорта кофе и способы заваривания.\nОни знают, чем наш кофе отличается.\n\n### 3. Саморазвитие\n- Постоянно\
    \ совершенствовать навыки техники продаж.\n- Углублять знания о продукции Dim Kava (как работает, история бренда, ценности).\n\
    - Осваивать бариста-технику и развивать латте-арт.\n- Следить за трендами и новостями в кофе.\n- Участвовать в чемпионатах\
    \ и обучающих мероприятиях.\n- Продвигать эспрессо-культуру.\n\n### 4. Профессионализм — «построение мечты»\n- Профессионально\
    \ использовать техники продаж, акции и предложения для клиентов.\n- Применять все доступные методы для достижения планов\
    \ продаж.\n- Вести профессиональный учёт (инвентаризация, отчётность), сдавать отчёты в срок.\n- Знать весь ассортимент\
    \ магазина и уверенно ориентироваться в прайсе.\n- Быть коммуникабельным, активным и всегда с улыбкой.\n- Использовать\
    \ профессиональную кофейную лексику.\n- Уметь заинтересовать клиента — **«засеять зерно мечты»**.\n- Поддерживать как\
    \ минимум квалификацию категории 1 и постоянно расти.\n- Укреплять команду, обучая новых сотрудников.\n\n### 5. Операции\n\
    - Соблюдать стандарты работы магазина.\n- Обеспечивать качественные активные продажи через знание продукта, техники продаж,\n\
    \  чистоту, ассортимент, навыки приготовления и профессиональное консультирование.\n- Кофейный уголок всегда чистый и\
    \ гостеприимный.\n\n---\n\n## Функция баристы\nПравильно готовить напитки по стандартам. Никогда не подавать напиток ниже\
    \ стандарта.\nЗнакомить клиентов с разными способами приготовления. Давать профессиональные советы по сортам кофе.\n>\
    \ *Философия баристы: начать хороший день с хорошей чашки кофе.\n> Чашка кофе — начало пути к продаже кофе в упаковке\
    \ — и в итоге к продаже кофемашины.*\n\n## Функция активного менеджера по продажам\nСотрудник, который активно вкладывается\
    \ в рост продаж магазина.\nВсегда встречает клиента с энергией и готовностью помочь.\n"
  title_ka: სამუშაოს აღწერა - მენეჯერის კონსულტანტი
  content_ka: "## დიმ კავას შესახებ\n\nDIM KAVA არის სპეციალიზებული მაღაზიების ქსელი, რომელიც ყიდის შვეიცარიული ბრენდის Blaser\
    \ Café ყავას\nდა ყავის აღჭურვილობა წამყვანი იტალიური მწარმოებლებისგან, სადეგუსტაციო ოთახით და სერვის ცენტრით.\nჩვენი მისიაა\
    \ ესპრესო კულტურის გავრცელება. ჩვენი მიზანი: შევინარჩუნოთ ლიდერული პოზიცია ყავის ბიზნესში.\n\nმენეჯერის კონსულტანტი Dim\
    \ Kava-ს გუნდის განუყოფელი ნაწილია და განასახიერებს\nკომპანიის ძირითადი ღირებულებები: **გუნდური მუშაობა, კომპეტენცია,\
    \ ლიდერობა, უნიკალურობა, ესპრესო კულტურა **.\n\nმენეჯერი დიმ კავას სახეა საქართველოში.\n\nისინი ყავის ჯაჭვის მთავარი რგოლია:\n\
    **პლანტაცია → მოსავალი → გადამუშავება → შეწვა → მომზადება → გაყიდვა**.\n\n---\n\n## ძირითადი ფუნქციები\n\n### 1. გაყიდვები\n\
    პროფესიონალური კონსულტაცია და პროდუქციის გაყიდვა მაღაზიაში. წინასწარი გაყიდვის პროდუქტის მომზადება.\nჩვენ ვზრუნავთ თითოეულ\
    \ ვიზიტორზე და კლიენტზე. ჩვენი მთავარი მიზანი: გავაცნოთ მათ ხარისხს\nჩვენი პროდუქცია და მათი ცხოვრება უფრო სასიამოვნოს\
    \ გავხადოთ იმით, რასაც ჩვენ ვყიდით.\n** აქტიური მუშაობა გაყიდვების გაზრდის მიზნით კომპეტენციის, გაყიდვების ტექნიკისა და\
    \ კლიენტის ბონუს სისტემების მეშვეობით.**\n\n### 2. კლიენტის განათლება და განვითარება\nკლიენტი არის Dim Kava საზოგადოების\
    \ ნაწილი. ყოველი თასით, ყოველი ვიზიტით სწავლობენ\nრაღაც ახალი ყავის შესახებ და როგორ მოვამზადოთ ის სწორად. ჩვენ ვაქცევთ\
    \ საინტერესოს.\nკლიენტებს სურთ დაბრუნება. ჩვენს კლიენტებს ესმით ყავის სახეობები და მომზადების მეთოდები.\nმათ იციან, რა\
    \ განასხვავებს ჩვენს ყავას.\n\n### 3. თვითგანვითარება\n- მუდმივად გააუმჯობესეთ გაყიდვების ტექნიკის უნარები.\n- გაიღრმავეთ\
    \ ცოდნა Dim Kava-ს პროდუქციის შესახებ (როგორ მუშაობს ისინი, ბრენდის ისტორია, ღირებულებები).\n- დაეუფლეთ ბარისტას ტექნიკას\
    \ და განავითარეთ ლატე არტის უნარები.\n- იყავით აქტუალური ყავის ტენდენციებითა და სიახლეებით.\n- მონაწილეობა მიიღოთ ჩემპიონატებში\
    \ და ტრენინგებში.\n- ესპრესო კულტურის პოპულარიზაცია.\n\n### 4. პროფესიონალიზმი - \"ოცნების აშენება\"\n- პროფესიონალურად\
    \ გამოიყენეთ გაყიდვების ტექნიკა, სარეკლამო პროგრამები და კლიენტების შეთავაზებები.\n- გამოიყენეთ ყველა ხელმისაწვდომი მეთოდი\
    \ გაყიდვების მიზნების მისაღწევად.\n- პროფესიული ჩანაწერების წარმოება (ინვენტარიზაცია, ანგარიშგება), ანგარიშების დროულად\
    \ წარდგენა.\n- იცოდე მაღაზიაში არსებული ყველა პროდუქტი და თავდაჯერებულად გადახედე ფასების სიას.\n- კომუნიკაბელური, აქტიური\
    \ და ყოველთვის მომღიმარი.\n- გამოიყენეთ პროფესიონალური ყავის ლექსიკა.\n- იცოდე, როგორ გააჩინო კლიენტის ინტერესი - **\"\
    ოცნების თესლი დარგე\"**.\n- შეინარჩუნეთ მინიმუმ 1 კატეგორიის კვალიფიკაცია და მუდმივად გაიზარდეთ.\n- წვლილი შეიტანეთ ძლიერი\
    \ გუნდის შექმნაში ახალი თანამშრომლების მომზადებით.\n\n### 5. ოპერაციები\n- დაიცავით მაღაზიის მუშაობის სტანდარტები.\n-\
    \ უზრუნველყოს მაღალი ხარისხის, აქტიური გაყიდვები პროდუქტის ცოდნის, გაყიდვების ტექნიკის საშუალებით,\n  სისუფთავე, ხარისხის\
    \ პროდუქციის ასორტიმენტი, მომზადების უნარები და პროფესიონალი კლიენტების კონსულტაცია.\n- მაღაზია (ყავის კუთხე) ყოველთვის\
    \ სუფთა და მისასალმებელია.\n\n---\n\n## ბარისტას ფუნქცია\nსწორად მოამზადეთ სასმელები სტანდარტების მიხედვით. არასოდეს მიირთვათ\
    \ არასტანდარტული სასმელი.\nგააცანით კლიენტებს მომზადების სხვადასხვა მეთოდი. მიეცით პროფესიონალური რჩევები ყავის ჯიშებზე.\n\
    > *ბარისტას ფილოსოფია: დაიწყეთ კარგი დღე კარგი ფინჯანი ყავით.\n> ფინჯანი ყავა არის გზის დასაწყისი ყავის შეფუთვით გაყიდვისკენ\
    \ — და საბოლოოდ ყავის აპარატის გაყიდვისკენ.*\n\n## აქტიური გაყიდვების მენეჯერის ფუნქცია\nთანამშრომელი, რომელიც აქტიურად\
    \ არის ჩადებული მაღაზიის გაყიდვების გაზრდაში.\nყოველთვის ენერგიით და დახმარებისთვის მზადყოფნით ხვდება კლიენტს."
