    content_ru: |
      Этот чек-лист охватывает все задачи, которые нужно выполнить каждый рабочий день
      от открытия до закрытия. Все пункты обязательны. Смена не считается завершённой,
      пока не выполнен каждый шаг.

      ## Открытие (начало дня)

      1. **Отметка прихода** — Зарегистрируйте карту/посещаемость в программе в 9:30 или 15:45 (в зависимости от смены).
      2. **Включение** — Свет, камера видеонаблюдения, TV, кофемашина, Shop Seller, Telegram.
      3. **Приём кассовой смены** — Наличные в кассе должны совпадать с вечерним балансом Shop Seller за предыдущий день.
      4. **Откройте файл дневного плана** — Задайте личную цель по продажам на день. Заполните итог в конце смены.

      ## В течение дня

      5. **Расходники** — Пополняйте запасы зоны take-away в течение дня. Опорожняйте и мойте урны.
      6. **Пыль** — Протирайте пыль со всех товаров и полок.
      7. **Ценники** — У каждого товара должен быть ценник, совпадающий с прайсом в Shop Seller.
      8. **Контроль остатков** — Следите за остатками в течение дня, чтобы ничего не закончилось.
      9. **Работа с клиентом** (всегда в такой последовательности):
         - Поприветствуйте клиента, выясните потребности
         - Внесите заказ в Shop Seller
         - Отсканируйте карту лояльности DK
         - Примите оплату
         - Выдайте чек
         - Приготовьте заказ
      10. **Карта лояльности** — Спросите у каждого клиента про карту. Расскажите об акциях и конкурсах.
      11. **Приготовление кофе** — Всегда по стандарту. Без исключений.
      12. **Латте-арт** — Используйте технику латте-арта. Фото работ отправляйте в командный чат Telegram.
      13. **Чистота витрин** — Держите витрины, шкафы, холодильник и подносы с выпечкой в чистоте.
      14. **Выкладка упаковки кофе** — Вся упаковка кофе аккуратна и ровно в течение дня.
      15. **Инвентаризация** — Проведите ежедневную инвентаризацию полностью и корректно.

      ## Закрытие (конец дня)

      16. **Сверка кассы** — Заполните кассу (granite). Итог должен совпадать с суммой в правом верхнем углу программы кассы.
      17. **Учёт расходов наличными** — Внесите все расходы наличными в Shop Seller с обязательным описанием каждой позиции.
      18. **Бухгалтерские листы** — Заполните листы с Z-отчётами со всех терминалов оплаты на конец дня.
      19. **Закрытие дня** — Выполните процедуру закрытия дня в Shop Seller.
      20. **Чистка кофемашин** — Помойте машины, холдеры, бункеры кофемолок. Почистите полки и пол.
      21. **Безопасность** — Выключите свет, включите сигнализацию, заприте магазин по процедуре безопасности.

      ---
      > **Примечание:** шаги 16–18 относятся к финансовой отчётности и не могут быть пропущены.
      > Расхождения между кассой и Shop Seller немедленно сообщайте менеджеру.

  - slug: weekly-checklist
    section: procedures
    title: "Weekly Checklist"
    title_en: "Weekly Checklist"
    title_ru: "Еженедельный чек-лист"
    status: published
    content: |
      Recurring tasks that must be completed on specific days each week.

      | Day | Task |
      |---|---|
      | **Monday** | Review new tasks assigned by the manager |
      | **Monday** | Cross-check all price tags against the current price list |
      | **Monday** | Place the weekly goods order |
      | **Tuesday** | Chemical cleaning of coffee machine + send report to Telegram chat |
      | **Thursday** | Chemical cleaning of coffee machine + send report to Telegram chat |
      | **Friday** | Submit the completed weekly task sheet to the manager |

      ---
      **Chemical cleaning procedure:**
      Run the full chemical cleaning cycle according to the machine manual.
      After completion, take a photo of the cleaning confirmation screen or cycle summary
      and send it to the team Telegram chat with the note "Tuesday/Thursday cleaning done — [store name]".

      **Price tag check (Monday):**
      Go through every product on the shelf. Compare the visible price tag to the current
      price list in Shop Seller. If a discrepancy is found, update the tag immediately.
      If a tag is missing, print and attach one before the store opens.

    content_ru: |
      Задачи, которые нужно выполнять в определённые дни каждой недели.

      | День | Задача |
      |---|---|
      | **Понедельник** | Разобрать новые задачи от менеджера |
      | **Понедельник** | Сверить все ценники с актуальным прайсом |
      | **Понедельник** | Оформить еженедельный заказ товара |
      | **Вторник** | Химчистка кофемашины + отчёт в Telegram |
      | **Четверг** | Химчистка кофемашины + отчёт в Telegram |
      | **Пятница** | Сдать заполненный еженедельный лист задач менеджеру |

      ---
      **Процедура химчистки:**
      Запустите полный цикл химчистки по инструкции к машине.
      После завершения сделайте фото экрана подтверждения или итогов цикла
      и отправьте в командный чат Telegram с пометкой «Химчистка вторник/четверг — [название точки]».

      **Проверка ценников (понедельник):**
      Пройдите все товары на полке. Сравните ценник с текущим прайсом в Shop Seller.
      При расхождении — сразу обновите ценник. Если ценника нет — распечатайте и прикрепите до открытия.

  - slug: monthly-checklist
    section: procedures
    title: "Monthly Checklist"
    title_en: "Monthly Checklist"
    title_ru: "Ежемесячный чек-лист"
    status: published
    content: |
      Deep maintenance and audit tasks to be completed once per month.
      Schedule these tasks at the end of the month during a quieter period.

      | Task | Notes |
      |---|---|
      | **Clean and wipe display cabinets and shelves** | Wipe all surfaces of the product stand |
      | **Defrost and clean the fridge** | Full defrost, interior cleaning |
      | **Deep clean coffee machine groups with tablet** | Use manufacturer-approved cleaning tablet |
      | **Wash grinder flasks and clean grinder blades** | Remove flasks fully, wash, dry, reattach. Clean blades carefully. |
      | **Check product expiry dates** | Inspect every item on the shelf. Log in the expiry date journal. |
      | **Full inventory** | Complete count of all products. Must be accurate and submitted to manager. |

      ---
      > **Expiry date log:** Use the dedicated expiry journal. Record product name, batch,
      > expiry date, and any action taken (sold, removed, returned to stock).
      > Products approaching expiry must be moved to the front of the display (FIFO rule).

    content_ru: |
      Глубокое обслуживание и контрольные задачи — один раз в месяц.
      Планируйте выполнение в конце месяца в более спокойное время.

      | Задача | Примечания |
      |---|---|
      | **Протереть витрины и полки** | Все поверхности торгового стеллажа |
      | **Разморозить и помыть холодильник** | Полная разморозка, мойка камеры |
      | **Глубокая чистка групп кофемашины таблеткой** | Только одобренное производителем средство |
      | **Помыть бункеры кофемолок и почистить жернова** | Бункеры снять полностью, вымыть, высушить, установить. Жернова — аккуратно. |
      | **Проверить сроки годности** | Каждая позиция на полке. Запись в журнале сроков. |
      | **Полная инвентаризация** | Пересчёт всего товара. Точность и сдача отчёта менеджеру. |

      ---
      > **Журнал сроков годности:** ведите отдельный журнал: наименование, партия,
      > срок годности, действие (продано, снято, возврат на склад).
      > Товары с приближающимся сроком выкладывайте ближе к покупателю (правило FIFO).

  - slug: dk-service-standards
    section: service-standards
    title: "DK Service Standards — Client Interaction Rules"
    title_en: "DK Service Standards — Client Interaction Rules"
    title_ru: "Стандарты сервиса DK — правила общения с клиентом"
    status: published
    content: |
      These are the core standards every Dim Kava employee must follow at all times.
      They define how we present ourselves, talk to clients, and sell our products.
      These are not suggestions — they are the standard.

      ## Presence and Attitude

      - We are always **smiling, making eye contact**, and ready to help with genuine enthusiasm.
      - We **greet every client first** — loud and clear.
      - We address **regular clients by name**.
      - We work in **turbo mode** when the store is busy.

      ## Starting the Conversation

      - From the first moment, we **ask questions**. We identify needs and find out
        their preferences regarding coffee, accessories, and machines.
      - We introduce our coffee simply:
        > "We carry Swiss-roasted coffee — pure varietals like 100% Arabica, 100% Robusta,
        > and blends in different ratios."
      - We **show 3 packages and invite the client to smell them immediately**.
      - We always mention: **specialty beans, hand-picked, highest quality, balanced
        acidity and exceptional aromas**.

      ## Loyalty Card (Every Client, Every Time)

      - Ask about the card **loudly and clearly, with enthusiasm**.
      - Explain the benefits just as clearly.
      - If the client doesn't want a card: *"That's a shame — you're missing out on a lot of bonuses and gifts!"*
      - If the client has a card: **tell them their current bonus balance** and how many
        more cups/packs they need until their next free reward. This drives additional sales.

      ## Cross-Selling and Upselling

      - Client buying **coffee** → offer Caotina. Ask if they've tried it. Show the aroma.
        Explain the difference from regular cocoa.
      - Client buying **a drink** → offer snacks: home-made cookies, Lomba bars
        (gluten-free, sugar-free), Choco Choco chocolates.
        > "We offer these because the client may not know the product exists — if we don't mention it, they won't buy it."
      - Client buying **accessories** → offer coffee. Ask if they've tasted it. Show genuine interest.
      - **Always use** up-sale and cross-sale techniques actively.

      ## During the Sale

      - We **never say "no"**. Instead: *"We have this instead..."*
      - During promotions: find a way to **mention the promotion to every client**.
        A good manager uses promotions as a tool to hit targets.
      - When a client approaches while we're serving another: smile and say *"One moment, please?"*
      - Ask every client if they're following **Dim Kava Georgia on Instagram and Facebook**.

      ## Serving the Drink

      - After preparing: announce the drink — *"Your espresso Lila Rosa! Enjoy!"*
      - Hold the cup from below when handing it over.

      ## Closing and Farewell

      - Close every interaction warmly and clearly:
        > "Have a great day, we look forward to seeing you again! I hope you enjoy it!
        > Next time try [product]... Thank you! Thank you so much!"
      - Do **not** use the expression "АРАПPИЗ" (or any local slang equivalent).

      ## Staying on Track

      - Monitor Telegram during the working day — both on the work computer and on your phone.
      - Throughout the day, actively track progress against the daily sales plan.
      - Discuss results with the manager at the end of the day.

    content_ru: |
      Это базовые стандарты, которым должен следовать каждый сотрудник Dim Kava всегда.
      Они определяют, как мы выглядим, как общаемся с клиентами и как продаём.
      Это не рекомендации — это норма.

      ## Присутствие и настрой

      - Мы всегда **улыбаемся, поддерживаем зрительный контакт** и готовы помочь по-настоящему.
      - Мы **здороваемся с каждым клиентом первыми** — громко и чётко.
      - Мы обращаемся к **постоянным клиентам по имени**.
      - В час пик работаем в **режиме турбо**.

      ## Начало разговора

      - С первых секунд **задаём вопросы**. Выясняем потребности и предпочтения
        по кофе, аксессуарам и технике.
      - Представляем кофе простыми словами:
        > «У нас швейцарская обжарка — моносорта 100% арабика, 100% робуста
        > и бленды в разных пропорциях.»
      - **Показываем три упаковки и сразу предлагаем понюхать.**
      - Всегда упоминаем: **спешелти, ручной сбор, высокое качество, сбалансированная
        кислотность и выразительная ароматика.**

      ## Карта лояльности (каждый клиент, каждый раз)

      - Спрашиваем про карту **громко, чётко и с энтузиазмом**.
      - Объясняем выгоды так же ясно.
      - Если клиент не хочет карту: *«Жаль — вы упускаете много бонусов и подарков!»*
      - Если карта есть: **назовите текущий баланс бонусов** и сколько ещё чашек/упаковок
        до следующего подарка — это стимулирует допродажи.

      ## Допродажи и апсейл

      - Клиент покупает **кофе** → предложите Caotina. Спросите, пробовал ли. Пусть почует аромат.
        Объясните отличие от обычного какао.
      - Клиент покупает **напиток** → предложите снеки: домашнее печенье, батончики Lomba
        (без глютена, без сахара), Choco Choco.
        > «Мы предлагаем это потому что клиент может не знать, что товар есть — если мы не скажем, он не купит.»
      - Клиент покупает **аксессуары** → предложите кофе. Спросите, пробовал ли. Проявите искренний интерес.
      - **Всегда** используйте апсейл и кросс-сейл активно.

      ## Во время продажи

      - Мы **никогда не говорим «нет»**. Вместо этого: *«У нас есть вот это…»*
      - В акции: найдите способ **упомянуть акцию каждому клиенту**.
      - Когда подходит второй клиент: улыбнитесь и скажите *«Одну минуту, пожалуйста?»*
      - Спросите у каждого, подписан ли он на **Dim Kava Georgia в Instagram и Facebook**.

      ## Подача напитка

      - После приготовления объявите напиток: *«Ваш эспрессо Lila Rosa! Приятного!»*
      - Передавайте чашку, держа её снизу.

      ## Завершение и прощание

      - Завершайте тепло и ясно:
        > «Хорошего дня, будем рады видеть снова! Надеюсь, понравится!
        > В следующий раз попробуйте [товар]… Спасибо большое!»
      - Не используйте сленг вроде «араппиз» и аналоги.

      ## Контроль дня

      - Следите за Telegram в течение дня — и с рабочего ПК, и с телефона.
      - Активно отслеживайте выполнение плана продаж.
      - В конце дня обсудите результат с менеджером.

  - slug: job-description-manager-consultant
    section: company-info
    title: "Job Description — Manager Consultant"
    title_en: "Job Description — Manager Consultant"
    title_ru: "Должностная инструкция — менеджер-консультант"
    status: published
    content: |
      ## About Dim Kava

      DIM KAVA is a network of specialised stores selling Swiss-brand Blaser Café coffee
      and coffee equipment from leading Italian manufacturers, with a tasting room and service centre.
      Our mission: to spread espresso culture. Our goal: to maintain a leadership position in the coffee business.

      The Manager Consultant is an integral part of the Dim Kava team and embodies the
      company's core values: **teamwork, competence, leadership, uniqueness, espresso culture**.

      The Manager is the face of Dim Kava in Georgia.

      They are a key link in the coffee chain:
      **plantation → harvest → processing → roasting → preparation → sale**.

      ---

      ## Core Functions

      ### 1. Sales
      Professional consultation and sale of products in the store. Pre-sale product preparation.
      We care about every visitor and client. Our core goal: introduce them to the quality of
      our products and make their life more enjoyable through what we sell.
      **Active work to increase sales through competence, sales techniques, and client bonus systems.**

      ### 2. Education & Development of the Client
      The client is part of the Dim Kava community. With every cup, every visit, they learn
      something new about coffee and how to prepare it correctly. We make it interesting.
      Clients want to come back. Our clients understand coffee varieties and brewing methods.
      They know what makes our coffee different.

      ### 3. Self-Improvement
      - Continuously improve sales technique skills.
      - Deepen knowledge of Dim Kava products (how they work, brand history, values).
      - Master barista technique and develop latte art skills.
      - Stay current with coffee trends and news.
      - Participate in championships and training events.
      - Promote espresso culture.

      ### 4. Professionalism — "Building the Dream"
      - Use sales techniques, promotional programmes, and client offers professionally.
      - Apply every available method to hit sales targets.
      - Maintain professional records (inventory, reporting), submit reports on time.
      - Know all products in the store and navigate the price list confidently.
      - Communicative, active, and always smiling.
      - Use professional coffee vocabulary.
      - Know how to pique a client's interest — **"plant the seed of a dream"**.
      - Maintain at least Category 1 qualification and continuously grow.
      - Contribute to building a strong team by training new employees.

      ### 5. Operations
      - Follow store operating standards.
      - Ensure high-quality, active sales through product knowledge, sales techniques,
        cleanliness, quality product range, preparation skills, and professional client consultation.
      - The store (coffee corner) is always clean and welcoming.

      ---

      ## Barista Function
      Correctly prepare drinks according to standards. Never serve a sub-standard drink.
      Introduce clients to different preparation methods. Give professional advice on coffee varieties.
      > *Barista philosophy: start a good day with a good cup of coffee.
      > A cup of coffee is the beginning of the path to selling coffee in packs — and eventually to selling a coffee machine.*

      ## Active Sales Manager Function
      An employee who is actively invested in increasing store sales.
      Always meets the client with energy and readiness to help.

    content_ru: |
      ## О Dim Kava

      DIM KAVA — сеть специализированных магазинов, где продаётся кофе швейцарского бренда Blaser Café
      и кофейное оборудование ведущих итальянских производителей, с дегустационной зоной и сервисным центром.
      Наша миссия: распространять эспрессо-культуру. Наша цель: сохранять лидирующие позиции в кофейном бизнесе.

      Менеджер-консультант — неотъемлемая часть команды Dim Kava и воплощает
      ключевые ценности компании: **командность, компетентность, лидерство, уникальность, эспрессо-культура**.

      Менеджер — лицо Dim Kava в Грузии.

      Он — важное звено в кофейной цепочке:
      **плантация → сбор → обработка → обжарка → приготовление → продажа**.

      ---

      ## Основные функции

      ### 1. Продажи
      Профессиональное консультирование и продажа товаров в магазине. Предпродажная подготовка продукции.
      Мы заботимся о каждом посетителе и клиенте. Главная цель: познакомить их с качеством
      нашей продукции и сделать жизнь приятнее через то, что мы продаём.
      **Активная работа по росту продаж через компетентность, техники продаж и бонусные программы для клиентов.**

      ### 2. Обучение и развитие клиента
      Клиент — часть сообщества Dim Kava. С каждой чашкой и каждым визитом он узнаёт
      что-то новое о кофе и о том, как его правильно готовить. Мы делаем это интересно.
      Клиенты хотят возвращаться. Наши клиенты понимают сорта кофе и способы заваривания.
      Они знают, чем наш кофе отличается.

      ### 3. Саморазвитие
      - Постоянно совершенствовать навыки техники продаж.
      - Углублять знания о продукции Dim Kava (как работает, история бренда, ценности).
      - Осваивать бариста-технику и развивать латте-арт.
      - Следить за трендами и новостями в кофе.
      - Участвовать в чемпионатах и обучающих мероприятиях.
      - Продвигать эспрессо-культуру.

      ### 4. Профессионализм — «построение мечты»
      - Профессионально использовать техники продаж, акции и предложения для клиентов.
      - Применять все доступные методы для достижения планов продаж.
      - Вести профессиональный учёт (инвентаризация, отчётность), сдавать отчёты в срок.
      - Знать весь ассортимент магазина и уверенно ориентироваться в прайсе.
      - Быть коммуникабельным, активным и всегда с улыбкой.
      - Использовать профессиональную кофейную лексику.
      - Уметь заинтересовать клиента — **«засеять зерно мечты»**.
      - Поддерживать как минимум квалификацию категории 1 и постоянно расти.
      - Укреплять команду, обучая новых сотрудников.

      ### 5. Операции
      - Соблюдать стандарты работы магазина.
      - Обеспечивать качественные активные продажи через знание продукта, техники продаж,
        чистоту, ассортимент, навыки приготовления и профессиональное консультирование.
      - Кофейный уголок всегда чистый и гостеприимный.

      ---

      ## Функция баристы
      Правильно готовить напитки по стандартам. Никогда не подавать напиток ниже стандарта.
      Знакомить клиентов с разными способами приготовления. Давать профессиональные советы по сортам кофе.
      > *Философия баристы: начать хороший день с хорошей чашки кофе.
      > Чашка кофе — начало пути к продаже кофе в упаковке — и в итоге к продаже кофемашины.*

      ## Функция активного менеджера по продажам
      Сотрудник, который активно вкладывается в рост продаж магазина.
      Всегда встречает клиента с энергией и готовностью помочь.

