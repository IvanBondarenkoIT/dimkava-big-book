    content: |
      Dim Kava has a structured qualification system. Every employee starts at the foundation
      level and grows through demonstrated knowledge and practice. Advancement is confirmed
      by passing the corresponding quiz and manager review.

      ---

      ## Qualification Areas

      ### 1. Coffee Specialist — "Dim Kava Coffee Expert"
      Knowledge of coffee from seed to cup:
      - Coffee botany and growing conditions
      - History of espresso and its value
      - Espresso preparation technique to SCA standards
      - Espresso-based drinks (espresso as the base)
      - Roasting and flavour characteristics by roast level
      - Grinding
      - Alternative preparation methods
      - Which coffee works best with which method
      - Latte art

      **Must know:**
      - Coffee tree botany and cultivation
      - Espresso history and value
      - SCA espresso preparation standards
      - All espresso-based drinks
      - Roasting levels and their impact on flavour
      - Grinding for each method
      - Alternative brewing methods
      - Coffee-method pairing
      - Latte art fundamentals

      ---

      ### 2. Sales Techniques
      Core sales skills applied consistently:
      - **Contact** — eye contact, smile, open body language
      - **Needs identification** — asking questions to understand client preferences
      - **Presentation** — *"We carry Swiss-brand coffee..."* + show packaging + smell
      - **Closing the sale** — always sell something; the client does not leave empty-handed
      - **Farewell** — leaves the client wanting to return
        > *"Looking forward to seeing you again! Next time try..."*
      - **Cross-sale** — offer a complementary product alongside the main purchase
      - **Up-sale** — suggest a higher-value option
      - **Key factor:** information transfer → value communication.
        The client understands why our product is worth it.

      ---

      ### 3. Product Value Communication
      The ability to articulate the value of our products clearly:
      - Know the values and positioning of Dim Kava as a company
      - Know the values of each brand we carry (Blaser, Delonghi, Nivona, Melitta, Caotina, etc.)
      - Communicate those values to clients in simple, natural language

      ---

      ### 4. Checklist Execution
      Consistent fulfilment of all operational checklists:
      - Daily checklist (every item, every day)
      - Weekly tasks (chemical cleaning, price check, order, task submission)
      - Monthly tasks (deep clean, inventory, expiry check)

      ---

      ### 5. Coffee Machine Knowledge
      For stable equipment sales:
      - Operating principles of manual and automatic machines
      - Components and how they work
      - Delonghi range: key models and their features
      - When to recommend manual vs. automatic to a client
      - Basic troubleshooting guidance

      ---

      ### 6. Service Standards
      Mastery and consistent application of DK service rules:
      - Greeting and farewell scripts
      - Loyalty card — always asked, always explained
      - Up-sale and cross-sale in every interaction
      - Product presentations and sensory offers (smell the coffee)
      - Compliance with appearance and behaviour standards

    content_ru: |
      В Dim Kava действует структурированная система квалификации. Каждый сотрудник начинает с базового уровня
      и растёт через подтверждённые знания и практику. Переход подтверждается
      сдачей соответствующего теста и оценкой менеджера.

      ---

      ## Области квалификации

      ### 1. Coffee Specialist — «эксперт по кофе Dim Kava»
      Знание кофе от зерна до чашки:
      - Ботаника кофе и условия выращивания
      - История эспрессо и его ценность
      - Техника приготовления эспрессо по стандартам SCA
      - Напитки на основе эспрессо (эспрессо как основа)
      - Обжарка и вкусовые характеристики по степени обжарки
      - Помол
      - Альтернативные способы приготовления
      - Какой кофе к какому методу подходит
      - Латте-арт

      **Обязательно знать:**
      - Ботанику кофейного дерева и выращивание
      - Историю и ценность эспрессо
      - Стандарты SCA по приготовлению эспрессо
      - Все напитки на основе эспрессо
      - Степени обжарки и влияние на вкус
      - Помол под каждый метод
      - Альтернативные методы заваривания
      - Сочетание кофе и метода
      - Основы латте-арта

      ---

      ### 2. Техники продаж
      Базовые навыки продаж, применяемые последовательно:
      - **Контакт** — зрительный контакт, улыбка, открытая поза
      - **Выявление потребностей** — вопросы, чтобы понять предпочтения клиента
      - **Презентация** — *«У нас кофе швейцарского бренда…»* + показать упаковку + дать понюхать
      - **Закрытие сделки** — всегда продать что-то; клиент не уходит с пустыми руками
      - **Прощание** — клиент хочет вернуться
        > *«Ждём вас снова! В следующий раз попробуйте…»*
      - **Кросс-продажа** — дополнительный товар к основной покупке
      - **Апсейл** — предложение более ценного варианта
      - **Ключевой фактор:** передача информации → донесение ценности.
        Клиент понимает, за что платит.

      ---

      ### 3. Донесение ценности продукта
      Умение ясно формулировать ценность наших товаров:
      - Знать ценности и позиционирование Dim Kava как компании
      - Знать ценности каждого бренда в ассортименте (Blaser, Delonghi, Nivona, Melitta, Caotina и др.)
      - Доносить их до клиентов простым, естественным языком

      ---

      ### 4. Выполнение чек-листов
      Стабильное выполнение всех операционных чек-листов:
      - Ежедневный чек-лист (каждый пункт, каждый день)
      - Еженедельные задачи (химчистка, проверка цен, заказ, сдача задач)
      - Ежемесячные задачи (глубокая чистка, инвентаризация, проверка сроков)

      ---

      ### 5. Знание кофемашин
      Для стабильных продаж оборудования:
      - Принципы работы ручных и автоматических машин
      - Узлы и их назначение
      - Линейка Delonghi: ключевые модели и особенности
      - Когда рекомендовать ручную, когда автоматическую клиенту
      - Базовая помощь при неисправностях

      ---

      ### 6. Стандарты обслуживания
      Владение и последовательное применение правил сервиса DK:
      - Скрипты приветствия и прощания
      - Карта лояльности — всегда спросить, всегда объяснить
      - Апсейл и кросс-продажа в каждом контакте
      - Презентации товара и сенсорные предложения (понюхать кофе)
      - Соблюдение стандартов внешнего вида и поведения
