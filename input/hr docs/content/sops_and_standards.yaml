  content_ru: "Этот чек-лист охватывает все задачи, которые нужно выполнить каждый рабочий день\nот открытия до закрытия.\
    \ Все пункты обязательны. Смена не считается завершённой,\nпока не выполнен каждый шаг.\n\n## Открытие (начало дня)\n\n\
    1. **Отметка прихода** — Зарегистрируйте карту/посещаемость в программе в 9:30 или 15:45 (в зависимости от смены).\n2.\
    \ **Включение** — Свет, камера видеонаблюдения, TV, кофемашина, Shop Seller, Telegram.\n3. **Приём кассовой смены** —\
    \ Наличные в кассе должны совпадать с вечерним балансом Shop Seller за предыдущий день.\n4. **Откройте файл дневного плана**\
    \ — Задайте личную цель по продажам на день. Заполните итог в конце смены.\n\n## В течение дня\n\n5. **Расходники** —\
    \ Пополняйте запасы зоны take-away в течение дня. Опорожняйте и мойте урны.\n6. **Пыль** — Протирайте пыль со всех товаров\
    \ и полок.\n7. **Ценники** — У каждого товара должен быть ценник, совпадающий с прайсом в Shop Seller.\n8. **Контроль\
    \ остатков** — Следите за остатками в течение дня, чтобы ничего не закончилось.\n9. **Работа с клиентом** (всегда в такой\
    \ последовательности):\n   - Поприветствуйте клиента, выясните потребности\n   - Внесите заказ в Shop Seller\n   - Отсканируйте\
    \ карту лояльности DK\n   - Примите оплату\n   - Выдайте чек\n   - Приготовьте заказ\n10. **Карта лояльности** — Спросите\
    \ у каждого клиента про карту. Расскажите об акциях и конкурсах.\n11. **Приготовление кофе** — Всегда по стандарту. Без\
    \ исключений.\n12. **Латте-арт** — Используйте технику латте-арта. Фото работ отправляйте в командный чат Telegram.\n\
    13. **Чистота витрин** — Держите витрины, шкафы, холодильник и подносы с выпечкой в чистоте.\n14. **Выкладка упаковки\
    \ кофе** — Вся упаковка кофе аккуратна и ровно в течение дня.\n15. **Инвентаризация** — Проведите ежедневную инвентаризацию\
    \ полностью и корректно.\n\n## Закрытие (конец дня)\n\n16. **Сверка кассы** — Заполните кассу (granite). Итог должен совпадать\
    \ с суммой в правом верхнем углу программы кассы.\n17. **Учёт расходов наличными** — Внесите все расходы наличными в Shop\
    \ Seller с обязательным описанием каждой позиции.\n18. **Бухгалтерские листы** — Заполните листы с Z-отчётами со всех\
    \ терминалов оплаты на конец дня.\n19. **Закрытие дня** — Выполните процедуру закрытия дня в Shop Seller.\n20. **Чистка\
    \ кофемашин** — Помойте машины, холдеры, бункеры кофемолок. Почистите полки и пол.\n21. **Безопасность** — Выключите свет,\
    \ включите сигнализацию, заприте магазин по процедуре безопасности.\n\n---\n> **Примечание:** шаги 16–18 относятся к финансовой\
    \ отчётности и не могут быть пропущены.\n> Расхождения между кассой и Shop Seller немедленно сообщайте менеджеру.\n"
  title_ka: ყოველდღიური საკონტროლო სია - დილიდან დახურვამდე
  content_ka: "ეს ჩამონათვალი მოიცავს ყველა დავალებას, რომელიც უნდა შესრულდეს ყოველ სამუშაო დღეს,\nგახსნიდან დახურვამდე. ყველა\
    \ ელემენტი სავალდებულოა. ცვლა არ განიხილება\nდაასრულეთ ყოველი ნაბიჯის დასრულებამდე.\n\n## გახსნა (დღის დასაწყისი)\n\n\
    1. **Clock in** — დაარეგისტრირეთ თქვენი ბარათი/პროგრამაში დასწრება 9:30 ან 15:45 (ცვლის მიხედვით).\n2. **ჩართეთ ** — განათება,\
    \ უსაფრთხოების კამერა, ტელევიზორი, ყავის აპარატი, მაღაზიის გამყიდველი, ტელეგრამა.\n3. **მიიღეთ ცვლის რეესტრი** — ნაღდი\
    \ ფული უნდა შეესაბამებოდეს წინა საღამოს მაღაზიის გამყიდველის ბალანსს.\n4. **გახსენით ყოველდღიური გეგმის ფაილი** — დააყენეთ\
    \ თქვენი პერსონალური გაყიდვების მიზანი დღისთვის. შეავსეთ იგი ცვლის ბოლოს.\n\n## დღის განმავლობაში\n\n5. **სახარჯი მასალა**\
    \ — შეავსეთ გასატანი ზონის მარაგი მთელი დღის განმავლობაში. ცარიელი და სუფთა ურნები.\n6. **მტვერი** — წაშალეთ მტვერი ყველა\
    \ პროდუქტიდან და თაროდან.\n7. **ფასის ტეგები** — შეამოწმეთ, რომ ყველა პროდუქტს აქვს ფასის ნიშანი, რომელიც შეესაბამება\
    \ მაღაზიის გამყიდველის ფასების სიას.\n8. **საფონდო კონტროლი** — თვალყური ადევნეთ მარაგის დონეს მთელი დღის განმავლობაში,\
    \ რათა არაფერი ამოიწუროს.\n9. **კლიენტის სამუშაო პროცესი ** (ყოველთვის დაიცავით ეს თანმიმდევრობა):\n   - მიესალმე კლიენტს\
    \ თბილად, დაადგინე მათი საჭიროებები\n   - შეიყვანეთ შეკვეთა მაღაზია გამყიდველში\n   - დაასკანირეთ DK ლოიალობის ბარათი\n\
    \   - გადახდის პროცესი\n   - გასცეს ქვითარი\n   - მოამზადე შეკვეთა\n10. **ლოიალობის ბარათი** — ჰკითხეთ თითოეულ კლიენტს\
    \ მათი ბარათის შესახებ. აცნობეთ მიმდინარე აქციებისა და კონკურსების შესახებ.\n11. **ყავის მომზადება** — ყოველთვის მოემზადეთ\
    \ სტანდარტების შესაბამისად. არანაირი გამონაკლისი.\n12. **ლატე არტი** — გამოიყენეთ ლატე არტის ტექნიკა. გაგზავნეთ თქვენი\
    \ სამუშაოს ფოტოები გუნდის Telegram-ის ჩეთში.\n13. **სისუფთავის ჩვენება** — შეინახეთ ვიტრინები, კარადები, მაცივარი და საკონდიტრო\
    \ თასები სუფთად.\n14. **ყავის შეფუთვის გასწორება** — შეინახეთ ყავის ყველა შეფუთვა მოწესრიგებული და მოწესრიგებული მთელი\
    \ დღის განმავლობაში.\n15. **ინვენტარიზაცია** — ყოველდღიური ინვენტარიზაციის ჩატარება სწორად და სრულად.\n\n## დახურვა (დღის\
    \ ბოლოს)\n\n16. **სალარო აპარატის შეჯერება** — რეესტრის შევსება (გრანიტი). ჯამი უნდა შეესაბამებოდეს სარეგისტრაციო პროგრამის\
    \ ზედა მარჯვენა კუთხეში ნაჩვენები თანხას.\n17. **აღრიცხეთ ნაღდი ფულის ხარჯები** — შეიყვანეთ ყველა ფულადი ხარჯის თანხა\
    \ მაღაზია გამყიდველში თითოეული საქონლის სავალდებულო აღწერით.\n18. **სააღრიცხვო ფურცლები** — შეავსეთ სააღრიცხვო ფურცლები\
    \ Z- ანგარიშებით ყველა გადახდის ტერმინალიდან დღის ბოლოს.\n19. **დღის დახურვა** — განახორციელეთ დღის ბოლოს დახურვის პროცედურა\
    \ Shop Seller-ში.\n20. **გაასუფთავეთ ყავის აპარატები** — გარეცხეთ და გაასუფთავეთ მანქანები, დამჭერები, საფქვავი კოლბები.\
    \ გაასუფთავეთ თაროები და იატაკი.\n21. **დაიცავით და ჩაკეტეთ** — გამორთეთ განათება, დააყენეთ მაღვიძარა, ჩაკეტეთ მაღაზია\
    \ უსაფრთხოების პროცედურის მიხედვით.\n\n---\n> **შენიშვნა:** ნაბიჯები 16-18 ეხება ფინანსურ ანგარიშგებას და არასოდეს უნდა\
    \ გამოტოვოთ.\n> რეესტრსა და მაღაზიის გამყიდველს შორის შეუსაბამობები დაუყოვნებლივ უნდა მიეწოდოს მენეჯერს."
- slug: weekly-checklist
  section: procedures
  title: Weekly Checklist
  title_en: Weekly Checklist
  title_ru: Еженедельный чек-лист
  status: published
  content: 'Recurring tasks that must be completed on specific days each week.


    | Day | Task |

    |---|---|

    | **Monday** | Review new tasks assigned by the manager |

    | **Monday** | Cross-check all price tags against the current price list |

    | **Monday** | Place the weekly goods order |

    | **Tuesday** | Chemical cleaning of coffee machine + send report to Telegram chat |

    | **Thursday** | Chemical cleaning of coffee machine + send report to Telegram chat |

    | **Friday** | Submit the completed weekly task sheet to the manager |


    ---

    **Chemical cleaning procedure:**

    Run the full chemical cleaning cycle according to the machine manual.

    After completion, take a photo of the cleaning confirmation screen or cycle summary

    and send it to the team Telegram chat with the note "Tuesday/Thursday cleaning done — [store name]".


    **Price tag check (Monday):**

    Go through every product on the shelf. Compare the visible price tag to the current

    price list in Shop Seller. If a discrepancy is found, update the tag immediately.

    If a tag is missing, print and attach one before the store opens.

    '
  content_ru: 'Задачи, которые нужно выполнять в определённые дни каждой недели.


    | День | Задача |

    |---|---|

    | **Понедельник** | Разобрать новые задачи от менеджера |

    | **Понедельник** | Сверить все ценники с актуальным прайсом |

    | **Понедельник** | Оформить еженедельный заказ товара |

    | **Вторник** | Химчистка кофемашины + отчёт в Telegram |

    | **Четверг** | Химчистка кофемашины + отчёт в Telegram |

    | **Пятница** | Сдать заполненный еженедельный лист задач менеджеру |


    ---

    **Процедура химчистки:**

    Запустите полный цикл химчистки по инструкции к машине.

    После завершения сделайте фото экрана подтверждения или итогов цикла

    и отправьте в командный чат Telegram с пометкой «Химчистка вторник/четверг — [название точки]».


    **Проверка ценников (понедельник):**

    Пройдите все товары на полке. Сравните ценник с текущим прайсом в Shop Seller.

    При расхождении — сразу обновите ценник. Если ценника нет — распечатайте и прикрепите до открытия.

    '
  title_ka: ყოველკვირეული საკონტროლო სია
  content_ka: 'განმეორებადი დავალებები, რომლებიც უნდა შესრულდეს ყოველ კვირას კონკრეტულ დღეებში.


    | დღე | ამოცანა |

    |---|---|

    | ** ორშაბათი ** | მენეჯერის მიერ დაკისრებული ახალი ამოცანების გადახედვა |

    | ** ორშაბათი ** | გადაამოწმეთ ყველა ფასის ტეგი მიმდინარე ფასების სიაში |

    | ** ორშაბათი ** | განათავსეთ ყოველკვირეული საქონლის შეკვეთა |

    | **სამშაბათი** | ყავის აპარატის ქიმიური წმენდა + ანგარიშის გაგზავნა Telegram chat-ში |

    | ** ხუთშაბათი ** | ყავის აპარატის ქიმიური წმენდა + ანგარიშის გაგზავნა Telegram chat-ში |

    | **პარასკევი** | წარუდგინეთ დასრულებული ყოველკვირეული დავალების ფურცელი მენეჯერს |


    ---

    **ქიმიური წმენდის პროცედურა:**

    ჩაატარეთ ქიმიური გაწმენდის სრული ციკლი მანქანის ინსტრუქციის მიხედვით.

    დასრულების შემდეგ გადაიღეთ დასუფთავების დადასტურების ეკრანის ან ციკლის შეჯამების ფოტო

    და გაუგზავნეთ გუნდის Telegram-ის ჩატში ჩანაწერით "სამშაბათი/ხუთშაბათი დასუფთავება შესრულებულია — [მაღაზიის სახელი]".


    **ფასის შემოწმება (ორშაბათი):**

    გაიარეთ ყველა პროდუქტი თაროზე. შეადარეთ ხილული ფასი მიმდინარე

    ფასების სია მაღაზია გამყიდველში. შეუსაბამობის აღმოჩენის შემთხვევაში, დაუყოვნებლივ განაახლეთ ტეგი.

    თუ ტეგი აკლია, დაბეჭდეთ და მიამაგრეთ მაღაზიის გახსნამდე.'
- slug: monthly-checklist
  section: procedures
  title: Monthly Checklist
  title_en: Monthly Checklist
  title_ru: Ежемесячный чек-лист
  status: published
  content: 'Deep maintenance and audit tasks to be completed once per month.

    Schedule these tasks at the end of the month during a quieter period.


    | Task | Notes |

    |---|---|

    | **Clean and wipe display cabinets and shelves** | Wipe all surfaces of the product stand |

    | **Defrost and clean the fridge** | Full defrost, interior cleaning |

    | **Deep clean coffee machine groups with tablet** | Use manufacturer-approved cleaning tablet |

    | **Wash grinder flasks and clean grinder blades** | Remove flasks fully, wash, dry, reattach. Clean blades carefully.
    |

    | **Check product expiry dates** | Inspect every item on the shelf. Log in the expiry date journal. |

    | **Full inventory** | Complete count of all products. Must be accurate and submitted to manager. |


    ---

    > **Expiry date log:** Use the dedicated expiry journal. Record product name, batch,

    > expiry date, and any action taken (sold, removed, returned to stock).

    > Products approaching expiry must be moved to the front of the display (FIFO rule).

    '
  content_ru: 'Глубокое обслуживание и контрольные задачи — один раз в месяц.

    Планируйте выполнение в конце месяца в более спокойное время.


    | Задача | Примечания |

    |---|---|

    | **Протереть витрины и полки** | Все поверхности торгового стеллажа |

    | **Разморозить и помыть холодильник** | Полная разморозка, мойка камеры |

    | **Глубокая чистка групп кофемашины таблеткой** | Только одобренное производителем средство |

    | **Помыть бункеры кофемолок и почистить жернова** | Бункеры снять полностью, вымыть, высушить, установить. Жернова —
    аккуратно. |

    | **Проверить сроки годности** | Каждая позиция на полке. Запись в журнале сроков. |

    | **Полная инвентаризация** | Пересчёт всего товара. Точность и сдача отчёта менеджеру. |


    ---

    > **Журнал сроков годности:** ведите отдельный журнал: наименование, партия,

    > срок годности, действие (продано, снято, возврат на склад).

    > Товары с приближающимся сроком выкладывайте ближе к покупателю (правило FIFO).

    '
  title_ka: ყოველთვიური ჩამონათვალი
  content_ka: 'ღრმა ტექნიკური და აუდიტის ამოცანები უნდა დასრულდეს თვეში ერთხელ.

    დაგეგმეთ ეს დავალებები თვის ბოლოს უფრო წყნარ პერიოდში.


    | ამოცანა | შენიშვნები |

    |---|---|

    | **გაწმინდეთ და გაწმინდეთ ჩვენების კარადები და თაროები** | წაშალეთ პროდუქტის სადგამის ყველა ზედაპირი |

    | **გაყინეთ და გაასუფთავეთ მაცივარი** | სრული გალღობა, ინტერიერის გაწმენდა |

    | **ღრმა სუფთა ყავის აპარატების ჯგუფები ტაბლეტით ** | გამოიყენეთ მწარმოებლის მიერ დამტკიცებული საწმენდი ტაბლეტი |

    | **გარეცხეთ საფქვავი კოლბები და გაწმინდეთ საფქვავი პირები** | ამოიღეთ კოლბები მთლიანად, გარეცხეთ, გააშრეთ, ხელახლა მიამაგრეთ.
    ფრთხილად გაასუფთავეთ პირები. |

    | ** შეამოწმეთ პროდუქტის ვარგისიანობის ვადები** | შეამოწმეთ ყველა ნივთი თაროზე. შედით ვარგისიანობის თარიღის ჟურნალში.
    |

    | ** სრული ინვენტარი ** | ყველა პროდუქტის სრული რაოდენობა. უნდა იყოს ზუსტი და წარედგინოს მენეჯერს. |


    ---

    > ** ვადის გასვლის თარიღის ჟურნალი:** გამოიყენეთ სპეციალური ვადის გასვლის ჟურნალი. ჩაწერეთ პროდუქტის სახელი, პარტია,

    > ვადის გასვლის თარიღი და განხორციელებული ნებისმიერი ქმედება (გაყიდვა, ამოღება, მარაგში დაბრუნება).

    > პროდუქტი, რომელიც ვადის გასვლას უახლოვდება, უნდა გადაიტანოთ ეკრანის წინა მხარეს (FIFO წესი).'
- slug: dk-service-standards
  section: service-standards
  title: DK Service Standards — Client Interaction Rules
  title_en: DK Service Standards — Client Interaction Rules
  title_ru: Стандарты сервиса DK — правила общения с клиентом
  status: published
  content: "These are the core standards every Dim Kava employee must follow at all times.\nThey define how we present ourselves,\
    \ talk to clients, and sell our products.\nThese are not suggestions — they are the standard.\n\n## Presence and Attitude\n\
    \n- We are always **smiling, making eye contact**, and ready to help with genuine enthusiasm.\n- We **greet every client\
    \ first** — loud and clear.\n- We address **regular clients by name**.\n- We work in **turbo mode** when the store is\
    \ busy.\n\n## Starting the Conversation\n\n- From the first moment, we **ask questions**. We identify needs and find out\n\
    \  their preferences regarding coffee, accessories, and machines.\n- We introduce our coffee simply:\n  > \"We carry Swiss-roasted\
    \ coffee — pure varietals like 100% Arabica, 100% Robusta,\n  > and blends in different ratios.\"\n- We **show 3 packages\
    \ and invite the client to smell them immediately**.\n- We always mention: **specialty beans, hand-picked, highest quality,\
    \ balanced\n  acidity and exceptional aromas**.\n\n## Loyalty Card (Every Client, Every Time)\n\n- Ask about the card\
    \ **loudly and clearly, with enthusiasm**.\n- Explain the benefits just as clearly.\n- If the client doesn't want a card:\
    \ *\"That's a shame — you're missing out on a lot of bonuses and gifts!\"*\n- If the client has a card: **tell them their\
    \ current bonus balance** and how many\n  more cups/packs they need until their next free reward. This drives additional\
    \ sales.\n\n## Cross-Selling and Upselling\n\n- Client buying **coffee** → offer Caotina. Ask if they've tried it. Show\
    \ the aroma.\n  Explain the difference from regular cocoa.\n- Client buying **a drink** → offer snacks: home-made cookies,\
    \ Lomba bars\n  (gluten-free, sugar-free), Choco Choco chocolates.\n  > \"We offer these because the client may not know\
    \ the product exists — if we don't mention it, they won't buy it.\"\n- Client buying **accessories** → offer coffee. Ask\
    \ if they've tasted it. Show genuine interest.\n- **Always use** up-sale and cross-sale techniques actively.\n\n## During\
    \ the Sale\n\n- We **never say \"no\"**. Instead: *\"We have this instead...\"*\n- During promotions: find a way to **mention\
    \ the promotion to every client**.\n  A good manager uses promotions as a tool to hit targets.\n- When a client approaches\
    \ while we're serving another: smile and say *\"One moment, please?\"*\n- Ask every client if they're following **Dim\
    \ Kava Georgia on Instagram and Facebook**.\n\n## Serving the Drink\n\n- After preparing: announce the drink — *\"Your\
    \ espresso Lila Rosa! Enjoy!\"*\n- Hold the cup from below when handing it over.\n\n## Closing and Farewell\n\n- Close\
    \ every interaction warmly and clearly:\n  > \"Have a great day, we look forward to seeing you again! I hope you enjoy\
    \ it!\n  > Next time try [product]... Thank you! Thank you so much!\"\n- Do **not** use the expression \"АРАПPИЗ\" (or\
    \ any local slang equivalent).\n\n## Staying on Track\n\n- Monitor Telegram during the working day — both on the work\
    \ computer and on your phone.\n- Throughout the day, actively track progress against the daily sales plan.\n- Discuss\
    \ results with the manager at the end of the day.\n"
  content_ru: "Это базовые стандарты, которым должен следовать каждый сотрудник Dim Kava всегда.\nОни определяют, как мы выглядим,\
    \ как общаемся с клиентами и как продаём.\nЭто не рекомендации — это норма.\n\n## Присутствие и настрой\n\n- Мы всегда\
    \ **улыбаемся, поддерживаем зрительный контакт** и готовы помочь по-настоящему.\n- Мы **здороваемся с каждым клиентом\
    \ первыми** — громко и чётко.\n- Мы обращаемся к **постоянным клиентам по имени**.\n- В час пик работаем в **режиме турбо**.\n\
    \n## Начало разговора\n\n- С первых секунд **задаём вопросы**. Выясняем потребности и предпочтения\n  по кофе, аксессуарам\
    \ и технике.\n- Представляем кофе простыми словами:\n  > «У нас швейцарская обжарка — моносорта 100% арабика, 100% робуста\n\
    \  > и бленды в разных пропорциях.»\n- **Показываем три упаковки и сразу предлагаем понюхать.**\n- Всегда упоминаем: **спешелти,\
    \ ручной сбор, высокое качество, сбалансированная\n  кислотность и выразительная ароматика.**\n\n## Карта лояльности (каждый\
    \ клиент, каждый раз)\n\n- Спрашиваем про карту **громко, чётко и с энтузиазмом**.\n- Объясняем выгоды так же ясно.\n\
    - Если клиент не хочет карту: *«Жаль — вы упускаете много бонусов и подарков!»*\n- Если карта есть: **назовите текущий\
    \ баланс бонусов** и сколько ещё чашек/упаковок\n  до следующего подарка — это стимулирует допродажи.\n\n## Допродажи\
    \ и апсейл\n\n- Клиент покупает **кофе** → предложите Caotina. Спросите, пробовал ли. Пусть почует аромат.\n  Объясните\
    \ отличие от обычного какао.\n- Клиент покупает **напиток** → предложите снеки: домашнее печенье, батончики Lomba\n  (без\
    \ глютена, без сахара), Choco Choco.\n  > «Мы предлагаем это потому что клиент может не знать, что товар есть — если мы\
    \ не скажем, он не купит.»\n- Клиент покупает **аксессуары** → предложите кофе. Спросите, пробовал ли. Проявите искренний\
    \ интерес.\n- **Всегда** используйте апсейл и кросс-сейл активно.\n\n## Во время продажи\n\n- Мы **никогда не говорим\
    \ «нет»**. Вместо этого: *«У нас есть вот это…»*\n- В акции: найдите способ **упомянуть акцию каждому клиенту**.\n- Когда\
    \ подходит второй клиент: улыбнитесь и скажите *«Одну минуту, пожалуйста?»*\n- Спросите у каждого, подписан ли он на **Dim\
    \ Kava Georgia в Instagram и Facebook**.\n\n## Подача напитка\n\n- После приготовления объявите напиток: *«Ваш эспрессо\
    \ Lila Rosa! Приятного!»*\n- Передавайте чашку, держа её снизу.\n\n## Завершение и прощание\n\n- Завершайте тепло и ясно:\n\
    \  > «Хорошего дня, будем рады видеть снова! Надеюсь, понравится!\n  > В следующий раз попробуйте [товар]… Спасибо большое!»\n\
    - Не используйте сленг вроде «араппиз» и аналоги.\n\n## Контроль дня\n\n- Следите за Telegram в течение дня — и с рабочего\
    \ ПК, и с телефона.\n- Активно отслеживайте выполнение плана продаж.\n- В конце дня обсудите результат с менеджером.\n"
  title_ka: DK სერვისის სტანდარტები — კლიენტთან ურთიერთობის წესები
  content_ka: "ეს არის ძირითადი სტანდარტები, რომლებიც Dim Kava-ს ყველა თანამშრომელმა ყოველთვის უნდა დაიცვას.\nისინი განსაზღვრავენ,\
    \ თუ როგორ წარმოვადგენთ საკუთარ თავს, ვესაუბრებით კლიენტებს და ვყიდით ჩვენს პროდუქტებს.\nეს არ არის წინადადებები - ისინი\
    \ სტანდარტია.\n\n## ყოფნა და დამოკიდებულება\n\n- ჩვენ ყოველთვის **ვიღიმებით, ვიმყარებთ თვალით** და მზად ვართ დაგეხმაროთ\
    \ ნამდვილი ენთუზიაზმით.\n- ჩვენ **პირველ რიგში მივესალმებით თითოეულ კლიენტს** - ხმამაღლა და გარკვევით.\n- **რეგულარულ\
    \ კლიენტებს სახელით მივმართავთ**.\n- ჩვენ ვმუშაობთ **ტურბო რეჟიმში** როცა მაღაზია დატვირთულია.\n\n## საუბრის დაწყება\n\
    \n- პირველივე მომენტიდან **ვსვამთ კითხვებს**. ჩვენ ვადგენთ საჭიროებებს და ვიგებთ\n  მათი პრეფერენციები ყავასთან, აქსესუარებთან\
    \ და მანქანებთან დაკავშირებით.\n- წარმოგიდგენთ ჩვენს ყავას უბრალოდ:\n  > „ჩვენ ვატარებთ შვეიცარიულ მოხალულ ყავას - სუფთა\
    \ ჯიშები, როგორიცაა 100% არაბიკა, 100% რობუსტა,\n  > და ერწყმის სხვადასხვა თანაფარდობას.\"\n- ჩვენ **ვაჩვენებთ 3 პაკეტს\
    \ და ვიწვევთ კლიენტს, რომ დაუყონებლივ ისუნთქოს მათ**.\n- ყოველთვის აღვნიშნავთ: **სპეციალობის ლობიო, ხელით დაკრეფილი, უმაღლესი\
    \ ხარისხის, დაბალანსებული\n  მჟავიანობა და განსაკუთრებული არომატები**.\n\n## ლოიალობის ბარათი (ყოველი კლიენტი, ყოველ ჯერზე)\n\
    \n- იკითხეთ ბარათის შესახებ **ხმამაღლა და გარკვევით, ენთუზიაზმით**.\n- ისევე ნათლად ახსენით სარგებელი.\n- თუ კლიენტს არ\
    \ სურს ბარათი: *\"სირცხვილია - ბევრ ბონუსს და საჩუქრებს კარგავთ!\"*\n- თუ კლიენტს აქვს ბარათი: **უთხარით მათ მიმდინარე\
    \ ბონუს ბალანსი** და რამდენი\n  მეტი ფინჯანი/შეფუთვა მათ სჭირდებათ მომდევნო უფასო ჯილდომდე. ეს იწვევს დამატებით გაყიდვებს.\n\
    \n## ჯვარედინი გაყიდვები და გაყიდვები\n\n- კლიენტი ყიდულობს **ყავას** → გთავაზობთ კაოტინას. ჰკითხეთ, სცადეს თუ არა. აჩვენე\
    \ არომატი.\n  ახსენით განსხვავება ჩვეულებრივი კაკაოსგან.\n- კლიენტი ყიდულობს **სასმელს** → გთავაზობთ საჭმელს: სახლში დამზადებული\
    \ ნამცხვრები, ლომბა ბარები\n  (უგლუტენო, უშაქრო), Choco Choco შოკოლადები.\n  > \"ჩვენ ვთავაზობთ მათ, რადგან კლიენტმა შეიძლება\
    \ არ იცოდეს პროდუქტის არსებობა - თუ არ აღვნიშნავთ, არ იყიდის.\"\n- კლიენტი ყიდულობს **აქსესუარებს** → გთავაზობთ ყავას.\
    \ ჰკითხეთ, გასინჯეს თუ არა. გამოიჩინეთ გულწრფელი ინტერესი.\n- ** ყოველთვის აქტიურად გამოიყენეთ ** გაყიდვებისა და ჯვარედინი\
    \ გაყიდვების ტექნიკა.\n\n## გაყიდვის დროს\n\n- ჩვენ **არასდროს ვამბობთ \"არას\"**. ამის ნაცვლად: *\"ჩვენ გვაქვს ამის ნაცვლად...\"\
    *\n- აქციების დროს: იპოვეთ გზა, რომ ** აღნიშნოთ აქცია ყველა კლიენტს**.\n  კარგი მენეჯერი იყენებს აქციებს, როგორც მიზნების\
    \ მისაღწევად.\n- როცა კლიენტი უახლოვდება მაშინ, როცა მეორეს ვემსახურებით: გაიღიმე და უთხარი *\"ერთ წამს, გთხოვ?\"*\n-\
    \ ჰკითხეთ თითოეულ კლიენტს, თვალს ადევნებს თუ არა **Dim Kava Georgia-ს Instagram-სა და Facebook-ზე**.\n\n## მიირთვით სასმელი\n\
    \n- მომზადების შემდეგ: გამოაცხადეთ სასმელი — *\"თქვენი ესპრესო ლილა როზა! მიირთვით!\"*\n- ჩაბარებისას ჭიქა ქვემოდან დაიჭირეთ.\n\
    \n## დახურვა და დამშვიდობება\n\n- დახურეთ ყოველი ურთიერთქმედება თბილად და მკაფიოდ:\n  > \"კარგ დღეს გისურვებთ, მოუთმენლად\
    \ ველით თქვენთან შეხვედრას! იმედია ისიამოვნებთ!\n  > შემდეგ ჯერზე სცადეთ [პროდუქტი]... გმადლობთ! დიდი მადლობა!\"\n- **არ**\
    \ გამოიყენოთ გამოთქმა „АРАППИЗ“ (ან ადგილობრივი ჟარგონის ექვივალენტი).\n\n## გზაზე დარჩენა\n\n- დააკვირდით Telegram-ს\
    \ სამუშაო დღის განმავლობაში — როგორც სამუშაო კომპიუტერზე, ასევე თქვენს ტელეფონზე.\n- მთელი დღის განმავლობაში, აქტიურად\
    \ ადევნეთ თვალყური პროგრესს ყოველდღიური გაყიდვების გეგმის მიხედვით.\n- განიხილეთ შედეგები მენეჯერთან დღის ბოლოს."
