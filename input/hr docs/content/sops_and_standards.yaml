- slug: daily-checklist
  section: procedures
  title: Daily Checklist — Morning to Close
  title_en: Daily Checklist — Morning to Close
  title_ru: Ежедневный чек-лист — от открытия до закрытия
  status: published
  content: "This checklist covers every task that must be completed each working day,\nfrom opening to closing. All items\
    \ are mandatory. The shift is not considered\ncomplete until every step is done.\n\n## Opening (Start of Day)\n\n1. **Clock\
    \ in** — Register your card/attendance in the programme at 9:30 or 15:45 (depending on shift).\n2. **Switch on** — Lights,\
    \ security camera, TV, coffee machine, Shop Seller, Telegram.\n3. **Accept the shift register** — Cash in the till must\
    \ match the previous evening's Shop Seller balance.\n4. **Open the daily plan file** — Set your personal sales goal for\
    \ the day. Fill it in at end of shift.\n\n## During the Day\n\n5. **Consumables** — Replenish take-away zone supplies\
    \ throughout the day. Empty and clean bins.\n6. **Dust** — Wipe dust from all products and shelves.\n7. **Price tags**\
    \ — Check every product has a price tag that matches the Shop Seller price list.\n8. **Stock control** — Monitor stock\
    \ levels throughout the day so nothing runs out.\n9. **Client workflow** (always follow this sequence):\n   - Greet the\
    \ client warmly, identify their needs\n   - Enter the order in Shop Seller\n   - Scan the DK loyalty card\n   - Process\
    \ payment\n   - Issue the receipt\n   - Prepare the order\n10. **Loyalty card** — Ask every client about their card. Inform\
    \ about current promotions and competitions.\n11. **Coffee preparation** — Always prepare to standard. No exceptions.\n\
    12. **Latte art** — Apply latte art technique. Send photos of your work to the team Telegram chat.\n13. **Display cleanliness**\
    \ — Keep display cases, cabinets, fridge, and pastry bowls clean.\n14. **Coffee packaging alignment** — Keep all coffee\
    \ packaging neat and tidy throughout the day.\n15. **Inventory** — Conduct the daily inventory correctly and completely.\n\
    \n## Closing (End of Day)\n\n16. **Cash register reconciliation** — Fill in the register (granite). Total must match the\
    \ amount shown in the top-right corner of the register programme.\n17. **Record cash expenses** — Enter all cash expense\
    \ amounts in Shop Seller with a mandatory description of each item.\n18. **Accounting sheets** — Fill in accounting sheets\
    \ with Z-reports from all payment terminals at end of day.\n19. **Close the day** — Run the end-of-day close procedure\
    \ in Shop Seller.\n20. **Clean the coffee machines** — Wash and clean machines, holders, grinder flasks. Clean shelves\
    \ and floor.\n21. **Secure and lock** — Switch off lights, set the alarm, lock the store according to the security procedure.\n\
    \n---\n> **Note:** Steps 16–18 relate to financial reporting and must never be skipped.\n> Discrepancies between the register\
    \ and Shop Seller must be flagged to the manager immediately.\n"
