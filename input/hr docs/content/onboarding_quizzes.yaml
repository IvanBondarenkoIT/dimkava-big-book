# Onboarding Quizzes — All Checkpoint Questionnaires
# Sources: Опросник трех дней, 1 недели, 2 недели, 3 недели, 1 месяца, 2 месяцев, 3 месяцев
#          + Вопросник по итогам одного месяца, Вопросы Shop Seller
#          + Опросник по оценке нового сотрудника
# Django model: Lesson (lesson_type=quiz) inside a Course / OnboardingModule
# Usage: Each quiz is a checkpoint after completing the corresponding onboarding module

# ---------------------------------------------------------------------------
# QUIZ TIMELINE:
#   Day 3     → First knowledge check (basic company + coffee + sales)
#   Week 1    → Coffee knowledge + drink preparation + equipment basics
#   Week 2    → Milk drinks + Caotina + Delonghi + sales techniques
#   Week 3    → Specialty + Blaser range + consultation skills
#   Month 1   → Full operations: counter, Shop Seller, inventory, discounts
#   Month 2   → Equipment expertise: machines, grinders, brands
#   Month 3   → Advanced: cupping, expert sales, mentoring
# ---------------------------------------------------------------------------

quizzes:

  - slug: quiz-day-3
    title: "Quiz — After 3 Days"
    onboarding_module_slug: days-2-3
    passing_score: 70
    description: "First checkpoint. Tests basic knowledge of the company, espresso, and coffee range."
    sections:

      - title: "Day 1 — Company & Role"
        questions:
          - text: "What tasks are set for employees and the new hire at the start of the working day?"
            type: open
          - text: "Why do we do a morning tasting and how many espresso cups do we taste during the day?"
            type: open
          - text: "What is the mission of Dim Kava?"
            type: open
          - text: "Who is the general importer of Blaser coffee?"
            type: open
          - text: "What career opportunities are available to Dim Kava employees?"
            type: open
          - text: "What rules and standards of conduct for a manager on the floor do you remember?"
            type: open
          - text: "What is espresso? Describe its characteristics and benefits."
            type: open
          - text: "What drink quality criteria must you monitor?"
            type: open
          - text: "What is the difference between monosorts and blends (bukety)?"
            type: open
          - text: "Who is a barista?"
            type: open

      - title: "Day 2 — Growing & Roasting"
        questions:
          - text: "Where and how does green coffee grow?"
            type: open
          - text: "What coffee tree species do you know?"
            type: open
          - text: "What Blaser coffee brands and types are available at Dim Kava?"
            type: open
          - text: "What types of roasting exist and how do they affect the taste?"
            type: open
          - text: "How should a cup of coffee be presented to the client?"
            type: open
          - text: "What are up-sale and cross-sale? Give an example of each."
            type: open
          - text: "What must you check when switching on the coffee equipment?"
            type: open
          - text: "How many coffee machines must you test each day?"
            type: open

      - title: "Day 3 — Processing, Grinding & Client"
        questions:
          - text: "Name the main methods of coffee bean processing."
            type: open
          - text: "What types of roasting are there and how does the chemical composition change during roasting?"
            type: open
          - text: "What do you know about decaf coffee?"
            type: open
          - text: "How should roasted coffee be stored correctly?"
            type: open
          - text: "Which grind size suits which preparation method (espresso, filter, Turkish)?"
            type: open
          - text: "What phrases do you use to greet a client?"
            type: open
          - text: "What bonuses does the Dim Kava loyalty card offer?"
            type: open
          - text: "What difficulties have you encountered working at the counter?"
            type: open
          - text: "What would you like to learn better at the next stage?"
            type: open

      - title: "Self-Assessment"
        questions:
          - text: "How confident do you feel at your workstation? (Rate 1–5)"
            type: rating
            min: 1
            max: 5
          - text: "Which topics would you like to review?"
            type: open
          - text: "What questions do you still have?"
            type: open

