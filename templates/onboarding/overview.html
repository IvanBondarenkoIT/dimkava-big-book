{% extends 'base.html' %}
{% block title %}Onboarding{% endblock %}
{% block content %}
<section class="mb-10">
  <h1 class="font-headline text-4xl font-extrabold text-primary tracking-tight mb-2">Your Onboarding Journey</h1>
  <p class="text-on-surface-variant font-medium">Progress: {{ progress }}%</p>
</section>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
  {% for m in modules %}
  <a href="{% url 'onboarding:module_detail' m.slug %}" class="block bg-surface-container-lowest p-6 rounded-lg hover:shadow-lg transition-all no-underline text-inherit">
    <span class="px-3 py-1 rounded-full text-[10px] font-bold
      {% if m.status == 'completed' %}bg-secondary text-white
      {% elif m.status == 'in_progress' %}bg-primary-container text-on-surface
      {% else %}bg-surface-container-highest text-on-surface-variant{% endif %}">{{ m.status|title }}</span>
    <h3 class="text-xl font-bold mt-4">{{ m.title }}</h3>
    <p class="text-sm text-on-surface-variant mt-2">{{ m.minutes }} min</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
