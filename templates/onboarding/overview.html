{% extends 'base.html' %}
{% block title %}Onboarding{% endblock %}
{% block content %}
<div class="space-y-8">
  <header>
    <h1 class="text-5xl font-extrabold tracking-tighter text-primary">Your Onboarding Journey</h1>
    <p class="text-on-surface-variant/70 mt-2">Progress: {{ progress }}%</p>
  </header>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    {% for m in modules %}
    <a href="{% url 'onboarding:module_detail' m.slug %}" class="card-atelier block no-underline text-inherit group">
      <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase
        {% if m.status == 'completed' %}bg-secondary text-white
        {% elif m.status == 'in_progress' %}bg-primary-container text-on-surface
        {% else %}bg-surface-container-highest text-on-surface-variant{% endif %}">{{ m.status|title }}</span>
      <h3 class="text-xl font-bold mt-4 text-on-surface group-hover:text-primary transition-colors">{{ m.title }}</h3>
      <p class="text-sm text-on-surface-variant/70 mt-2">{{ m.minutes }} min</p>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
