{% extends 'base.html' %}
{% block title %}{{ department_name }}{% endblock %}
{% block content %}
<section class="mb-10">
  <h1 class="font-headline text-4xl font-extrabold text-primary tracking-tight mb-2">{{ department_name }}</h1>
</section>
<ul class="space-y-4">
  {% for r in roles %}
  <li class="p-6 bg-surface-container-low rounded-lg">
    <h3 class="font-bold">{{ r.title }}</h3>
    <p class="text-sm text-on-surface-variant">{{ r.description }}</p>
  </li>
  {% endfor %}
</ul>
{% endblock %}
