{% extends 'base.html' %}
{% block title %}Departments{% endblock %}
{% block content %}
<div class="space-y-8">
  <header>
    <h1 class="text-5xl font-extrabold tracking-tighter text-primary">Departments</h1>
  </header>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    {% for d in departments %}
    <a href="{% url 'departments:detail' d.slug %}" class="card-atelier block no-underline text-inherit group">
      <h3 class="text-xl font-bold text-on-surface group-hover:text-primary transition-colors">{{ d.name }}</h3>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
