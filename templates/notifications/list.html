{% extends 'base.html' %}
{% block title %}Notifications{% endblock %}
{% block content %}
<section class="mb-10">
  <h1 class="font-headline text-4xl font-extrabold text-primary tracking-tight mb-2">Notifications</h1>
</section>
<div class="space-y-2 max-w-2xl">
  {% for n in notifications %}
  <div class="p-4 bg-surface-container-low rounded-lg {% if not n.read %}border-l-4 border-primary{% endif %}">
    <p>{{ n.text }}</p>
    <p class="text-xs text-on-surface-variant mt-1">{{ n.date }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
