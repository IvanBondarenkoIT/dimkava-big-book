{% extends 'base.html' %}
{% block title %}News{% endblock %}
{% block content %}
<section class="mb-10">
  <h1 class="font-headline text-4xl font-extrabold text-primary tracking-tight mb-2">News & Announcements</h1>
</section>
<div class="space-y-4 max-w-3xl">
  {% for n in news %}
  <a href="{% url 'news:detail' n.slug %}" class="block p-6 bg-surface-container-lowest rounded-lg hover:shadow-lg no-underline text-inherit">
    {% if n.pinned %}<span class="text-primary text-xs font-bold">PINNED</span>{% endif %}
    <h3 class="text-xl font-bold mt-2">{{ n.title }}</h3>
    <p class="text-sm text-on-surface-variant">{{ n.date }} • {{ n.tag }}</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
