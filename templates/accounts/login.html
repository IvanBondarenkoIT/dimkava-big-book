<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dim Kava | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#8e4e14', 'primary-container': '#f4a261', surface: '#fbf9f5', 'surface-container-lowest': '#ffffff', 'on-surface-variant': '#534439' } } } }
  </script>
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400}.coffee-gradient{background:linear-gradient(135deg,#8e4e14 0%,#f4a261 100%)}</style>
</head>
<body class="bg-surface text-on-surface-variant min-h-screen flex flex-col items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <div class="w-16 h-16 coffee-gradient rounded-xl flex items-center justify-center mx-auto shadow-lg">
        <span class="material-symbols-outlined text-white text-4xl">coffee</span>
      </div>
      <h1 class="text-3xl font-extrabold text-primary mt-4">Dim Kava</h1>
      <p class="text-sm uppercase tracking-widest text-on-surface-variant/60">Internal Learning Portal</p>
    </div>
    <div class="bg-surface-container-lowest rounded-xl shadow-xl p-8 border border-white/50">
      <h2 class="text-xl font-bold text-primary mb-6">Sign in</h2>
      <form class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-2">Email</label>
          <input type="email" placeholder="you@dimkava.ge" class="w-full px-4 py-3 bg-surface rounded-lg border-0 focus:ring-2 focus:ring-primary/20"/>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Password</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-surface rounded-lg border-0 focus:ring-2 focus:ring-primary/20"/>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="remember" class="rounded text-primary focus:ring-primary"/>
          <label for="remember" class="text-sm">Remember me</label>
        </div>
        <button type="submit" class="w-full coffee-gradient text-white py-3 rounded-full font-bold hover:opacity-90 transition-opacity">Sign in</button>
      </form>
      <p class="mt-4 text-center text-sm"><a href="/" class="text-primary font-semibold hover:underline">Continue as guest →</a></p>
    </div>
  </div>
</body>
</html>
