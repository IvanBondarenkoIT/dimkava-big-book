{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dim Kava | Login</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}?v=4" fetchpriority="high"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface-variant min-h-screen flex flex-col items-center justify-center p-6 antialiased">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <div class="w-16 h-16 coffee-gradient rounded-xl flex items-center justify-center mx-auto shadow-xl">
        <span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1;">coffee</span>
      </div>
      <h1 class="text-3xl font-extrabold text-primary mt-4">Dim Kava</h1>
      <p class="text-sm uppercase tracking-widest text-on-surface-variant/60">Internal Learning Portal</p>
    </div>
    <div class="card-atelier p-8 shadow-xl">
      <h2 class="text-xl font-bold text-primary mb-6">Sign in</h2>
      <form class="space-y-4" method="post" action="">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}"/>{% endif %}
        <div>
          <label class="block text-sm font-semibold mb-2 text-on-surface">Email</label>
          <input type="email" name="username" placeholder="you@dimkava.ge" class="w-full px-4 py-3 bg-surface-container-high rounded-lg border-0 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-on-surface-variant/40"/>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2 text-on-surface">Password</label>
          <input type="password" name="password" placeholder="••••••••" class="w-full px-4 py-3 bg-surface-container-high rounded-lg border-0 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-on-surface-variant/40"/>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="remember" name="remember" class="rounded text-primary focus:ring-primary"/>
          <label for="remember" class="text-sm">Remember me</label>
        </div>
        <button type="submit" class="w-full btn-primary">Sign in</button>
      </form>
      <p class="mt-4 text-center text-sm">
        <a href="{% url 'password_reset' %}" class="text-on-surface-variant/60 hover:text-primary">Forgot password?</a>
      </p>
    </div>
  </div>
</body>
</html>
