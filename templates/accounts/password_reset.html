{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-3xl font-extrabold text-primary mb-4">Reset password</h1>
  <p class="text-on-surface-variant/80 mb-6">Enter your email and we'll send you a link to reset your password.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="id_email" class="block text-sm font-semibold mb-2 text-on-surface">Email</label>
      <input type="email" name="email" id="id_email" required
        class="w-full px-4 py-3 bg-surface-container-high rounded-lg border-0 focus:ring-2 focus:ring-primary/20 text-on-surface"
        placeholder="you@dimkava.ge"/>
    </div>
    <button type="submit" class="btn-primary">Send reset link</button>
  </form>
  <p class="mt-4"><a href="{% url 'login' %}" class="text-on-surface-variant/60 hover:text-primary">← Back to login</a></p>
</div>
{% endblock %}
