{% extends 'base.html' %}
{% block title %}Email sent{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center">
  <h1 class="text-3xl font-extrabold text-primary mb-4">Check your email</h1>
  <p class="text-on-surface-variant/80 mb-6">If an account exists with that email, we've sent you a link to reset your password.</p>
  <p><a href="{% url 'login' %}" class="text-primary font-semibold hover:underline">← Back to login</a></p>
</div>
{% endblock %}
