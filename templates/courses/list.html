{% extends 'base.html' %}
{% block title %}Courses{% endblock %}
{% block content %}
<section class="mb-10">
  <h1 class="font-headline text-4xl font-extrabold text-primary tracking-tight mb-2">Curriculum</h1>
  <p class="text-on-surface-variant font-medium">Browse all courses</p>
</section>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  {% for c in courses %}
  <a href="{% url 'courses:detail' c.slug %}" class="block bg-surface-container-lowest p-6 rounded-lg hover:shadow-lg transition-all no-underline text-inherit">
    <h3 class="text-xl font-bold text-primary">{{ c.title }}</h3>
    <p class="text-sm text-on-surface-variant mt-2">{{ c.category }} — {{ c.progress }}%</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
