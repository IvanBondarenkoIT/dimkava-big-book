{% extends 'base.html' %}
{% load kb_filters i18n %}
{% block title %}{{ article_title }}{% endblock %}
{% block content %}
<div class="space-y-8 max-w-3xl">
  <header>
    <a href="{% url 'knowledge_base:section' section_slug %}" class="inline-flex items-center gap-2 text-on-surface-variant/60 hover:text-primary font-medium transition-colors mb-4 no-underline">
      <span class="material-symbols-outlined text-lg">arrow_back</span>
      {% trans "Back to" %} {{ section_title }}
    </a>
    <h1 class="text-5xl font-extrabold tracking-tighter text-primary">{{ article_title }}</h1>
  </header>
  <div class="card-atelier prose prose-invert max-w-none text-on-surface-variant">
    {{ article.localized_content|kb_markdown }}
  </div>
</div>
{% endblock %}
