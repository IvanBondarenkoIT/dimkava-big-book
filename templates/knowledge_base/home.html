{% extends 'base.html' %}
{% block title %}Knowledge Base{% endblock %}
{% block content %}
<section class="mb-10">
  <h1 class="font-headline text-4xl font-extrabold text-primary tracking-tight mb-2">Knowledge Base</h1>
  <p class="text-on-surface-variant font-medium">Procedures, standards, company info</p>
</section>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  {% for s in sections %}
  <a href="{% url 'knowledge_base:section' s.slug %}" class="block bg-surface-container-lowest p-6 rounded-lg hover:shadow-lg transition-all no-underline text-inherit">
    <h3 class="text-xl font-bold text-primary">{{ s.title }}</h3>
  </a>
  {% endfor %}
</div>
{% endblock %}
