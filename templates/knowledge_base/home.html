{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Knowledge Base" %}{% endblock %}
{% block content %}
<div class="space-y-8">
  <header>
    <h1 class="text-5xl font-extrabold tracking-tighter text-primary">{% trans "Knowledge Base" %}</h1>
    <p class="text-on-surface-variant/70 mt-2">{% trans "Procedures, standards, company info" %}</p>
  </header>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    {% for s in sections %}
    <a href="{% url 'knowledge_base:section' s.slug %}" class="card-atelier block no-underline text-inherit group">
      <h3 class="text-xl font-bold text-on-surface group-hover:text-primary transition-colors">{{ s.title }}</h3>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
