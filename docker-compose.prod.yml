# Dim Kava — production stack (Windows Server / Docker Desktop)
# Usage (on server in C:\dimkava\compose):
#   run deploy/scripts/new-env-prod.ps1, fill secrets in .env.prod
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

name: dimkava-prod

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dimkava}
      POSTGRES_USER: ${POSTGRES_USER:-dimkava}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dimkava} -d ${POSTGRES_DB:-dimkava}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: ${DIMKAVA_IMAGE:?Set DIMKAVA_IMAGE in .env.prod, e.g. ghcr.io/owner/dimkava-big-book:latest}
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-dimkava}
      POSTGRES_USER: ${POSTGRES_USER:-dimkava}
      PORT: "8000"
    volumes:
      - media_data:/app/media
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
